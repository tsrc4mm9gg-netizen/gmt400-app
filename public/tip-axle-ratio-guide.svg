<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Liczenie obrotów przy otwartym mechanizmie różnicowym</title><desc id="desc">Jedno koło nieruchome, drugie dwa pełne obroty. Policz obroty wału. Schemat nie pokazuje punktów podparcia.</desc><rect width="900" height="560" fill="#111827"/><g font-family="sans-serif" fill="#f9fafb"><text x="35" y="45" font-size="27">PRZEŁOŻENIE — co liczyć?</text><text x="35" y="80" font-size="20">Tylko wariant: otwarty mechanizm, drugie koło nieruchome</text><path d="M205 275 H695 M450 275 V130" fill="none" stroke="#9ca3af" stroke-width="24"/><circle cx="450" cy="275" r="53" fill="#374151" stroke="#d1d5db" stroke-width="3"/><rect x="140" y="205" width="80" height="140" rx="25" fill="#374151" stroke="#d1d5db" stroke-width="4"/><rect x="680" y="205" width="80" height="140" rx="25" fill="#374151" stroke="#d1d5db" stroke-width="4"/><path d="M140 275 H220 M680 275 H760 M430 160 H470" stroke="#d9d9de" stroke-width="9"/><text x="65" y="390" font-size="23">Koło nieruchome</text><text x="615" y="390" font-size="23">Koło: 2 pełne obroty</text><text x="495" y="145" font-size="21">Wał — policz obroty</text><text x="345" y="340" font-size="18">Mechanizm różnicowy</text><text x="35" y="450" font-size="23">Przykład: ok. 3,73 obrotu wału → przełożenie ok. 3,73:1</text><text x="35" y="492" font-size="18">Żółte kreski: miejsca oznaczeń kredą. Rysunek nie pokazuje podnoszenia auta.</text><text x="35" y="530" font-size="18">Schemat poglądowy · nie stosuj tego wariantu bez rozpoznania mechanizmu.</text></g></svg>
