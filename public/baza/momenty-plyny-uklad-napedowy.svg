<text x="870" y="40" font-size="16" fill="#a3a3a3" text-anchor="end">gmt400.pl · schemat</text>
<text x="30" y="76" font-size="29" fill="#f5f5f5" font-weight="bold">Momenty (N·m) i płyny (litry): wał, most,</text>
