<text x="30" y="175" font-size="20" fill="#d4d4d8">Haynes 1988–95 i SM GM 1998–99. Przeliczenie: 1 ft-lb = 1,356 N·m; 1</text>
<text x="30" y="202" font-size="20" fill="#d4d4d8">qt = 0,946 l.</text>
