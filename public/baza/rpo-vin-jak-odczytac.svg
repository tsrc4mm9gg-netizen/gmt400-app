<text x="310" y="1124" font-size="17" fill="#d4d4d8">6.5 V8 turbodiesel</text>
<text x="680" y="1124" font-size="17" fill="#d4d4d8">1992–2000 /</text>
<text x="680" y="1147" font-size="17" fill="#d4d4d8">1994–2000</text>
