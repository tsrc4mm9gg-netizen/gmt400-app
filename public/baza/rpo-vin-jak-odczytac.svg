<text x="40" y="1293" font-size="17" fill="#f5f5f5" font-weight="bold">GU4 3,08 · GU6 3,42 ·</text>
<text x="40" y="1316" font-size="17" fill="#f5f5f5" font-weight="bold">GT4 3,73 · GT5 4,10</text>
<text x="310" y="1293" font-size="17" fill="#d4d4d8">przełożenie tylnego mostu</text>
<text x="680" y="1293" font-size="17" fill="#d4d4d8">wg GM, zależnie</text>
<text x="680" y="1316" font-size="17" fill="#d4d4d8">od roku</text>
<rect x="30" y="1333" width="840" height="83" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="40" y="1357" font-size="17" fill="#f5f5f5" font-weight="bold">NP1 / NP8</text>
<text x="310" y="1357" font-size="17" fill="#d4d4d8">skrzynia rozdzielcza: NP1</text>
<text x="310" y="1380" font-size="17" fill="#d4d4d8">elektroniczna 2-zakresowa; NP8</text>
<text x="310" y="1403" font-size="17" fill="#d4d4d8">2-zakresowa, przyciski</text>
<text x="680" y="1357" font-size="17" fill="#d4d4d8">1996–2000 /</text>
<text x="680" y="1380" font-size="17" fill="#d4d4d8">1999–2000</text>
<rect x="30" y="1436" width="8" height="30" fill="#d4d4d8"/>
<text x="50" y="1458" font-size="24" fill="#f5f5f5" font-weight="bold">Gdzie szukać w aucie</text>
<rect x="30" y="1482" width="840" height="128" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="44" y="1514" font-size="18" fill="#f5f5f5">1. Etykieta „Service Parts Identification” w schowku (glove box): VIN,</text>
<text x="44" y="1540" font-size="18" fill="#f5f5f5">model, lakier i lista opcji RPO — nie zdejmuj jej.</text>
<text x="44" y="1566" font-size="18" fill="#f5f5f5">2. Tabliczka VIN z przodu deski po stronie kierowcy, widoczna przez szybę;</text>
<text x="44" y="1592" font-size="18" fill="#f5f5f5">VIN też na naklejce Vehicle Certification i w dowodzie rejestracyjnym.</text>
<line x1="30" y1="1626" x2="870" y2="1626" stroke="#3f3f46" stroke-width="2"/>
<text x="30" y="1654" font-size="17" fill="#a3a3a3">Źródła: instrukcje obsługi GM 1994–99 (VIN, etykieta SPID: Tahoe/Suburban 1999 s.</text>
<text x="30" y="1678" font-size="17" fill="#a3a3a3">6-59; C/K 1996 s. 6-66/6-67); GM Heritage Center Vehicle Information Kits 1988–99;</text>
<text x="30" y="1702" font-size="17" fill="#a3a3a3">SM GM 1998–2000 (RPO Code List); 49 CFR § 565.15. Sprawdź w swoim aucie / manualu</text>
<text x="30" y="1726" font-size="17" fill="#a3a3a3">— kod silnika w VIN zależy od roku i DMC; lata RPO dotyczą ciężarówek C/K.</text>
