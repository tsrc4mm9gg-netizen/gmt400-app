<text x="40" y="585" font-size="18" fill="#e4e4e7" font-weight="bold">Lata</text>
<text x="230" y="585" font-size="18" fill="#e4e4e7" font-weight="bold">Kod → silnik</text>
<rect x="30" y="599" width="840" height="89" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="40" y="624" font-size="18" fill="#f5f5f5" font-weight="bold">1994–95</text>
<text x="230" y="624" font-size="18" fill="#d4d4d8">Z = 4.3 V6 TBI; H = 5.0 V8 TBI; K = 5.7 V8 TBI; N = 7.4 V8</text>
<text x="230" y="649" font-size="18" fill="#d4d4d8">TBI; P = 6.5 diesel wolnossący; S = 6.5 turbodiesel</text>
<text x="230" y="674" font-size="18" fill="#d4d4d8">(lekki); F = 6.5 turbodiesel (ciężki)</text>
<rect x="30" y="692" width="840" height="64" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="40" y="717" font-size="18" fill="#f5f5f5" font-weight="bold">1996–98 benzyna</text>
<text x="230" y="717" font-size="18" fill="#d4d4d8">W = Vortec 4300 V6 (L35); M = Vortec 5000 (L30); R =</text>
<text x="230" y="742" font-size="18" fill="#d4d4d8">Vortec 5700 (L31); J = Vortec 7400 (L29)</text>
<rect x="30" y="760" width="840" height="64" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="40" y="785" font-size="18" fill="#f5f5f5" font-weight="bold">1998–2000</text>
<text x="40" y="810" font-size="18" fill="#f5f5f5" font-weight="bold">diesel</text>
<text x="230" y="785" font-size="18" fill="#d4d4d8">F = L65; S = L56 (dla diesla 1996–97 nie mamy tabeli VIN w</text>
<text x="230" y="810" font-size="18" fill="#d4d4d8">źródłach — sprawdź manual)</text>
<rect x="30" y="844" width="8" height="30" fill="#d4d4d8"/>
<text x="50" y="866" font-size="24" fill="#f5f5f5" font-weight="bold">Kody RPO (lata występowania w dokumentach GM, C/K)</text>
