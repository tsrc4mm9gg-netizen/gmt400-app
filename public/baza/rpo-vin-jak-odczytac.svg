<text x="680" y="1188" font-size="17" fill="#d4d4d8">1993–2000</text>
<rect x="30" y="1205" width="840" height="60" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="40" y="1229" font-size="17" fill="#f5f5f5" font-weight="bold">G80</text>
<text x="310" y="1229" font-size="17" fill="#d4d4d8">Positraction (dyferencjał o</text>
