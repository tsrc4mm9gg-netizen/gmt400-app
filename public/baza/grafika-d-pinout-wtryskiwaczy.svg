<text x="60" y="137" font-size="21" fill="#E77000" font-weight="700" text-anchor="start">Tabela logiczna. Nie przedstawia widoku od strony pinów ani przewodów.</text>
<text x="60" y="168" font-size="18" fill="#EDEDED" font-weight="400" text-anchor="start">Fizyczna geometria wtyku niepotwierdzona. Pewność ŚREDNIA - zweryfikuj miernikiem przed użyciem.</text>
