<text x="60" y="744" font-size="17" fill="#9C9C9C" font-weight="400" text-anchor="start">W tabeli modułu 06 pin K występuje raz. W kopii FSM odnotowano powtórzenie tego wiersza.</text>
<text x="60" y="782" font-size="18" fill="#E77000" font-weight="700" text-anchor="start">Nie przenoś danych między rocznikami i modelami ani na 2-pinowe złącza zestawu MFI.</text>
<text x="60" y="830" font-size="18" fill="#EDEDED" font-weight="400" text-anchor="start">Źródło: dokumentacja serwisowa GM 1999 (kopia online), tabela modułu 06.</text>
<text x="60" y="857" font-size="17" fill="#9C9C9C" font-weight="400" text-anchor="start">Autentyczność kopii nie została niezależnie zweryfikowana. To nie jest rysunek GM.</text>
<text x="620" y="895" font-size="15" fill="#9C9C9C" font-weight="400" text-anchor="middle">gmt400.pl · Własny rysunek poglądowy · tylko złącze wtryskiwaczy GM 12065425</text>
