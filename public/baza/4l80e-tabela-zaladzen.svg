<text x="44" y="731" font-size="15" fill="#d4d4d8">Przełożenia wg GM: 1. 2,48; 2. 1,48; 3. 1,00; 4. 0,75; wsteczny 2,08. Zakres „D 4 bieg.”</text>
<text x="44" y="752" font-size="15" fill="#d4d4d8">to zwykłe D (nadbieg), „D (3)” — ręczne trzecie. Stan solenoidów 1-2 i 2-3 wg tabeli GM</text>
<text x="44" y="773" font-size="15" fill="#d4d4d8">dotyczy przyspieszania; GM zaznacza, że przy zmianie biegów zależy od prędkości i</text>
<text x="44" y="794" font-size="15" fill="#d4d4d8">przepustnicy, nie od wybranego biegu. Sprawdź w swoim aucie / manualu.</text>
