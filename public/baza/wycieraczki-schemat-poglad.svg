<?xml version="1.0" encoding="UTF-8"?>
<!-- Własny rysunek wektorowy gmt400.pl (bez grafik AI, bez kopiowania ilustracji CHARM/GM). Uproszczenie opisu z dokumentacji serwisowej, nie schemat instalacji. Rysunek poglądowy, nie w skali. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="Wycieraczki: osobne tory zasilania, sterowania i połączeń silnika, schemat poglądowy">
<title>Wycieraczki: osobne tory zasilania, sterowania i połączeń silnika, schemat poglądowy</title>
<defs><pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="1.2" fill="#1f1f24"/></pattern>
<marker id="ar" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#d4d4d8"/></marker>
<marker id="ao" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#f59e0b"/></marker></defs>
<rect width="900" height="1200" fill="#0d0d0f"/><rect width="900" height="1200" fill="url(#g)"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="0" y="0" width="900" height="8" fill="#a1a1aa"/>
<text x="870" y="40" font-size="16" fill="#a3a3a3" text-anchor="end">gmt400.pl · schemat poglądowy</text>
<text x="30" y="76" font-size="29" fill="#f5f5f5" font-weight="bold">Wycieraczki z przerwą: trzy osobne tory</text>
<text x="30" y="112" font-size="19" fill="#d4d4d8">Uproszczony opis z dokumentacji CHARM (W1, W1b, W5, W6, W10).</text>
<text x="30" y="138" font-size="19" fill="#d4d4d8">To nie jest schemat instalacji. Wariant odniesienia: Suburban 5.7, 1999.</text>
<line x1="30" y1="160" x2="870" y2="160" stroke="#3f3f46" stroke-width="2"/>
<text x="30" y="196" font-size="17" font-weight="bold" fill="#f59e0b" text-anchor="start">TOR ZASILANIA</text>
<rect x="30" y="210" width="840" height="86" rx="10" fill="#18181b" stroke="#f59e0b" stroke-width="2.5"/>
<text x="450.0" y="240" font-size="18" font-weight="bold" fill="#f5f5f5" text-anchor="middle">Skrzynka bezpieczników pod deską</text>
<text x="450.0" y="264" font-size="15" fill="#d4d4d8" text-anchor="middle">Bezpiecznik WIPER, zasilanie z zapłonu (ACC lub RUN)</text>
<line x1="180" y1="296" x2="180" y2="368" stroke="#f59e0b" stroke-width="4" marker-end="url(#ao)"/>
<text x="194" y="338" font-size="16" fill="#fbbf24">143 (żółty)</text>
<line x1="720" y1="296" x2="720" y2="368" stroke="#f59e0b" stroke-width="4" marker-end="url(#ao)"/>
<text x="734" y="338" font-size="16" fill="#fbbf24">143 (żółty)</text>
<rect x="30" y="372" width="300" height="200" rx="10" fill="#18181b" stroke="#a1a1aa" stroke-width="2.5"/>
<text x="180.0" y="402" font-size="18" font-weight="bold" fill="#f5f5f5" text-anchor="middle">Przełącznik na kolumnie</text>
<text x="180.0" y="426" font-size="15" fill="#d4d4d8" text-anchor="middle">wtyk C266</text>
<text x="180.0" y="450" font-size="15" fill="#d4d4d8" text-anchor="middle">pozycje: OFF, INT (DELAY),</text>
<text x="180.0" y="474" font-size="15" fill="#d4d4d8" text-anchor="middle">LO, HI, MIST, WASH</text>
<text x="180.0" y="498" font-size="15" fill="#d4d4d8" text-anchor="middle">rezystor w przełączniku</text>
<text x="180.0" y="522" font-size="15" fill="#d4d4d8" text-anchor="middle">ustawia czas przerwy</text>
<rect x="570" y="372" width="300" height="200" rx="10" fill="#18181b" stroke="#a1a1aa" stroke-width="2.5"/>
<text x="720.0" y="402" font-size="18" font-weight="bold" fill="#f5f5f5" text-anchor="middle">Silnik z płytką</text>
<text x="720.0" y="426" font-size="15" fill="#d4d4d8" text-anchor="middle">wtyk C: zasilanie 143</text>
<text x="720.0" y="450" font-size="15" fill="#d4d4d8" text-anchor="middle">wtyk E: sygnał 96</text>
<text x="720.0" y="474" font-size="15" fill="#d4d4d8" text-anchor="middle">wtyk D: sygnał 92</text>
<text x="720.0" y="498" font-size="15" fill="#d4d4d8" text-anchor="middle">wtyk A: do pompy</text>
<text x="720.0" y="522" font-size="15" fill="#d4d4d8" text-anchor="middle">płytka: przerwa, parkowanie</text>
<text x="450" y="420" font-size="17" font-weight="bold" fill="#d4d4d8" text-anchor="middle">TOR STEROWANIA</text>
<line x1="330" y1="465" x2="568" y2="465" stroke="#d4d4d8" stroke-width="4" marker-end="url(#ar)"/>
<text x="449" y="455" font-size="16" fill="#e4e4e7" text-anchor="middle">96 (brązowy)</text>
<line x1="330" y1="530" x2="568" y2="530" stroke="#d4d4d8" stroke-width="4" marker-end="url(#ar)"/>
<text x="449" y="520" font-size="16" fill="#e4e4e7" text-anchor="middle">92 (fioletowy)</text>
<text x="449" y="556" font-size="15" fill="#a3a3a3" text-anchor="middle">96: LO, DELAY, WASH.  92: HI.</text>
<line x1="30" y1="676" x2="870" y2="676" stroke="#3f3f46" stroke-width="2"/>
<text x="30" y="712" font-size="17" font-weight="bold" fill="#a3a3a3" text-anchor="start">POŁĄCZENIA SILNIKA Z PŁYTKĄ (trzy równoległe pola, bez kolejności)</text>
<line x1="720" y1="572" x2="720" y2="740" stroke="#52525b" stroke-width="3" stroke-dasharray="6 5"/>
<line x1="160" y1="740" x2="740" y2="740" stroke="#52525b" stroke-width="3" stroke-dasharray="6 5"/>
<line x1="160" y1="740" x2="160" y2="768" stroke="#52525b" stroke-width="3" marker-end="url(#ar)"/>
<line x1="450" y1="740" x2="450" y2="768" stroke="#52525b" stroke-width="3" marker-end="url(#ar)"/>
<line x1="740" y1="740" x2="740" y2="768" stroke="#52525b" stroke-width="3" marker-end="url(#ar)"/>
<rect x="30" y="772" width="260" height="150" rx="10" fill="#18181b" stroke="#a1a1aa" stroke-width="2.5"/>
<text x="160.0" y="802" font-size="18" font-weight="bold" fill="#f5f5f5" text-anchor="middle">Masa płytki</text>
<text x="160.0" y="826" font-size="15" fill="#d4d4d8" text-anchor="middle">przewód 150 (czarny)</text>
<text x="160.0" y="850" font-size="15" fill="#d4d4d8" text-anchor="middle">do punktu G200</text>
<rect x="320" y="772" width="260" height="150" rx="10" fill="#18181b" stroke="#a1a1aa" stroke-width="2.5"/>
<text x="450.0" y="802" font-size="18" font-weight="bold" fill="#f5f5f5" text-anchor="middle">Pompa płynu</text>
<text x="450.0" y="826" font-size="15" fill="#d4d4d8" text-anchor="middle">napięcie z płytki:</text>
<text x="450.0" y="850" font-size="15" fill="#d4d4d8" text-anchor="middle">przewód 228 (czerwony),</text>
<text x="450.0" y="874" font-size="15" fill="#d4d4d8" text-anchor="middle">wtyk A silnika</text>
<text x="450.0" y="898" font-size="15" fill="#d4d4d8" text-anchor="middle">masa pompy: 150</text>
<rect x="610" y="772" width="260" height="150" rx="10" fill="#18181b" stroke="#a1a1aa" stroke-width="2.5"/>
<text x="740.0" y="802" font-size="18" font-weight="bold" fill="#f5f5f5" text-anchor="middle">Ramiona</text>
<text x="740.0" y="826" font-size="15" fill="#d4d4d8" text-anchor="middle">napędzane silnikiem,</text>
<text x="740.0" y="850" font-size="15" fill="#d4d4d8" text-anchor="middle">dojazd do pozycji</text>
<text x="740.0" y="874" font-size="15" fill="#d4d4d8" text-anchor="middle">parkowania</text>
<rect x="30" y="960" width="840" height="200" rx="10" fill="#1c1917" stroke="#f59e0b" stroke-width="2.5"/>
<text x="54" y="998" font-size="17" font-weight="bold" fill="#f59e0b" text-anchor="start">UWAGA</text>
<text x="54" y="1032" font-size="16" fill="#e4e4e7">Oznaczenia wtyków, numery i kolory przewodów dotyczą wariantu odniesienia.</text>
<text x="54" y="1062" font-size="16" fill="#e4e4e7">Inne roczniki i konfiguracje: do weryfikacji.</text>
<text x="54" y="1092" font-size="16" fill="#e4e4e7">Diagnostyka tylko po pełnym System Check producenta (patrz opis na stronie).</text>
<text x="54" y="1122" font-size="16" fill="#e4e4e7">Materiał pomocniczy dla warsztatu, nie instrukcja naprawy.</text>
</g></svg>
