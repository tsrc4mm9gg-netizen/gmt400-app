<svg role="img" aria-label="CSFI i MFI - porównanie układów V8" xmlns="http://www.w3.org/2000/svg" width="900" height="581" viewBox="0 0 1240 800" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',sans-serif">
<!-- Własny rysunek wektorowy gmt400.pl; bez kopiowania ilustracji Haynes/GM. -->
<title>CSFI i MFI - porównanie układów V8</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E77000"/>
    </marker>
  </defs>

  <!-- tlo karty -->
  <rect x="0" y="0" width="1240" height="800" rx="24" fill="#0A0A0A" stroke="#262626" stroke-width="1.5"/>

  <!-- tytul -->
  <text x="620" y="54" text-anchor="middle" font-size="27" font-weight="700" fill="#EDEDED">CSFI vs MFI - co zmienia konwersja</text>
  <text x="620" y="80" text-anchor="middle" font-size="13.5" fill="#9C9C9C">Schemat poglądowy wg GM TSB 00-06-04-003B · kształty i rozmieszczenie umowne, nie w skali</text>

  <!-- ============ PANEL CSFI ============ -->
  <rect x="30" y="102" width="590" height="424" rx="16" fill="#111111" stroke="#2A2A2A"/>
  <rect x="195" y="120" width="260" height="36" rx="18" fill="#1A1A1A" stroke="#3A3A3A"/>
  <text x="325" y="144" text-anchor="middle" font-size="16" font-weight="700" fill="#EDEDED">CSFI - układ seryjny</text>

  <!-- przewody nylonowe (linie od korpusu do portow) -->
  <g stroke="#8A8A8A" stroke-width="2.5" fill="none">
    <path d="M235 288 L132 216"/>
    <path d="M235 296 L132 278"/>
    <path d="M235 308 L132 340"/>
    <path d="M235 316 L132 402"/>
    <path d="M415 288 L518 216"/>
    <path d="M415 296 L518 278"/>
    <path d="M415 308 L518 340"/>
    <path d="M415 316 L518 402"/>
  </g>

  <!-- porty / cylindry lewa strona -->
  <g fill="#1C1C1C" stroke="#4A4A4A">
    <rect x="60" y="200" width="70" height="30" rx="8"/>
    <rect x="60" y="262" width="70" height="30" rx="8"/>
    <rect x="60" y="324" width="70" height="30" rx="8"/>
    <rect x="60" y="386" width="70" height="30" rx="8"/>
  </g>
  <g font-size="13" fill="#9C9C9C" text-anchor="middle">
    <text x="95" y="220">cyl. 1</text>
    <text x="95" y="282">cyl. 3</text>
    <text x="95" y="344">cyl. 5</text>
    <text x="95" y="406">cyl. 7</text>
  </g>
  <!-- porty prawa strona -->
  <g fill="#1C1C1C" stroke="#4A4A4A">
    <rect x="520" y="200" width="70" height="30" rx="8"/>
    <rect x="520" y="262" width="70" height="30" rx="8"/>
    <rect x="520" y="324" width="70" height="30" rx="8"/>
    <rect x="520" y="386" width="70" height="30" rx="8"/>
  </g>
  <g font-size="13" fill="#9C9C9C" text-anchor="middle">
    <text x="555" y="220">cyl. 2</text>
    <text x="555" y="282">cyl. 4</text>
    <text x="555" y="344">cyl. 6</text>
    <text x="555" y="406">cyl. 8</text>
  </g>

  <!-- zaworki poppet (diamenty) -->
  <g fill="#E77000">
    <path d="M136 211 l7 7 -7 7 -7 -7 z"/>
    <path d="M136 273 l7 7 -7 7 -7 -7 z"/>
    <path d="M136 335 l7 7 -7 7 -7 -7 z"/>
    <path d="M136 397 l7 7 -7 7 -7 -7 z"/>
    <path d="M514 211 l7 7 -7 7 -7 -7 z"/>
    <path d="M514 273 l7 7 -7 7 -7 -7 z"/>
    <path d="M514 335 l7 7 -7 7 -7 -7 z"/>
    <path d="M514 397 l7 7 -7 7 -7 -7 z"/>
  </g>

  <!-- korpus dozujacy CSFI -->
  <rect x="235" y="270" width="180" height="64" rx="10" fill="#1C1C1C" stroke="#6B6B6B" stroke-width="2"/>
  <text x="325" y="294" text-anchor="middle" font-size="13.5" font-weight="700" fill="#EDEDED">Korpus dozujący CSFI</text>
  <text x="325" y="311" text-anchor="middle" font-size="11" fill="#9C9C9C">8 wtryskiwaczy elektrycznych</text>
  <text x="325" y="325" text-anchor="middle" font-size="11" fill="#9C9C9C">(w centralnym korpusie)</text>

  <!-- callout poppet -->
  <path d="M150 420 L120 444" stroke="#E77000" stroke-width="1.5" fill="none"/>
  <rect x="60" y="442" width="530" height="66" rx="12" fill="#1A1206" stroke="#E77000"/>
  <text x="78" y="468" font-size="13" font-weight="700" fill="#E77000">8× zaworek poppet (kula + gniazdo) - po jednym przy porcie</text>
  <text x="78" y="490" font-size="12.5" fill="#EDEDED">Osad klei kulę → cylinder źle zasilany → wypadanie zapłonu (TSB: przyczyna)</text>

  <!-- ============ PANEL MFI ============ -->
  <rect x="620" y="102" width="590" height="424" rx="16" fill="#111111" stroke="#2A2A2A"/>
  <rect x="785" y="120" width="260" height="36" rx="18" fill="#E77000"/>
  <text x="915" y="144" text-anchor="middle" font-size="16" font-weight="700" fill="#000000">MFI - po konwersji</text>

  <!-- przewody -->
  <g stroke="#8A8A8A" stroke-width="2.5" fill="none">
    <path d="M825 288 L722 216"/>
    <path d="M825 296 L722 278"/>
    <path d="M825 308 L722 340"/>
    <path d="M825 316 L722 402"/>
    <path d="M1005 288 L1108 216"/>
    <path d="M1005 296 L1108 278"/>
    <path d="M1005 308 L1108 340"/>
    <path d="M1005 316 L1108 402"/>
  </g>

  <!-- porty lewa -->
  <g fill="#1C1C1C" stroke="#4A4A4A">
    <rect x="650" y="200" width="70" height="30" rx="8"/>
    <rect x="650" y="262" width="70" height="30" rx="8"/>
    <rect x="650" y="324" width="70" height="30" rx="8"/>
    <rect x="650" y="386" width="70" height="30" rx="8"/>
  </g>
  <g font-size="13" fill="#9C9C9C" text-anchor="middle">
    <text x="685" y="220">cyl. 1</text>
    <text x="685" y="282">cyl. 3</text>
    <text x="685" y="344">cyl. 5</text>
    <text x="685" y="406">cyl. 7</text>
  </g>
  <!-- porty prawa -->
  <g fill="#1C1C1C" stroke="#4A4A4A">
    <rect x="1110" y="200" width="70" height="30" rx="8"/>
    <rect x="1110" y="262" width="70" height="30" rx="8"/>
    <rect x="1110" y="324" width="70" height="30" rx="8"/>
    <rect x="1110" y="386" width="70" height="30" rx="8"/>
  </g>
  <g font-size="13" fill="#9C9C9C" text-anchor="middle">
    <text x="1145" y="220">cyl. 2</text>
    <text x="1145" y="282">cyl. 4</text>
    <text x="1145" y="344">cyl. 6</text>
    <text x="1145" y="406">cyl. 8</text>
  </g>

  <!-- wtryskiwacze MFI (pionowe prostokaty przy portach) -->
  <g fill="#E77000">
    <rect x="726" y="203" width="14" height="24" rx="3"/>
    <rect x="726" y="265" width="14" height="24" rx="3"/>
    <rect x="726" y="327" width="14" height="24" rx="3"/>
    <rect x="726" y="389" width="14" height="24" rx="3"/>
    <rect x="1090" y="203" width="14" height="24" rx="3"/>
    <rect x="1090" y="265" width="14" height="24" rx="3"/>
    <rect x="1090" y="327" width="14" height="24" rx="3"/>
    <rect x="1090" y="389" width="14" height="24" rx="3"/>
  </g>

  <!-- korpus MFI -->
  <rect x="825" y="270" width="180" height="64" rx="10" fill="#1C1C1C" stroke="#6B6B6B" stroke-width="2"/>
  <text x="915" y="294" text-anchor="middle" font-size="13.5" font-weight="700" fill="#EDEDED">Korpus dozujący MFI</text>
  <text x="915" y="311" text-anchor="middle" font-size="11" fill="#9C9C9C">lista rozdzielcza</text>
  <text x="915" y="325" text-anchor="middle" font-size="11" fill="#9C9C9C">bez zaworków poppet</text>

  <!-- callout MFI -->
  <path d="M745 420 L715 444" stroke="#E77000" stroke-width="1.5" fill="none"/>
  <rect x="650" y="442" width="530" height="66" rx="12" fill="#1A1206" stroke="#E77000"/>
  <text x="668" y="468" font-size="13" font-weight="700" fill="#E77000">8× wtryskiwacz elektryczny - po jednym przy każdym porcie</text>
  <text x="668" y="490" font-size="12.5" fill="#EDEDED">TSB: MFI eliminuje kulę i gniazdo zaworka poppet</text>

  <!-- ============ PASY FAKTOW ============ -->
  <g>
    <rect x="30" y="548" width="386" height="104" rx="14" fill="#111111" stroke="#2A2A2A"/>
    <text x="52" y="578" font-size="11.5" font-weight="700" fill="#E77000" letter-spacing="1">NAJPIERW CZYSZCZENIE</text>
    <text x="52" y="602" font-size="12.5" fill="#EDEDED">Czyszczenie poppetów to naprawa preferowana;</text>
    <text x="52" y="622" font-size="12.5" fill="#EDEDED">wymiana korpusu dopiero, gdy objaw wróci,</text>
    <text x="52" y="642" font-size="12.5" fill="#EDEDED">lub na życzenie poza gwarancją (TSB).</text>
  </g>
  <g>
    <rect x="427" y="548" width="386" height="104" rx="14" fill="#111111" stroke="#2A2A2A"/>
    <text x="449" y="578" font-size="11.5" font-weight="700" fill="#E77000" letter-spacing="1">KONWERSJA = CAŁY KORPUS</text>
    <text x="449" y="602" font-size="12.5" fill="#EDEDED">Nie mieszać wtryskiwaczy CSFI z MFI - klamry</text>
    <text x="449" y="622" font-size="12.5" fill="#EDEDED">są inne; nieszczelny zestaw grozi poważnym</text>
    <text x="449" y="642" font-size="12.5" fill="#EDEDED">uszkodzeniem silnika (TSB).</text>
  </g>
  <g>
    <rect x="824" y="548" width="386" height="104" rx="14" fill="#111111" stroke="#2A2A2A"/>
    <text x="846" y="578" font-size="11.5" font-weight="700" fill="#E77000" letter-spacing="1">EFEKT KONWERSJI</text>
    <text x="846" y="602" font-size="12.5" fill="#EDEDED">Po konwersji nie ma zaworków poppet - znika</text>
    <text x="846" y="622" font-size="12.5" fill="#EDEDED">typowa przyczyna nierównej pracy na biegu</text>
    <text x="846" y="642" font-size="12.5" fill="#EDEDED">jałowym po nocy (TSB: objaw).</text>
  </g>

  <!-- legenda -->
  <g font-size="12" fill="#9C9C9C">
    <path d="M330 686 l7 7 -7 7 -7 -7 z" fill="#E77000"/>
    <text x="346" y="698">element decydujący o usterce / zmianie</text>
    <rect x="640" y="686" width="12" height="12" rx="3" fill="#1C1C1C" stroke="#4A4A4A"/>
    <text x="660" y="698">porty cylindrów (oznaczenie umowne)</text>
  </g>

  <!-- stopka -->
  <text x="620" y="752" text-anchor="middle" font-size="11" fill="#6B6B6B">gmt400.pl · Źródło: GM TSB 00-06-04-003B (01.2003), kopia tekstu: s10forum.com · rysunek schematyczny</text>
</svg>
