<rect x="30" y="731" width="840" height="108" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="44" y="760" font-size="15" fill="#d4d4d8">Jak czytać: zakres „D 4 bieg.” to zwykłe D (nadbieg), „D (3)” to ręczne trzecie. W P, R, N</text>
<text x="44" y="781" font-size="15" fill="#d4d4d8">stan solenoidów A i B zależy od sygnału prędkości (VSS); w normalnych warunkach są ON.</text>
<text x="44" y="802" font-size="15" fill="#d4d4d8">Ręczne przejście 2→1 działa tylko w części wersji. Opis dotyczy przyspieszania. Sprawdź w</text>
<text x="44" y="823" font-size="15" fill="#d4d4d8">swoim aucie / manualu.</text>
