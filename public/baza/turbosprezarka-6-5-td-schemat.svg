<!-- Własny rysunek wektorowy gmt400.pl (bez grafik AI, bez kopiowania ilustracji Haynes/GM). Dane: źródła podane na rysunku. Rysunek poglądowy, nie w skali. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1304" width="900" height="1304" role="img" aria-label="6.5 TD: turbosprężarka — drogi powietrza, spalin i oleju">
<title>6.5 TD: turbosprężarka — drogi powietrza, spalin i oleju</title>
<defs><pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="1.2" fill="#1f1f24"/></pattern></defs>
<rect width="900" height="1304" fill="#0d0d0f"/>
<rect width="900" height="1304" fill="url(#g)"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="0" y="0" width="900" height="8" fill="#a1a1aa"/>
<text x="870" y="40" font-size="16" fill="#a3a3a3" text-anchor="end">gmt400.pl · schemat</text>
<text x="30" y="76" font-size="29" fill="#f5f5f5" font-weight="bold">6.5 TD: turbosprężarka — drogi powietrza, spalin</text>
<text x="30" y="112" font-size="29" fill="#f5f5f5" font-weight="bold">i oleju</text>
<text x="30" y="148" font-size="20" fill="#d4d4d8">Diesel 6.5L V8 turbo — GMT400 1992–1999. Schemat poglądowy, własny, wg</text>
<text x="30" y="175" font-size="20" fill="#d4d4d8">opisu w GM Service Training (1991).</text>
<line x1="30" y1="202" x2="870" y2="202" stroke="#3f3f46" stroke-width="2"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="13" refY="9" orient="auto"><path d="M0,1 L16,9 L0,17 z" fill="#f5f5f5"/></marker></defs>
<rect x="370" y="252" width="130" height="44" rx="10" fill="#141417" stroke="#71717a" stroke-width="3"/>
<text x="435.0" y="279" font-size="14" fill="#f5f5f5" font-weight="bold" text-anchor="middle">Olej z silnika</text>
<polyline points="435,296 435,320" fill="none" stroke="#e4e4e7" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="40" y="342" width="140" height="70" rx="10" fill="#18181b" stroke="#a1a1aa" stroke-width="3"/>
<text x="110.0" y="373" font-size="16" fill="#f5f5f5" font-weight="bold" text-anchor="middle">Filtr</text>
<text x="110.0" y="393" font-size="16" fill="#f5f5f5" font-weight="bold" text-anchor="middle">powietrza</text>
<rect x="260" y="322" width="120" height="110" rx="10" fill="#202024" stroke="#a1a1aa" stroke-width="3"/>
<text x="320.0" y="383" font-size="16" fill="#f5f5f5" font-weight="bold" text-anchor="middle">Sprężarka</text>
<rect x="380" y="322" width="110" height="110" rx="10" fill="#141417" stroke="#71717a" stroke-width="3"/>
<text x="435.0" y="373" font-size="14" fill="#f5f5f5" font-weight="bold" text-anchor="middle">Obudowa</text>
<text x="435.0" y="391" font-size="14" fill="#f5f5f5" font-weight="bold" text-anchor="middle">łożysk</text>
<rect x="490" y="322" width="130" height="110" rx="10" fill="#202024" stroke="#a1a1aa" stroke-width="3"/>
<text x="555.0" y="373" font-size="15" fill="#f5f5f5" font-weight="bold" text-anchor="middle">Turbina +</text>
<text x="555.0" y="392" font-size="15" fill="#f5f5f5" font-weight="bold" text-anchor="middle">wastegate</text>
<polyline points="180,377 256,377" fill="none" stroke="#e4e4e7" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/>
<text x="218" y="362" font-size="13" fill="#d4d4d8" text-anchor="middle">wąż</text>
<rect x="40" y="482" width="140" height="70" rx="10" fill="#141417" stroke="#71717a" stroke-width="3" stroke-dasharray="8 6"/>
<text x="110.0" y="513" font-size="14" fill="#f5f5f5" font-weight="bold" text-anchor="middle">CDRV</text>
<text x="110.0" y="531" font-size="14" fill="#f5f5f5" font-weight="bold" text-anchor="middle">(opary skrz. kor.)</text>
<polyline points="180,517 215,517 215,384" fill="none" stroke="#a1a1aa" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#ar)"/>
<rect x="260" y="512" width="160" height="70" rx="10" fill="#18181b" stroke="#a1a1aa" stroke-width="3"/>
<text x="340.0" y="543" font-size="15" fill="#f5f5f5" font-weight="bold" text-anchor="middle">Kanał dolotowy</text>
<text x="340.0" y="562" font-size="15" fill="#f5f5f5" font-weight="bold" text-anchor="middle">→ kolektor</text>
<polyline points="320,434 320,508" fill="none" stroke="#e4e4e7" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="260" y="632" width="360" height="70" rx="10" fill="#202024" stroke="#a1a1aa" stroke-width="3"/>
<text x="440.0" y="673" font-size="17" fill="#f5f5f5" font-weight="bold" text-anchor="middle">SILNIK V8 (głowice L + P)</text>
<polyline points="340,584 340,628" fill="none" stroke="#e4e4e7" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="680" y="332" width="190" height="70" rx="10" fill="#18181b" stroke="#a1a1aa" stroke-width="3"/>
<text x="775.0" y="363" font-size="15" fill="#f5f5f5" font-weight="bold" text-anchor="middle">Prawy kolektor</text>
<text x="775.0" y="382" font-size="15" fill="#f5f5f5" font-weight="bold" text-anchor="middle">(cyl. 2, 4, 6, 8)</text>
<rect x="680" y="452" width="190" height="70" rx="10" fill="#18181b" stroke="#a1a1aa" stroke-width="3"/>
<text x="775.0" y="483" font-size="15" fill="#f5f5f5" font-weight="bold" text-anchor="middle">Lewy kolektor</text>
<text x="775.0" y="502" font-size="15" fill="#f5f5f5" font-weight="bold" text-anchor="middle">(cyl. 1, 3, 5, 7)</text>
<polyline points="775,450 775,406" fill="none" stroke="#e4e4e7" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/>
<text x="870" y="432" font-size="12" fill="#a1a1aa" text-anchor="end">rura łącząca</text>
<polyline points="678,367 624,377" fill="none" stroke="#e4e4e7" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="500" y="512" width="120" height="60" rx="10" fill="#141417" stroke="#71717a" stroke-width="3"/>
<text x="560.0" y="538" font-size="15" fill="#f5f5f5" font-weight="bold" text-anchor="middle">Rura →</text>
<text x="560.0" y="557" font-size="15" fill="#f5f5f5" font-weight="bold" text-anchor="middle">tłumik</text>
<polyline points="555,434 555,508" fill="none" stroke="#e4e4e7" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/>
<polyline points="435,434 435,482" fill="none" stroke="#a1a1aa" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#ar)"/>
<text x="435" y="498" font-size="12" fill="#a1a1aa" text-anchor="middle">odpływ oleju → karter</text>
<rect x="30" y="732" width="840" height="36" rx="6" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
<text x="40" y="758" font-size="16" fill="#e4e4e7" font-weight="bold">Parametr</text>
<text x="460" y="758" font-size="16" fill="#e4e4e7" font-weight="bold">Wartość (GM, 1991)</text>
<text x="750" y="758" font-size="16" fill="#e4e4e7" font-weight="bold">Str.</text>
<rect x="30" y="772" width="840" height="36" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="40" y="795" font-size="16" fill="#f5f5f5" font-weight="bold">Maks. doładowanie (wastegate)</text>
<text x="460" y="795" font-size="16" fill="#d4d4d8">5 psi ≈ 34 kPa</text>
<text x="750" y="795" font-size="16" fill="#d4d4d8">6-12, 6-14</text>
<rect x="30" y="812" width="840" height="58" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="40" y="835" font-size="16" fill="#f5f5f5" font-weight="bold">Prawidłowy odczyt testu doładowania</text>
<text x="40" y="857" font-size="16" fill="#f5f5f5" font-weight="bold">(pełny gaz, maks. 10 s)</text>
<text x="460" y="835" font-size="16" fill="#d4d4d8">&gt; 2 psi ≈ 14 kPa</text>
<text x="750" y="835" font-size="16" fill="#d4d4d8">6-15</text>
<rect x="30" y="874" width="840" height="58" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="40" y="897" font-size="16" fill="#f5f5f5" font-weight="bold">Obroty koła sprężarki: pełne obciążenie /</text>
<text x="40" y="919" font-size="16" fill="#f5f5f5" font-weight="bold">bieg jałowy</text>
<text x="460" y="897" font-size="16" fill="#d4d4d8">ok. 80 000 / 15 000 obr/min</text>
<text x="750" y="897" font-size="16" fill="#d4d4d8">6-14</text>
<rect x="30" y="936" width="840" height="58" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="40" y="959" font-size="16" fill="#f5f5f5" font-weight="bold">Moment obrotowy rośnie przy pełnym</text>
<text x="40" y="981" font-size="16" fill="#f5f5f5" font-weight="bold">obciążeniu do</text>
<text x="460" y="959" font-size="16" fill="#d4d4d8">ok. 1700 obr/min</text>
<text x="750" y="959" font-size="16" fill="#d4d4d8">6-14</text>
<rect x="30" y="998" width="840" height="58" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="40" y="1021" font-size="16" fill="#f5f5f5" font-weight="bold">CDRV: podciśnienie w skrzyni korbowej</text>
<text x="40" y="1043" font-size="16" fill="#f5f5f5" font-weight="bold">przy 2000 obr/min</text>
<text x="460" y="1021" font-size="16" fill="#d4d4d8">2–5 in H2O ≈ 0,5–1,2 kPa</text>
<text x="750" y="1021" font-size="16" fill="#d4d4d8">6-22</text>
<rect x="30" y="1072" width="840" height="108" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="44" y="1101" font-size="15" fill="#d4d4d8">Powietrze: filtr → sprężarka → kanał dolotowy → kolektor. Spaliny: oba kolektory → prawy</text>
<text x="44" y="1122" font-size="15" fill="#d4d4d8">kolektor → turbina → rura → tłumik. Turbo siedzi na prawym kolektorze. Olej smaruje</text>
<text x="44" y="1143" font-size="15" fill="#d4d4d8">łożyska pływające i wraca do karteru; GM nie wymaga procedury studzenia. Schemat</text>
<text x="44" y="1164" font-size="15" fill="#d4d4d8">poglądowy, nie w skali; sprawdź w swoim aucie / manualu.</text>
<line x1="30" y1="1190" x2="870" y2="1190" stroke="#3f3f46" stroke-width="2"/>
<text x="30" y="1218" font-size="17" fill="#a3a3a3">Źródło: GM Service Training, 6.5L V8 Turbo Diesel (1991), rozdz. 6 „Air</text>
<text x="30" y="1242" font-size="17" fill="#a3a3a3">Induction/Exhaust Systems”, str. 6-1…6-23. Rysunek własny, nie kopiuje ilustracji</text>
<text x="30" y="1266" font-size="17" fill="#a3a3a3">GM.</text>
</g>
</svg>
