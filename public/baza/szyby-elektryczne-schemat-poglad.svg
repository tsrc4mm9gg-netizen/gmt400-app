<!-- Własny rysunek wektorowy gmt400.pl (bez grafik AI, bez kopiowania ilustracji CHARM/GM). Uproszczenie opisu z dokumentacji serwisowej, nie schemat instalacji. Rysunek poglądowy, nie w skali. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1290" width="900" height="1290" role="img" aria-label="Szyby elektryczne: zasilanie, masa i połączenia przełączników z silnikami, schemat poglądowy">
<title>Szyby elektryczne: zasilanie, masa i połączenia przełączników z silnikami, schemat poglądowy</title>
<defs><pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="1.2" fill="#1f1f24"/></pattern>
<marker id="ao" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#f59e0b"/></marker>
<marker id="ar" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#d4d4d8"/></marker></defs>
<rect width="900" height="1290" fill="#0d0d0f"/><rect width="900" height="1290" fill="url(#g)"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
