<text x="46" y="444" font-size="21" fill="#f5f5f5" font-weight="bold">1995</text>
<text x="196" y="444" font-size="21" fill="#f5f5f5">etylenowy 50/50 wg GM 6038-M; 5.7: 16,5 l; 7.4: 23,5 l;</text>
<text x="196" y="472" font-size="21" fill="#f5f5f5">6.5 D: 22,2 l</text>
<rect x="30" y="490" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="524" font-size="21" fill="#f5f5f5" font-weight="bold">1999</text>
<text x="196" y="524" font-size="21" fill="#f5f5f5">DEX-COOL 50/50; 5.7: 16,5 l (19 l z tylną nagrz.); 7.4:</text>
<text x="196" y="552" font-size="21" fill="#f5f5f5">23,5 l (26 l)</text>
<rect x="30" y="592" width="8" height="30" fill="#dc2626"/>
<text x="48" y="617" font-size="24" fill="#f5f5f5" font-weight="bold">Pozostałe</text>
<rect x="30" y="634" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="668" font-size="21" fill="#f5f5f5" font-weight="bold">Hamulce</text>
<text x="336" y="668" font-size="21" fill="#f5f5f5">1995: DOT-3 GM 1052535 • 1999: DOT-3 GM</text>
<text x="336" y="696" font-size="21" fill="#f5f5f5">12377967</text>
<rect x="30" y="714" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="748" font-size="21" fill="#f5f5f5" font-weight="bold">Wspomaganie</text>
<text x="336" y="748" font-size="21" fill="#f5f5f5">GM 1050017 (1999 także 1052884)</text>
<rect x="30" y="766" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="800" font-size="21" fill="#f5f5f5" font-weight="bold">Skrzynia automatyczna</text>
<text x="336" y="800" font-size="21" fill="#f5f5f5">DEXRON-III</text>
<rect x="30" y="818" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="852" font-size="21" fill="#f5f5f5" font-weight="bold">Reduktor</text>
