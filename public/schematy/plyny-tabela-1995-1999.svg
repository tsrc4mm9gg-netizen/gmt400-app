<text x="196" y="518" font-size="21" fill="#f5f5f5">DEX-COOL 50/50; 5.7: 16,5 l (19 l z tylną nagrz.); 7.4:</text>
<text x="196" y="546" font-size="21" fill="#f5f5f5">23,5 l (26 l)</text>
<rect x="30" y="590" width="8" height="30" fill="#dc2626"/>
<text x="50" y="615" font-size="24" fill="#f5f5f5" font-weight="bold">Pozostałe</text>
