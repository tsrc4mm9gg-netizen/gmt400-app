<text x="46" y="932" font-size="21" fill="#f5f5f5" font-weight="bold">Mosty</text>
<text x="336" y="932" font-size="21" fill="#f5f5f5">SAE 80W-90 GM 1052271; 1999 szpera (locking):</text>
<text x="336" y="960" font-size="21" fill="#f5f5f5">tylko 1052271, bez modyfikatora tarcia</text>
<rect x="30" y="978" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="1012" font-size="21" fill="#f5f5f5" font-weight="bold">Sprzęgło hydr. (1995)</text>
<text x="336" y="1012" font-size="21" fill="#f5f5f5">GM 12345347</text>
<rect x="30" y="1030" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="1064" font-size="21" fill="#f5f5f5" font-weight="bold">Spryskiwacz</text>
<text x="336" y="1064" font-size="21" fill="#f5f5f5">Optikleen GM 1051515 (1995 i 1999)</text>
<rect x="30" y="1104" width="8" height="30" fill="#dc2626"/>
<text x="48" y="1129" font-size="24" fill="#f5f5f5" font-weight="bold">Zbiornik paliwa</text>
<rect x="30" y="1146" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="1180" font-size="21" fill="#f5f5f5" font-weight="bold">1995 pickup</text>
<text x="246" y="1180" font-size="21" fill="#f5f5f5">krótka paka 98 l • długa 128 l</text>
<rect x="30" y="1198" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="1232" font-size="21" fill="#f5f5f5" font-weight="bold">1999</text>
<text x="246" y="1232" font-size="21" fill="#f5f5f5">Utility 113 l • Suburban benzyna 167 l / diesel 159 l</text>
<rect x="30" y="1260" width="840" height="80" rx="8" fill="#2a0f10" stroke="#dc2626" stroke-width="2"/>
<text x="48" y="1296" font-size="21" fill="#fca5a5" font-weight="bold">Uwaga: pojemności to wartości z instrukcji — po wymianie</text>
<text x="48" y="1324" font-size="21" fill="#fca5a5">zawsze sprawdź poziom bagnetem / na zbiorniczku.</text>
<text x="30" y="1388" font-size="18" fill="#a3a3a3">Sprawdź w swoim aucie / manualu — GMT400 ma wiele wariantów (rocznik,</text>
<text x="30" y="1414" font-size="18" fill="#a3a3a3">silnik, GVWR, RPO). Rysunek poglądowy, nie w skali.</text>
<text x="30" y="1440" font-size="18" fill="#a3a3a3">Źródło: Instrukcje GM: 1995 C/K 1500, 1999 Suburban</text>
</g>
