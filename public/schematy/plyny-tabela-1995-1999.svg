<text x="46" y="668" font-size="21" fill="#f5f5f5" font-weight="bold">Hamulce</text>
<text x="336" y="668" font-size="21" fill="#f5f5f5">1995: DOT-3 GM 1052535 • 1999: DOT-3 GM</text>
<text x="336" y="696" font-size="21" fill="#f5f5f5">12377967</text>
