<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1582" width="900" height="1582" role="img" aria-label="Tabela płynów — 1995 vs 1999">
<title>Tabela płynów — 1995 vs 1999</title>
<defs><pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="1.2" fill="#1f1f24"/></pattern></defs>
<rect width="900" height="1582" fill="#0d0d0f"/>
<rect width="900" height="1582" fill="url(#g)"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="0" y="0" width="900" height="8" fill="#dc2626"/>
<text x="870" y="40" font-size="16" fill="#a3a3a3" text-anchor="end">gmt400.pl · schemat</text>
<text x="30" y="80" font-size="30" fill="#f5f5f5" font-weight="bold">Tabela płynów — 1995 vs 1999</text>
<text x="30" y="110" font-size="20" fill="#f87171">Model i lata: C/K 1995 (instrukcja OM95) i Suburban/Tahoe 1999</text>
<text x="30" y="140" font-size="20" fill="#f87171">(instrukcja OM99). Inne lata — sprawdź w swoim manualu.</text>
<line x1="30" y1="156" x2="870" y2="156" stroke="#3f3f46" stroke-width="2"/>
<rect x="30" y="186" width="8" height="30" fill="#dc2626"/>
<text x="50" y="211" font-size="24" fill="#f5f5f5" font-weight="bold">Olej silnikowy z filtrem</text>
<rect x="30" y="230" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="264" font-size="21" fill="#f5f5f5" font-weight="bold">1995</text>
<text x="196" y="264" font-size="21" fill="#f5f5f5">4.3: 4,3 l • 5.0/5.7: 4,8 l • 6.5 D: 6,5 l • 7.4: 6,5 l</text>
<rect x="30" y="282" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="316" font-size="21" fill="#f5f5f5" font-weight="bold">1999</text>
<text x="196" y="316" font-size="21" fill="#f5f5f5">5.7 L31: 4,8 l • 7.4 L29: 6,3 l</text>
<rect x="30" y="360" width="8" height="30" fill="#dc2626"/>
<text x="50" y="385" font-size="24" fill="#f5f5f5" font-weight="bold">Płyn chłodniczy</text>
<rect x="30" y="404" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="438" font-size="21" fill="#f5f5f5" font-weight="bold">1995</text>
<text x="196" y="438" font-size="21" fill="#f5f5f5">etylenowy 50/50 wg GM 6038-M; 5.7: 16,5 l; 7.4: 23,5 l;</text>
<text x="196" y="466" font-size="21" fill="#f5f5f5">6.5 D: 22,2 l</text>
<rect x="30" y="484" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
