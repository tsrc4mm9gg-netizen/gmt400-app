<text x="46" y="748" font-size="21" fill="#f5f5f5" font-weight="bold">Wspomaganie</text>
<text x="336" y="748" font-size="21" fill="#f5f5f5">GM 1050017 (1999 także 1052884)</text>
<rect x="30" y="766" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="800" font-size="21" fill="#f5f5f5" font-weight="bold">Skrzynia automatyczna</text>
<text x="336" y="800" font-size="21" fill="#f5f5f5">DEXRON-III</text>
