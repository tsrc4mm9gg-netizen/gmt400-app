<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1470" width="900" height="1470" role="img" aria-label="Tabela płynów — 1995 vs 1999">
<title>Tabela płynów — 1995 vs 1999</title>
<rect width="900" height="1470" fill="#0d0d0f"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="30" y="58" font-size="30" fill="#f5f5f5" font-weight="bold">Tabela płynów — 1995 vs 1999</text>
<text x="30" y="90" font-size="20" fill="#f87171">Model i lata: C/K 1995 (instrukcja OM95) i Suburban/Tahoe</text>
<text x="30" y="122" font-size="20" fill="#f87171">1999 (instrukcja OM99). Inne lata — sprawdź w swoim</text>
<text x="30" y="154" font-size="20" fill="#f87171">manualu.</text>
<rect x="30" y="200" width="8" height="30" fill="#dc2626"/>
<text x="48" y="225" font-size="24" fill="#f5f5f5" font-weight="bold">Olej silnikowy z filtrem</text>
<rect x="30" y="242" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="276" font-size="21" fill="#f5f5f5" font-weight="bold">1995</text>
<text x="196" y="276" font-size="21" fill="#f5f5f5">4.3: 4,3 l • 5.0/5.7: 4,8 l • 6.5 D: 6,5 l • 7.4: 6,5 l</text>
<rect x="30" y="294" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="328" font-size="21" fill="#f5f5f5" font-weight="bold">1999</text>
<text x="196" y="328" font-size="21" fill="#f5f5f5">5.7 L31: 4,8 l • 7.4 L29: 6,3 l</text>
<rect x="30" y="368" width="8" height="30" fill="#dc2626"/>
<text x="48" y="393" font-size="24" fill="#f5f5f5" font-weight="bold">Płyn chłodniczy</text>
