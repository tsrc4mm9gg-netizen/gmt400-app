<text x="336" y="852" font-size="21" fill="#f5f5f5">1995: DEXRON-III • 1999: ręczny DEXRON-III,</text>
<text x="336" y="880" font-size="21" fill="#f5f5f5">automatyczny GM 12378396</text>
<rect x="30" y="898" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="932" font-size="21" fill="#f5f5f5" font-weight="bold">Mosty</text>
<text x="336" y="932" font-size="21" fill="#f5f5f5">SAE 80W-90 GM 1052271; 1999 szpera (locking):</text>
<text x="336" y="960" font-size="21" fill="#f5f5f5">tylko 1052271, bez modyfikatora tarcia</text>
<rect x="30" y="978" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1012" font-size="21" fill="#f5f5f5" font-weight="bold">Sprzęgło hydr. (1995)</text>
<text x="336" y="1012" font-size="21" fill="#f5f5f5">GM 12345347</text>
<rect x="30" y="1030" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1064" font-size="21" fill="#f5f5f5" font-weight="bold">Spryskiwacz</text>
<text x="336" y="1064" font-size="21" fill="#f5f5f5">Optikleen GM 1051515 (1995 i 1999)</text>
<rect x="30" y="1108" width="8" height="30" fill="#dc2626"/>
<text x="50" y="1133" font-size="24" fill="#f5f5f5" font-weight="bold">Zbiornik paliwa</text>
<rect x="30" y="1152" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1186" font-size="21" fill="#f5f5f5" font-weight="bold">1995 pickup</text>
<text x="246" y="1186" font-size="21" fill="#f5f5f5">krótka paka 98 l • długa 128 l</text>
<rect x="30" y="1204" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1238" font-size="21" fill="#f5f5f5" font-weight="bold">1999</text>
<text x="246" y="1238" font-size="21" fill="#f5f5f5">Utility 113 l • Suburban benzyna 167 l / diesel 159 l</text>
<rect x="30" y="1266" width="840" height="80" rx="8" fill="#2a0f10" stroke="#dc2626" stroke-width="2"/>
<text x="48" y="1302" font-size="21" fill="#fca5a5" font-weight="bold">Uwaga: pojemności to wartości z instrukcji — po wymianie</text>
<text x="48" y="1330" font-size="21" fill="#fca5a5">zawsze sprawdź poziom bagnetem / na zbiorniczku.</text>
<rect x="30" y="1380" width="8" height="30" fill="#dc2626"/>
<text x="50" y="1405" font-size="24" fill="#f5f5f5" font-weight="bold">Legenda</text>
<rect x="40" y="1428" width="44" height="28" rx="5" fill="#2a0f10" stroke="#dc2626" stroke-width="2"/>
<text x="104" y="1449" font-size="19" fill="#f5f5f5">ostrzeżenie z manualu</text>
<text x="30" y="1500" font-size="18" fill="#a3a3a3">Sprawdź w swoim aucie / manualu — GMT400 ma wiele wariantów (rocznik, silnik,</text>
<text x="30" y="1526" font-size="18" fill="#a3a3a3">GVWR, RPO). Rysunek poglądowy, nie w skali.</text>
<text x="30" y="1552" font-size="18" fill="#a3a3a3">Źródło: Instrukcje GM: 1995 C/K 1500, 1999 Suburban</text>
</g>
