<text x="560" y="811" font-size="16" fill="#a3a3a3">masy: G101, G102, G105</text>
<rect x="30" y="1027" width="8" height="30" fill="#dc2626"/>
<text x="50" y="1052" font-size="24" fill="#f5f5f5" font-weight="bold">Jak działa lampka BAT</text>
<rect x="60" y="1071" width="780" height="108" rx="12" fill="#18181b" stroke="#f87171" stroke-width="2"/>
<circle cx="60" cy="1125.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="1132.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">1</text>
<text x="92" y="1107" font-size="23" fill="#f5f5f5" font-weight="bold">Zapłon ON, silnik stoi</text>
<text x="92" y="1137" font-size="19" fill="#a3a3a3">lampka świeci — sterownik lampki w regulatorze; to też test</text>
<text x="92" y="1163" font-size="19" fill="#a3a3a3">żarówki i obwodu.</text>
<path d="M450 1183 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="1215" width="780" height="82" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<circle cx="60" cy="1256.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="1263.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">2</text>
<text x="92" y="1251" font-size="23" fill="#f5f5f5" font-weight="bold">Silnik pracuje, ładowanie OK</text>
<text x="92" y="1281" font-size="19" fill="#a3a3a3">lampka gaśnie.</text>
<path d="M450 1301 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="1333" width="780" height="108" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<circle cx="60" cy="1387.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="1394.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">3</text>
<text x="92" y="1369" font-size="23" fill="#f5f5f5" font-weight="bold">Lampka świeci przy pracy</text>
<text x="92" y="1399" font-size="19" fill="#a3a3a3">za niskie lub za wysokie napięcie albo alternator nie kręci</text>
<text x="92" y="1425" font-size="19" fill="#a3a3a3">się (stoi pasek) — sprawdź układ.</text>
<rect x="30" y="1475" width="8" height="30" fill="#dc2626"/>
<text x="50" y="1500" font-size="24" fill="#f5f5f5" font-weight="bold">Zaciski regulatora (SM 1996)</text>
<rect x="30" y="1519" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1553" font-size="21" fill="#f5f5f5" font-weight="bold">L</text>
<text x="216" y="1553" font-size="21" fill="#f5f5f5">przez lampkę albo rezystor — włącza regulator.</text>
<rect x="30" y="1571" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1605" font-size="21" fill="#f5f5f5" font-weight="bold">I</text>
<text x="216" y="1605" font-size="21" fill="#f5f5f5">wprost do + lub przez rezystor.</text>
<rect x="30" y="1623" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1657" font-size="21" fill="#f5f5f5" font-weight="bold">P</text>
<text x="216" y="1657" font-size="21" fill="#f5f5f5">połączony ze stojanem; może iść do obrotomierza.</text>
<rect x="30" y="1675" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1709" font-size="21" fill="#f5f5f5" font-weight="bold">S</text>
<text x="216" y="1709" font-size="21" fill="#f5f5f5">pomiar napięcia w innym miejscu; nieużywany = pomiar</text>
<text x="216" y="1737" font-size="21" fill="#f5f5f5">wewnętrzny.</text>
<rect x="30" y="1755" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1789" font-size="21" fill="#f5f5f5" font-weight="bold">Oznaczenie</text>
<text x="216" y="1789" font-size="21" fill="#f5f5f5">regulator / złącze może mieć napis PLI/FS lub PLFS.</text>
<rect x="30" y="1833" width="8" height="30" fill="#dc2626"/>
<text x="50" y="1858" font-size="24" fill="#f5f5f5" font-weight="bold">Szybka diagnoza (SM 1996)</text>
<rect x="30" y="1877" width="840" height="100" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1911" font-size="21" fill="#f5f5f5" font-weight="bold">Najpierw</text>
<text x="236" y="1911" font-size="21" fill="#f5f5f5">bezpiecznik GAUGES nr 4, złącze i zacisk BAT</text>
<text x="236" y="1939" font-size="21" fill="#f5f5f5">alternatora, klemy akumulatora, pasek, bezpiecznik</text>
<text x="236" y="1967" font-size="21" fill="#f5f5f5">topikowy, masy G101 / G102 / G105.</text>
<rect x="30" y="1985" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="2019" font-size="21" fill="#f5f5f5" font-weight="bold">Obwód 25</text>
<text x="236" y="2019" font-size="21" fill="#f5f5f5">zapłon ON, wtyczka zdjęta z alternatora: na</text>
<text x="236" y="2047" font-size="21" fill="#f5f5f5">przewodzie 25 ma być napięcie akumulatora (B+).</text>
<rect x="30" y="2065" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="2099" font-size="21" fill="#f5f5f5" font-weight="bold">Za wysokie</text>
<text x="236" y="2099" font-size="21" fill="#f5f5f5">2500 obr/min, odbiorniki OFF: powyżej 16 V na</text>
<text x="236" y="2127" font-size="21" fill="#f5f5f5">akumulatorze = wymień alternator.</text>
<rect x="30" y="2145" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="2179" font-size="21" fill="#f5f5f5" font-weight="bold">Wydajność</text>
<text x="236" y="2179" font-size="21" fill="#f5f5f5">2500 obr/min, obciążenie min. 13 V: prąd w granicach</text>
<text x="236" y="2207" font-size="21" fill="#f5f5f5">15 A od wartości znamionowej = OK.</text>
<rect x="30" y="2225" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="2259" font-size="21" fill="#f5f5f5" font-weight="bold">Lampka stale</text>
<text x="236" y="2259" font-size="21" fill="#f5f5f5">zdejmij wtyczkę: gaśnie = alternator; dalej świeci =</text>
<text x="236" y="2287" font-size="21" fill="#f5f5f5">zwarcie do masy przewodu 25 lub zestaw wskaźników.</text>
<rect x="30" y="2315" width="840" height="136" rx="8" fill="#2a0f10" stroke="#dc2626" stroke-width="2"/>
<text x="48" y="2351" font-size="21" fill="#fca5a5" font-weight="bold">Uwaga: przewód 25 zwieraj do masy tylko zworką z</text>
<text x="48" y="2379" font-size="21" fill="#fca5a5">bezpiecznikiem 5 A (J 36169-A). SM 1996 podaje kolor obwodu 25</text>
<text x="48" y="2407" font-size="21" fill="#fca5a5">raz jako BRN, raz jako BLK — sprawdź w swoim aucie. CS-130 nie</text>
<text x="48" y="2435" font-size="21" fill="#fca5a5">jest naprawialny (nie rozbierać).</text>
<rect x="30" y="2485" width="8" height="30" fill="#dc2626"/>
<text x="50" y="2510" font-size="24" fill="#f5f5f5" font-weight="bold">Legenda</text>
<circle cx="62" cy="2547" r="14" fill="#dc2626"/>
<text x="62" y="2553" font-size="17" fill="#f5f5f5" font-weight="bold" text-anchor="middle">1</text>
<text x="104" y="2554" font-size="19" fill="#f5f5f5">numer odnośnika / kolejność</text>
<line x1="40" y1="2583" x2="84" y2="2583" stroke="#ef4444" stroke-width="5"/>
<text x="104" y="2590" font-size="19" fill="#f5f5f5">gruby przewód B+ (prąd ładowania)</text>
<line x1="40" y1="2619" x2="84" y2="2619" stroke="#f472b6" stroke-width="5"/>
<text x="104" y="2626" font-size="19" fill="#f5f5f5">PNK — różowy</text>
<line x1="40" y1="2655" x2="84" y2="2655" stroke="#b45309" stroke-width="5"/>
<text x="104" y="2662" font-size="19" fill="#f5f5f5">BRN — brązowy</text>
<line x1="40" y1="2691" x2="84" y2="2691" stroke="#e5e5e5" stroke-width="5"/>
<text x="104" y="2698" font-size="19" fill="#f5f5f5">WHT — biały</text>
<path d="M62 2713 v12 M48 2725 h28 M54 2732 h16 M59 2739 h6" stroke="#f5f5f5" stroke-width="3" fill="none"/>
<text x="104" y="2734" font-size="19" fill="#f5f5f5">masa</text>
<path d="M40 2763 h40 m-12 -10 l12 10 l-12 10" stroke="#dc2626" stroke-width="4" fill="none"/>
<text x="104" y="2770" font-size="19" fill="#f5f5f5">kierunek przepływu / sygnału</text>
<rect x="40" y="2785" width="44" height="28" rx="5" fill="#2a0f10" stroke="#dc2626" stroke-width="2"/>
<text x="104" y="2806" font-size="19" fill="#f5f5f5">ostrzeżenie z manualu</text>
<text x="30" y="2857" font-size="18" fill="#a3a3a3">Sprawdź w swoim aucie / manualu — GMT400 ma wiele wariantów (rocznik, silnik,</text>
<text x="30" y="2883" font-size="18" fill="#a3a3a3">GVWR, RPO). Rysunek poglądowy, nie w skali.</text>
<text x="30" y="2909" font-size="18" fill="#a3a3a3">Źródło: GM Service Manual 1996 C/K — Engine Electrical (Generator, Starting and</text>
<text x="30" y="2935" font-size="18" fill="#a3a3a3">Charging Circuit, Charging System Diagnosis)</text>
