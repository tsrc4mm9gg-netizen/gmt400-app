<!--
Źródła:
- Układ liter 12-pin (widok od czoła): Wikipedia "ALDL" (F E D C B A / G H J K L M); "No battery voltage is present in the 12 pin ALDL connector".
  https://en.wikipedia.org/wiki/ALDL
- A = masa, B = wejście diagnostyczne, procedura zwarcia A-B i kod 12: ChevyTalk FAQ https://chevytalk.org/fusionbb/showpost.php?post/2169725 ;
  FCAR https://www.fcarusa.com/TechSupport/FAQ/how-read-older-gm-codes-or-older-detroit (źródła społecznościowe/wtórne - potwierdzić w FSM rocznika).
- OBD-I do 1995, OBD-II od 1996 (Vortec): Wikipedia "Chevrolet C/K (fourth generation)".
Diesle 6.5 TD 1994-95 mają własne procedury - nie obejmuje.
Wersja ciemna (kolory dopasowane do gmt400.pl).
Licencja: własny rysunek dla gmt400.pl (do decyzji autora, np. CC BY 4.0).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="OBD-I: odczyt kodów migowych przez złącze ALDL (12-pin)">
<title>OBD-I: odczyt kodów migowych przez złącze ALDL (12-pin)</title>
<rect width="1100" height="560" fill="#0d0d0f"/>
<g font-family='DejaVu Sans, Arial, sans-serif' fill="#f5f5f5">
<text x="30" y="44" font-size="26" font-weight="bold">OBD-I: odczyt kodów migowych przez złącze ALDL (12-pin)</text>
<text x="30" y="72" font-size="15" fill="#a3a3a3">Zakres: GMT400 z silnikiem benzynowym 1988–1995 (OBD-I)</text>
<text x="30" y="110" font-size="16" >Gniazdo ALDL pod deską rozdzielczą — widok od czoła gniazda w aucie</text>
<rect x="120" y="140" width="500" height="200" rx="14" fill="#27272a" stroke="#f5f5f5" stroke-width="3"/>
<rect x="148" y="168" width="44" height="44" rx="6" fill="#1c1c1f" stroke="#f5f5f5" stroke-width="2"/>
<text x="163" y="197" font-size="20" font-weight="bold">F</text>
<rect x="228" y="168" width="44" height="44" rx="6" fill="#1c1c1f" stroke="#f5f5f5" stroke-width="2"/>
<text x="243" y="197" font-size="20" font-weight="bold">E</text>
<rect x="308" y="168" width="44" height="44" rx="6" fill="#1c1c1f" stroke="#f5f5f5" stroke-width="2"/>
<text x="323" y="197" font-size="20" font-weight="bold">D</text>
<rect x="388" y="168" width="44" height="44" rx="6" fill="#1c1c1f" stroke="#f5f5f5" stroke-width="2"/>
<text x="403" y="197" font-size="20" font-weight="bold">C</text>
<rect x="468" y="168" width="44" height="44" rx="6" fill="#991b1b" stroke="#f5f5f5" stroke-width="2"/>
<text x="483" y="197" font-size="20" font-weight="bold">B</text>
<rect x="548" y="168" width="44" height="44" rx="6" fill="#991b1b" stroke="#f5f5f5" stroke-width="2"/>
<text x="563" y="197" font-size="20" font-weight="bold">A</text>
<rect x="148" y="248" width="44" height="44" rx="6" fill="#1c1c1f" stroke="#f5f5f5" stroke-width="2"/>
<text x="163" y="277" font-size="20" font-weight="bold">G</text>
<rect x="228" y="248" width="44" height="44" rx="6" fill="#1c1c1f" stroke="#f5f5f5" stroke-width="2"/>
<text x="243" y="277" font-size="20" font-weight="bold">H</text>
<rect x="308" y="248" width="44" height="44" rx="6" fill="#1c1c1f" stroke="#f5f5f5" stroke-width="2"/>
<text x="323" y="277" font-size="20" font-weight="bold">J</text>
<rect x="388" y="248" width="44" height="44" rx="6" fill="#1c1c1f" stroke="#f5f5f5" stroke-width="2"/>
<text x="403" y="277" font-size="20" font-weight="bold">K</text>
<rect x="468" y="248" width="44" height="44" rx="6" fill="#1c1c1f" stroke="#f5f5f5" stroke-width="2"/>
<text x="483" y="277" font-size="20" font-weight="bold">L</text>
<rect x="548" y="248" width="44" height="44" rx="6" fill="#1c1c1f" stroke="#f5f5f5" stroke-width="2"/>
<text x="563" y="277" font-size="20" font-weight="bold">M</text>
<path d="M490 166 C 490 115, 570 115, 570 166" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
<text x="610" y="150" font-size="16" fill="#ef4444" font-weight="bold">← zworka (spinacz) A–B</text>
<text x="720" y="190" font-size="17" font-weight="bold">A — masa</text>
<text x="720" y="216" font-size="17" font-weight="bold">B — wejście diagnostyczne ECM</text>
<text x="720" y="250" font-size="14" fill="#a3a3a3">Pozostałe piny: przypisanie zależy od modelu</text>
<text x="720" y="270" font-size="14" fill="#a3a3a3">i rocznika (dane, ABS itd.) — wg FSM.</text>
<text x="720" y="296" font-size="14" fill="#a3a3a3">W 12-pinowym ALDL nie ma zasilania +12 V.</text>
<text x="40" y="370" font-size="16" >1. Zapłon OFF. Zewrzyj A z B (spinacz / zworka).</text>
<text x="40" y="398" font-size="16" >2. Zapłon ON, silnika NIE uruchamiaj.</text>
<text x="40" y="426" font-size="16" >3. Lampka SES/Check Engine miga kody: najpierw kod 12 (3×) = tryb diagnostyczny,</text>
<text x="40" y="454" font-size="16" >    potem zapisane kody, każdy 3× (np. błysk-pauza-błysk-błysk = 12).</text>
<text x="40" y="482" font-size="16" >4. Zapłon OFF, zdejmij zworkę. Kod wskazuje obwód, nie konkretną część.</text>
<rect x="20" y="506" width="1060" height="38" rx="6" fill="#2a0f10" stroke="#dc2626"/>
<text x="34" y="531" font-size="15" font-weight="bold" fill="#fca5a5">⚠ Sprawdź w swoim aucie / manualu — GMT400 ma wiele wariantów.</text>
</g></svg>