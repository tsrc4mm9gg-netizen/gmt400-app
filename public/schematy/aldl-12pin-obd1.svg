<text x="571" y="314" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">2</text>
<text x="450" y="585" font-size="20" fill="#f87171" font-weight="bold" text-anchor="middle">← zworka (spinacz) A–B</text>
<rect x="30" y="605" width="840" height="44" rx="8" fill="#18181b" stroke="#dc2626" stroke-width="2"/>
<text x="46" y="639" font-size="21" fill="#f87171" font-weight="bold">1 A</text>
<text x="276" y="639" font-size="21" fill="#f5f5f5">masa</text>
<rect x="30" y="657" width="840" height="44" rx="8" fill="#18181b" stroke="#dc2626" stroke-width="2"/>
<text x="46" y="691" font-size="21" fill="#f87171" font-weight="bold">2 B</text>
<text x="276" y="691" font-size="21" fill="#f5f5f5">wejście diagnostyczne ECM</text>
<rect x="30" y="709" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="743" font-size="21" fill="#f5f5f5" font-weight="bold">Pozostałe piny</text>
<text x="276" y="743" font-size="21" fill="#f5f5f5">przypisanie zależy od modelu i rocznika (dane, ABS</text>
<text x="276" y="771" font-size="21" fill="#f5f5f5">itd.) — wg FSM.</text>
<rect x="30" y="789" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="823" font-size="21" fill="#f5f5f5" font-weight="bold">Zasilanie</text>
<text x="276" y="823" font-size="21" fill="#f5f5f5">W 12-pinowym ALDL nie ma zasilania +12 V.</text>
<rect x="30" y="867" width="8" height="30" fill="#dc2626"/>
<text x="50" y="892" font-size="24" fill="#f5f5f5" font-weight="bold">Odczyt kodów</text>
<rect x="60" y="911" width="780" height="82" rx="12" fill="#18181b" stroke="#f87171" stroke-width="2"/>
<circle cx="60" cy="952.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="959.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">1</text>
<text x="92" y="947" font-size="23" fill="#f5f5f5" font-weight="bold">Zapłon OFF</text>
<text x="92" y="977" font-size="19" fill="#a3a3a3">Zewrzyj A z B (spinacz / zworka).</text>
<path d="M450 997 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="1029" width="780" height="82" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<circle cx="60" cy="1070.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="1077.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">2</text>
<text x="92" y="1065" font-size="23" fill="#f5f5f5" font-weight="bold">Zapłon ON</text>
<text x="92" y="1095" font-size="19" fill="#a3a3a3">silnika NIE uruchamiaj.</text>
<path d="M450 1115 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="1147" width="780" height="108" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<circle cx="60" cy="1201.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="1208.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">3</text>
<text x="92" y="1183" font-size="23" fill="#f5f5f5" font-weight="bold">Lampka SES/Check Engine miga kody</text>
<text x="92" y="1213" font-size="19" fill="#a3a3a3">najpierw kod 12 (3×) = tryb diagnostyczny, potem zapisane</text>
<text x="92" y="1239" font-size="19" fill="#a3a3a3">kody, każdy 3× (np. błysk-pauza-błysk-błysk = 12).</text>
<path d="M450 1259 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="1291" width="780" height="82" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<circle cx="60" cy="1332.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="1339.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">4</text>
<text x="92" y="1327" font-size="23" fill="#f5f5f5" font-weight="bold">Zapłon OFF, zdejmij zworkę</text>
<text x="92" y="1357" font-size="19" fill="#a3a3a3">Kod wskazuje obwód, nie konkretną część.</text>
<rect x="30" y="1407" width="8" height="30" fill="#dc2626"/>
<text x="50" y="1432" font-size="24" fill="#f5f5f5" font-weight="bold">Legenda</text>
<circle cx="62" cy="1469" r="14" fill="#dc2626"/>
<text x="62" y="1475" font-size="17" fill="#f5f5f5" font-weight="bold" text-anchor="middle">1</text>
<text x="104" y="1476" font-size="19" fill="#f5f5f5">numer odnośnika / kolejność</text>
<path d="M40 1505 h40 m-12 -10 l12 10 l-12 10" stroke="#dc2626" stroke-width="4" fill="none"/>
<text x="104" y="1512" font-size="19" fill="#f5f5f5">kierunek przepływu / sygnału</text>
<text x="30" y="1563" font-size="18" fill="#a3a3a3">Sprawdź w swoim aucie / manualu — GMT400 ma wiele wariantów (rocznik, silnik,</text>
<text x="30" y="1589" font-size="18" fill="#a3a3a3">GVWR, RPO). Rysunek poglądowy, nie w skali.</text>
<text x="30" y="1615" font-size="18" fill="#a3a3a3">Źródło: Wikipedia „ALDL”; ChevyTalk FAQ i FCAR (źródła wtórne — potwierdź w FSM</text>
<text x="30" y="1641" font-size="18" fill="#a3a3a3">rocznika)</text>
