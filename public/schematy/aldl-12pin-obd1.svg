<!--
Źródła:
- Układ liter 12-pin (widok od czoła): Wikipedia "ALDL" (F E D C B A / G H J K L M); "No battery voltage is present in the 12 pin ALDL connector".
-   https://en.wikipedia.org/wiki/ALDL
- A = masa, B = wejście diagnostyczne, procedura zwarcia A-B i kod 12: ChevyTalk FAQ https://chevytalk.org/fusionbb/showpost.php?post/2169725 ;
-   FCAR https://www.fcarusa.com/TechSupport/FAQ/how-read-older-gm-codes-or-older-detroit (źródła społecznościowe/wtórne - potwierdzić w FSM rocznika).
- OBD-I do 1995, OBD-II od 1996 (Vortec): Wikipedia "Chevrolet C/K (fourth generation)".
- Diesle 6.5 TD 1994-95 mają własne procedury - nie obejmuje.
- Wersja ciemna (kolory dopasowane do gmt400.pl).
Rysunek poglądowy (nie w skali). Styl v2 gmt400.pl (ciemny + czerwony). Własny rysunek gmt400.pl (bez grafik AI).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1671" width="900" height="1671" role="img" aria-label="OBD-I: odczyt kodów migowych przez złącze ALDL (12-pin)">
<title>OBD-I: odczyt kodów migowych przez złącze ALDL (12-pin)</title>
<defs><pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="1.2" fill="#1f1f24"/></pattern></defs>
<rect width="900" height="1671" fill="#0d0d0f"/>
<rect width="900" height="1671" fill="url(#g)"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="0" y="0" width="900" height="8" fill="#dc2626"/>
<text x="870" y="40" font-size="16" fill="#a3a3a3" text-anchor="end">gmt400.pl · schemat</text>
<text x="30" y="80" font-size="30" fill="#f5f5f5" font-weight="bold">OBD-I: odczyt kodów migowych przez złącze ALDL</text>
<text x="30" y="116" font-size="30" fill="#f5f5f5" font-weight="bold">(12-pin)</text>
<text x="30" y="146" font-size="20" fill="#f87171">Model i lata: GMT400 z silnikiem benzynowym 1988–1995 (OBD-I)</text>
