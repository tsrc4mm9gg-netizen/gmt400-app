<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1974" width="900" height="1974" role="img" aria-label="Układ chłodzenia — benzyna (1996+)">
<title>Układ chłodzenia — benzyna (1996+)</title>
<defs><pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="1.2" fill="#1f1f24"/></pattern></defs>
<rect width="900" height="1974" fill="#0d0d0f"/>
<rect width="900" height="1974" fill="url(#g)"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="0" y="0" width="900" height="8" fill="#dc2626"/>
<text x="870" y="40" font-size="16" fill="#a3a3a3" text-anchor="end">gmt400.pl · schemat</text>
<text x="30" y="80" font-size="30" fill="#f5f5f5" font-weight="bold">Układ chłodzenia — benzyna (1996+)</text>
<text x="30" y="110" font-size="20" fill="#f87171">Model i lata: C/K, Tahoe, Yukon, Suburban z silnikami</text>
<text x="30" y="140" font-size="20" fill="#f87171">benzynowymi 1996–2000 (SM 1996 C/K, OM 1999). Diesel 6.5:</text>
<text x="30" y="170" font-size="20" fill="#f87171">zbiornik wyrównawczy ciśnieniowy (surge tank).</text>
<line x1="30" y1="186" x2="870" y2="186" stroke="#3f3f46" stroke-width="2"/>
<rect x="30" y="216" width="8" height="30" fill="#dc2626"/>
<text x="50" y="241" font-size="24" fill="#f5f5f5" font-weight="bold">Jak krąży płyn (benzyna)</text>
<rect x="60" y="260" width="780" height="82" rx="12" fill="#18181b" stroke="#f87171" stroke-width="2"/>
<circle cx="60" cy="301.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="308.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">1</text>
<text x="92" y="296" font-size="23" fill="#f5f5f5" font-weight="bold">Pompa wody</text>
<text x="92" y="326" font-size="19" fill="#a3a3a3">napędzana paskiem, tłoczy płyn do bloku i głowic</text>
<path d="M450 346 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="378" width="780" height="82" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<circle cx="60" cy="419.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="426.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">2</text>
<text x="92" y="414" font-size="23" fill="#f5f5f5" font-weight="bold">Blok i głowice silnika</text>
<text x="92" y="444" font-size="19" fill="#a3a3a3">płyn odbiera ciepło</text>
<path d="M450 464 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="496" width="780" height="108" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<circle cx="60" cy="550.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="557.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">3</text>
<text x="92" y="532" font-size="23" fill="#f5f5f5" font-weight="bold">Termostat (woskowy)</text>
<text x="92" y="562" font-size="19" fill="#a3a3a3">zimny silnik: zamknięty — płyn krąży tylko w silniku</text>
<text x="92" y="588" font-size="19" fill="#a3a3a3">(szybkie nagrzanie); ciepły: otwiera się</text>
<path d="M450 608 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="640" width="780" height="82" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<circle cx="60" cy="681.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="688.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">4</text>
<text x="92" y="676" font-size="23" fill="#f5f5f5" font-weight="bold">Chłodnica + wentylator ze sprzęgłem</text>
<text x="92" y="706" font-size="19" fill="#a3a3a3">oddaje ciepło; korek chłodnicy 103 kPa (15 psi)</text>
<path d="M450 726 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="758" width="780" height="82" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<circle cx="60" cy="799.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="806.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">5</text>
<text x="92" y="794" font-size="23" fill="#f5f5f5" font-weight="bold">Powrót do pompy</text>
<text x="92" y="824" font-size="19" fill="#a3a3a3">nagrzewnica kabiny to osobne odgałęzienie obiegu</text>
<rect x="30" y="874" width="8" height="30" fill="#dc2626"/>
<text x="50" y="899" font-size="24" fill="#f5f5f5" font-weight="bold">Zbiorniczek wyrównawczy (benzyna)</text>
<rect x="30" y="918" width="840" height="100" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="952" font-size="21" fill="#f5f5f5" font-weight="bold">Połączenie</text>
<text x="346" y="952" font-size="21" fill="#f5f5f5">wężyk odpowietrzający od szyjki chłodnicy —</text>
<text x="346" y="980" font-size="21" fill="#f5f5f5">nadmiar płynu przy nagrzaniu, powrót przy</text>
<text x="346" y="1008" font-size="21" fill="#f5f5f5">stygnięciu</text>
<rect x="30" y="1026" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1060" font-size="21" fill="#f5f5f5" font-weight="bold">Poziom</text>
<text x="346" y="1060" font-size="21" fill="#f5f5f5">między ADD i FULL (ok. 1 l różnicy); FULL</text>
<text x="346" y="1088" font-size="21" fill="#f5f5f5">sprawdzaj na ciepłym silniku</text>
<rect x="30" y="1106" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1140" font-size="21" fill="#f5f5f5" font-weight="bold">Diesel 6.5</text>
<text x="346" y="1140" font-size="21" fill="#f5f5f5">zbiornik wyrównawczy ciśnieniowy z własnym</text>
<text x="346" y="1168" font-size="21" fill="#f5f5f5">korkiem — płyn przez niego krąży</text>
<rect x="30" y="1212" width="8" height="30" fill="#dc2626"/>
<text x="50" y="1237" font-size="24" fill="#f5f5f5" font-weight="bold">Płyn i pojemności</text>
<rect x="30" y="1256" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1290" font-size="21" fill="#f5f5f5" font-weight="bold">Płyn</text>
<text x="346" y="1290" font-size="21" fill="#f5f5f5">DEX-COOL (pomarańczowy, bez krzemianów)</text>
<text x="346" y="1318" font-size="21" fill="#f5f5f5">50/50 z wodą</text>
<rect x="30" y="1336" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1370" font-size="21" fill="#f5f5f5" font-weight="bold">Wymiana DEX-COOL</text>
<text x="346" y="1370" font-size="21" fill="#f5f5f5">OM99: 5 lat / 150 000 mil (240 000 km) • SM</text>
<text x="346" y="1398" font-size="21" fill="#f5f5f5">1996: 166 000 km (100 000 mil) / 5 lat</text>
<rect x="30" y="1416" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1450" font-size="21" fill="#f5f5f5" font-weight="bold">5.7 L31 (VIN R)</text>
<text x="346" y="1450" font-size="21" fill="#f5f5f5">16,5 l (19 l z tylną nagrzewnicą) — OM99</text>
<rect x="30" y="1468" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1502" font-size="21" fill="#f5f5f5" font-weight="bold">7.4 L29 (VIN J)</text>
<text x="346" y="1502" font-size="21" fill="#f5f5f5">23,5 l (26 l z tylną nagrzewnicą) — OM99</text>
<rect x="30" y="1530" width="840" height="136" rx="8" fill="#2a0f10" stroke="#dc2626" stroke-width="2"/>
<text x="48" y="1566" font-size="21" fill="#fca5a5" font-weight="bold">Uwaga: nie odkręcaj korka na gorącym silniku. Dolanie płynu z</text>
<text x="48" y="1594" font-size="21" fill="#fca5a5">krzemianami = wymiana już po 50 000 km (30 000 mil) / 24 mies.</text>
<text x="48" y="1622" font-size="21" fill="#fca5a5">(SM 1996). 1988–1995: płyn etylenowy wg GM 6038-M (OM95) —</text>
<text x="48" y="1650" font-size="21" fill="#fca5a5">inny niż DEX-COOL.</text>
<rect x="30" y="1700" width="8" height="30" fill="#dc2626"/>
<text x="50" y="1725" font-size="24" fill="#f5f5f5" font-weight="bold">Legenda</text>
<path d="M40 1762 h40 m-12 -10 l12 10 l-12 10" stroke="#dc2626" stroke-width="4" fill="none"/>
<text x="104" y="1769" font-size="19" fill="#f5f5f5">kierunek przepływu / sygnału</text>
<circle cx="62" cy="1798" r="14" fill="#dc2626"/>
<text x="62" y="1804" font-size="17" fill="#f5f5f5" font-weight="bold" text-anchor="middle">1</text>
<text x="104" y="1805" font-size="19" fill="#f5f5f5">numer odnośnika / kolejność</text>
<rect x="40" y="1820" width="44" height="28" rx="5" fill="#2a0f10" stroke="#dc2626" stroke-width="2"/>
<text x="104" y="1841" font-size="19" fill="#f5f5f5">ostrzeżenie z manualu</text>
<text x="30" y="1892" font-size="18" fill="#a3a3a3">Sprawdź w swoim aucie / manualu — GMT400 ma wiele wariantów (rocznik, silnik,</text>
<text x="30" y="1918" font-size="18" fill="#a3a3a3">GVWR, RPO). Rysunek poglądowy, nie w skali.</text>
<text x="30" y="1944" font-size="18" fill="#a3a3a3">Źródło: GM Service Manual 1996 C/K (Engine Cooling), instrukcja 1999 Suburban</text>
</g>
</svg>
