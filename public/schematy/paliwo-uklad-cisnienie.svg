<!--
Źródła:
- SM 1996 C Pickup, Fuel System: https://gm.saturn.team/Chevrolet/Chevy_C_Pickup___2WD/1996/2/1/183/31697
- SM 1996, Fuel System Diagnosis: https://gm.saturn.team/Chevrolet/Chevy_C_Pickup___2WD/1996/2/1/183/31643
- SM 1999 Tahoe 4WD, CSFI Description: https://gm.saturn.team/Chevrolet/Tahoe___4WD/1999/7/1/905/31296
- SM 1999, Fuel System Diagnosis: https://gm.saturn.team/Chevrolet/Tahoe___4WD/1999/7/1/905/30683
- 1995 Chevrolet C/K 1500 Owner's Manual (GM), https://assets.gm.com/manuals/chevrolet/1995_chevrolet_1500_owners.pdf
- 1999 Chevrolet Suburban Owner's Manual (GM), rozdz. 6 i 7
Rysunek poglądowy (nie w skali). Styl v2 gmt400.pl (ciemny + czerwony). Własny rysunek gmt400.pl (bez grafik AI).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1992" width="900" height="1992" role="img" aria-label="Układ paliwowy — wtrysk i ciśnienie">
<title>Układ paliwowy — wtrysk i ciśnienie</title>
<defs><pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="1.2" fill="#1f1f24"/></pattern></defs>
<rect width="900" height="1992" fill="#0d0d0f"/>
<rect width="900" height="1992" fill="url(#g)"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="0" y="0" width="900" height="8" fill="#dc2626"/>
<text x="870" y="40" font-size="16" fill="#a3a3a3" text-anchor="end">gmt400.pl · schemat</text>
<text x="30" y="80" font-size="30" fill="#f5f5f5" font-weight="bold">Układ paliwowy — wtrysk i ciśnienie</text>
<text x="30" y="110" font-size="20" fill="#f87171">Model i lata: 1988–1995: TBI (OM95). 1996–2000: CSFI „pająk” w</text>
<text x="30" y="140" font-size="20" fill="#f87171">4.3/5.0/5.7, SFI w 7.4 (SM 1996 C/K, SM 1999 Tahoe 4WD).</text>
<line x1="30" y1="156" x2="870" y2="156" stroke="#3f3f46" stroke-width="2"/>
<rect x="30" y="186" width="8" height="30" fill="#dc2626"/>
<text x="50" y="211" font-size="24" fill="#f5f5f5" font-weight="bold">Droga paliwa (1996+)</text>
<rect x="60" y="230" width="780" height="108" rx="12" fill="#18181b" stroke="#f87171" stroke-width="2"/>
<circle cx="60" cy="284.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="291.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">1</text>
<text x="92" y="266" font-size="23" fill="#f5f5f5" font-weight="bold">Pompa w zbiorniku + pulsator</text>
<text x="92" y="296" font-size="19" fill="#a3a3a3">zawór zwrotny w zbiorniku trzyma ciśnienie po wyłączeniu</text>
<text x="92" y="322" font-size="19" fill="#a3a3a3">pompy</text>
<path d="M450 342 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="374" width="780" height="108" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<circle cx="60" cy="428.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="435.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">2</text>
<text x="92" y="410" font-size="23" fill="#f5f5f5" font-weight="bold">Filtr liniowy</text>
<text x="92" y="440" font-size="19" fill="#a3a3a3">strzałka kierunku przepływu! nakrętki 27 N·m (20 lb·ft);</text>
<text x="92" y="466" font-size="19" fill="#a3a3a3">GF626 co 30 000 mil (OM99)</text>
<path d="M450 486 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="518" width="780" height="108" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<circle cx="60" cy="572.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="579.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">3</text>
<text x="92" y="554" font-size="23" fill="#f5f5f5" font-weight="bold">Regulator ciśnienia</text>
<text x="92" y="584" font-size="19" fill="#a3a3a3">utrzymuje ciśnienie; nieszczelny regulator = spadek</text>
<text x="92" y="610" font-size="19" fill="#a3a3a3">ciśnienia po wyłączeniu pompy</text>
<path d="M450 630 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="662" width="780" height="108" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<circle cx="60" cy="716.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="723.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">4</text>
<text x="92" y="698" font-size="23" fill="#f5f5f5" font-weight="bold">Wtrysk</text>
<text x="92" y="728" font-size="19" fill="#a3a3a3">CSFI: centralna jednostka + przewody do zaworków (poppet) •</text>
<text x="92" y="754" font-size="19" fill="#a3a3a3">SFI 7.4: osobne wtryskiwacze</text>
<path d="M450 774 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="806" width="780" height="82" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<circle cx="60" cy="847.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="854.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">5</text>
<text x="92" y="842" font-size="23" fill="#f5f5f5" font-weight="bold">Powrót do zbiornika</text>
<text x="92" y="872" font-size="19" fill="#a3a3a3">nadmiar paliwa wraca osobnym przewodem</text>
<rect x="30" y="922" width="8" height="30" fill="#dc2626"/>
<text x="50" y="947" font-size="24" fill="#f5f5f5" font-weight="bold">Ciśnienie (zapłon ON, silnik stoi)</text>
<rect x="30" y="966" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1000" font-size="21" fill="#f5f5f5" font-weight="bold">CSFI</text>
<text x="346" y="1000" font-size="21" fill="#f5f5f5">415–455 kPa (60–66 psi)</text>
<rect x="30" y="1018" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1052" font-size="21" fill="#f5f5f5" font-weight="bold">SFI (7.4)</text>
<text x="346" y="1052" font-size="21" fill="#f5f5f5">385–430 kPa (56–62 psi) — SM 1996</text>
<rect x="30" y="1070" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1104" font-size="21" fill="#f5f5f5" font-weight="bold">Trzymanie (CSFI, SM</text>
<text x="46" y="1132" font-size="21" fill="#f5f5f5" font-weight="bold">1999)</text>
<text x="346" y="1104" font-size="21" fill="#f5f5f5">379–413 kPa (55–60 psi) po wyłączeniu pompy</text>
<rect x="30" y="1150" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1184" font-size="21" fill="#f5f5f5" font-weight="bold">Poniżej 300 kPa (44 psi)</text>
<text x="346" y="1184" font-size="21" fill="#f5f5f5">na biegu jałowym — auto praktycznie nie</text>
<text x="346" y="1212" font-size="21" fill="#f5f5f5">jedzie</text>
<rect x="30" y="1230" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1264" font-size="21" fill="#f5f5f5" font-weight="bold">Nigdy powyżej</text>
<text x="346" y="1264" font-size="21" fill="#f5f5f5">517 kPa (75 psi) — można uszkodzić układ</text>
<rect x="30" y="1308" width="8" height="30" fill="#dc2626"/>
<text x="50" y="1333" font-size="24" fill="#f5f5f5" font-weight="bold">Pompa — sterowanie</text>
<rect x="30" y="1352" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1386" font-size="21" fill="#f5f5f5" font-weight="bold">Kluczyk ON</text>
<text x="346" y="1386" font-size="21" fill="#f5f5f5">VCM włącza przekaźnik pompy na 2 s</text>
<rect x="30" y="1404" width="840" height="100" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1438" font-size="21" fill="#f5f5f5" font-weight="bold">Rezerwa</text>
<text x="346" y="1438" font-size="21" fill="#f5f5f5">czujnik ciśnienia oleju włącza pompę przy</text>
<text x="346" y="1466" font-size="21" fill="#f5f5f5">ok. 28 kPa (4 psi) — zepsuty przekaźnik =</text>
<text x="346" y="1494" font-size="21" fill="#f5f5f5">długie kręcenie</text>
<rect x="30" y="1522" width="840" height="136" rx="8" fill="#2a0f10" stroke="#dc2626" stroke-width="2"/>
<text x="48" y="1558" font-size="21" fill="#fca5a5" font-weight="bold">Uwaga: układ jest pod ciśnieniem także po wyłączeniu silnika.</text>
<text x="48" y="1586" font-size="21" fill="#fca5a5">Po pracy test szczelności: zapłon ON 2 s, OFF 10 s, znowu ON —</text>
<text x="48" y="1614" font-size="21" fill="#fca5a5">i obejrzyj złącza. TBI 1988–1995 ma inne wartości — sprawdź w</text>
<text x="48" y="1642" font-size="21" fill="#fca5a5">swoim manualu.</text>
<rect x="30" y="1692" width="8" height="30" fill="#dc2626"/>
<text x="50" y="1717" font-size="24" fill="#f5f5f5" font-weight="bold">Legenda</text>
<path d="M40 1754 h40 m-12 -10 l12 10 l-12 10" stroke="#dc2626" stroke-width="4" fill="none"/>
<text x="104" y="1761" font-size="19" fill="#f5f5f5">kierunek przepływu / sygnału</text>
<circle cx="62" cy="1790" r="14" fill="#dc2626"/>
<text x="62" y="1796" font-size="17" fill="#f5f5f5" font-weight="bold" text-anchor="middle">1</text>
<text x="104" y="1797" font-size="19" fill="#f5f5f5">numer odnośnika / kolejność</text>
<rect x="40" y="1812" width="44" height="28" rx="5" fill="#2a0f10" stroke="#dc2626" stroke-width="2"/>
<text x="104" y="1833" font-size="19" fill="#f5f5f5">ostrzeżenie z manualu</text>
<text x="30" y="1884" font-size="18" fill="#a3a3a3">Sprawdź w swoim aucie / manualu — GMT400 ma wiele wariantów (rocznik, silnik,</text>
<text x="30" y="1910" font-size="18" fill="#a3a3a3">GVWR, RPO). Rysunek poglądowy, nie w skali.</text>
<text x="30" y="1936" font-size="18" fill="#a3a3a3">Źródło: GM Service Manual 1996 C/K i 1999 Tahoe (Engine Controls), instrukcje</text>
<text x="30" y="1962" font-size="18" fill="#a3a3a3">1995 i 1999</text>
</g>
</svg>
