<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1396" width="900" height="1396" role="img" aria-label="Uszczelki kolektora Vortec 5.0/5.7 — montaż">
<title>Uszczelki kolektora Vortec 5.0/5.7 — montaż</title>
<defs><pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="1.2" fill="#1f1f24"/></pattern></defs>
<rect width="900" height="1396" fill="#0d0d0f"/>
<rect width="900" height="1396" fill="url(#g)"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="0" y="0" width="900" height="8" fill="#dc2626"/>
<text x="870" y="40" font-size="16" fill="#a3a3a3" text-anchor="end">gmt400.pl · schemat</text>
<text x="30" y="80" font-size="30" fill="#f5f5f5" font-weight="bold">Uszczelki kolektora Vortec 5.0/5.7 — montaż</text>
<text x="30" y="110" font-size="20" fill="#f87171">Model i lata: Silniki Vortec 5.0 L30 / 5.7 L31 w C/K, Tahoe,</text>
<text x="30" y="140" font-size="20" fill="#f87171">Yukon, Suburban 1996–2000 (procedura z SM 1996 C/K, Engine</text>
<text x="30" y="170" font-size="20" fill="#f87171">Mechanical 5.0L/5.7L).</text>
<line x1="30" y1="186" x2="870" y2="186" stroke="#3f3f46" stroke-width="2"/>
<rect x="30" y="216" width="8" height="30" fill="#dc2626"/>
<text x="50" y="241" font-size="24" fill="#f5f5f5" font-weight="bold">Przekrój — gdzie są uszczelki</text>
<rect x="250" y="270" width="400" height="70" rx="10" fill="#18181b" stroke="#f5f5f5" stroke-width="2"/>
<text x="450" y="314" font-size="22" fill="#f5f5f5" font-weight="bold" text-anchor="middle">kolektor dolny</text>
<path d="M110 440 L250 340 L270 360 L140 460 Z" fill="#27272a" stroke="#f5f5f5" stroke-width="2"/>
<path d="M790 440 L650 340 L630 360 L760 460 Z" fill="#27272a" stroke="#f5f5f5" stroke-width="2"/>
<text x="120" y="495" font-size="20" fill="#a3a3a3">głowica L</text>
<text x="700" y="495" font-size="20" fill="#a3a3a3">głowica P</text>
<line x1="250" y1="336" x2="252" y2="354" stroke="#dc2626" stroke-width="8"/><line x1="650" y1="336" x2="648" y2="354" stroke="#dc2626" stroke-width="8"/>
<text x="160" y="375" font-size="19" fill="#f87171">uszczelka</text>
<text x="660" y="375" font-size="19" fill="#f87171">uszczelka</text>
<rect x="320" y="410" width="260" height="44" rx="6" fill="#991b1b"/>
<text x="450" y="440" font-size="20" fill="#f5f5f5" text-anchor="middle">blok: przód / tył</text>
<text x="450" y="485" font-size="19" fill="#f87171" text-anchor="middle">ścieg 5 mm na bloku</text>
<rect x="30" y="546" width="8" height="30" fill="#dc2626"/>
<text x="50" y="571" font-size="24" fill="#f5f5f5" font-weight="bold">Kolejność (SM 1996)</text>
<rect x="30" y="590" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="624" font-size="21" fill="#f5f5f5" font-weight="bold">1. Klej na uszczelkę</text>
<text x="346" y="624" font-size="21" fill="#f5f5f5">łatka 4 mm kleju GM 12346141 na końcach</text>
<text x="346" y="652" font-size="21" fill="#f5f5f5">uszczelki kolektora dolnego</text>
<rect x="30" y="670" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="704" font-size="21" fill="#f5f5f5" font-weight="bold">2. Kołki ustalające</text>
<text x="346" y="704" font-size="21" fill="#f5f5f5">załóż uszczelki na kołkach ustalających</text>
<rect x="30" y="722" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="756" font-size="21" fill="#f5f5f5" font-weight="bold">3. Uszczelniacz na bloku</text>
<text x="346" y="756" font-size="21" fill="#f5f5f5">ścieg 5 mm z przodu i z tyłu bloku,</text>
<text x="346" y="784" font-size="21" fill="#f5f5f5">zachodzący 13 mm na każdą uszczelkę</text>
<rect x="30" y="802" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="836" font-size="21" fill="#f5f5f5" font-weight="bold">4. Montuj na mokro</text>
<text x="346" y="836" font-size="21" fill="#f5f5f5">kolektor zakładaj, póki uszczelniacz jest</text>
<text x="346" y="864" font-size="21" fill="#f5f5f5">mokry</text>
<rect x="30" y="882" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="916" font-size="21" fill="#f5f5f5" font-weight="bold">5. Śruby</text>
<text x="346" y="916" font-size="21" fill="#f5f5f5">klej do gwintów GM 12345382 na śruby</text>
<text x="346" y="944" font-size="21" fill="#f5f5f5">kolektora dolnego</text>
<rect x="30" y="962" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="996" font-size="21" fill="#f5f5f5" font-weight="bold">6. Dokręcanie</text>
<text x="346" y="996" font-size="21" fill="#f5f5f5">kolejność 1–8: najpierw 3 N·m, potem 12 N·m,</text>
<text x="346" y="1024" font-size="21" fill="#f5f5f5">na końcu 15 N·m</text>
<rect x="30" y="1052" width="840" height="108" rx="8" fill="#2a0f10" stroke="#dc2626" stroke-width="2"/>
<text x="48" y="1088" font-size="21" fill="#fca5a5" font-weight="bold">Uwaga: zła kolejność dokręcania może zdeformować współosiowość</text>
<text x="48" y="1116" font-size="21" fill="#fca5a5">gniazd łożysk wału (ostrzeżenie SM 1996). Momenty i środki —</text>
<text x="48" y="1144" font-size="21" fill="#fca5a5">sprawdź w manualu dla swojego rocznika.</text>
<rect x="30" y="1194" width="8" height="30" fill="#dc2626"/>
<text x="50" y="1219" font-size="24" fill="#f5f5f5" font-weight="bold">Legenda</text>
<rect x="40" y="1242" width="44" height="28" rx="5" fill="#2a0f10" stroke="#dc2626" stroke-width="2"/>
<text x="104" y="1263" font-size="19" fill="#f5f5f5">ostrzeżenie z manualu</text>
<text x="30" y="1314" font-size="18" fill="#a3a3a3">Sprawdź w swoim aucie / manualu — GMT400 ma wiele wariantów (rocznik, silnik,</text>
<text x="30" y="1340" font-size="18" fill="#a3a3a3">GVWR, RPO). Rysunek poglądowy, nie w skali.</text>
<text x="30" y="1366" font-size="18" fill="#a3a3a3">Źródło: GM Service Manual 1996 C/K — Intake Manifold Replacement 5.0L/5.7L</text>
</g>
</svg>
