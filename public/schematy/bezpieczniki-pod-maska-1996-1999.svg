<text x="30" y="912" font-size="18" fill="#a3a3a3">bezpieczniki zapasowe i szczypce (SPARE, FUSE PULLER). Przerywana ramka =</text>
<text x="30" y="935" font-size="18" fill="#a3a3a3">gniazdo bez opisu na rysunku. Rozmieszczenie poglądowe wg OM99 — w C/K 1996–1998</text>
<text x="30" y="958" font-size="18" fill="#a3a3a3">sprawdź z pokrywą.</text>
