<text x="246" y="785" font-size="21" fill="#f5f5f5">PWM 10) lub piny producenta (np. pin 9: GM ALDL 8192</text>
<text x="246" y="813" font-size="21" fill="#f5f5f5">bd „gdzie występuje”). Co jest obsadzone w Twoim</text>
<text x="246" y="841" font-size="21" fill="#f5f5f5">aucie — sprawdź w FSM.</text>
