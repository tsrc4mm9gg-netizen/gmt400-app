<!--
Źródła:
- Numeracja i funkcje pinów J1962 (2 = J1850 bus+, PWM i VPW; 10 = J1850 bus- tylko PWM; 4 masa podwozia; 5 masa sygnałowa;
  6/14 CAN; 7/15 K/L-line; 16 +12 V; 9 "GM: 8192 baud ALDL where fitted"): Wikipedia "On-board diagnostics", sekcja OBD-II diagnostic connector.
  https://en.wikipedia.org/wiki/On-board_diagnostics
- J1850 VPW jako standard GM ("Class 2 (GM, 10.4K)"): ten sam artykuł.
- OBD-II od 1996 w GMT400: Wikipedia "Chevrolet C/K (fourth generation)".
- Kształt gniazda: por. Commons File:OBD-II type A female connector pinout.svg (CC0, Xoneca).
Lokalizacja "pod deską po stronie kierowcy" - typowa; potwierdź w instrukcji obsługi rocznika.
Wersja ciemna (kolory dopasowane do gmt400.pl).
Licencja: własny rysunek dla gmt400.pl (do decyzji autora, np. CC BY 4.0).
-->
