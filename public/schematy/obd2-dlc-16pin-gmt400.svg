<rect x="640" y="134" width="20" height="20" fill="#991b1b" stroke="#f5f5f5"/>
<text x="670" y="150" font-size="16" >pin 2: J1850 VPW (GM Class 2) — dane OBD-II</text>
<rect x="640" y="166" width="20" height="20" fill="#52525b" stroke="#f5f5f5"/>
<text x="670" y="182" font-size="16" >pin 4: masa podwozia</text>
<rect x="640" y="198" width="20" height="20" fill="#52525b" stroke="#f5f5f5"/>
<text x="670" y="214" font-size="16" >pin 5: masa sygnałowa</text>
<rect x="640" y="230" width="20" height="20" fill="#f87171" stroke="#f5f5f5"/>
<text x="670" y="246" font-size="16" >pin 16: +12 V akumulator (stałe)</text>
<text x="640" y="284" font-size="14" fill="#a3a3a3">Pozostałe piny: inne protokoły J1962 (CAN 6/14,</text>
<text x="640" y="304" font-size="14" fill="#a3a3a3">K/L-line 7/15, J1850 PWM 10) lub piny producenta</text>
<text x="640" y="324" font-size="14" fill="#a3a3a3">(np. pin 9: GM ALDL 8192 bd „gdzie występuje”).</text>
<text x="640" y="344" font-size="14" fill="#a3a3a3">Co jest obsadzone w Twoim aucie — sprawdź w FSM.</text>
<text x="40" y="370" font-size="16" >• OBD-II w GMT400: od rocznika 1996 (silniki Vortec). Kody P0xxx dotyczą tylko 1996+.</text>
<text x="40" y="400" font-size="16" >• Do odczytu potrzebny skaner OBD-II obsługujący J1850 VPW (standard GM).</text>
<text x="40" y="430" font-size="16" >• 1988–1995: inne, 12-pinowe złącze ALDL i kody 2-cyfrowe — patrz osobny schemat.</text>
<rect x="20" y="506" width="1060" height="38" rx="6" fill="#2a0f10" stroke="#dc2626"/>
<text x="34" y="531" font-size="15" font-weight="bold" fill="#fca5a5">⚠ Sprawdź w swoim aucie / manualu — GMT400 ma wiele wariantów.</text>
</g></svg>