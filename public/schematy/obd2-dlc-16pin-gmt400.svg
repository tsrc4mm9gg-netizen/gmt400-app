<text x="46" y="963" font-size="21" fill="#f5f5f5" font-weight="bold">Od kiedy</text>
<text x="246" y="963" font-size="21" fill="#f5f5f5">OBD-II w GMT400: od rocznika 1996 (silniki Vortec).</text>
<text x="246" y="991" font-size="21" fill="#f5f5f5">Kody P0xxx dotyczą tylko 1996+.</text>
<rect x="30" y="1009" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1043" font-size="21" fill="#f5f5f5" font-weight="bold">Skaner</text>
<text x="246" y="1043" font-size="21" fill="#f5f5f5">Do odczytu potrzebny skaner OBD-II obsługujący J1850</text>
<text x="246" y="1071" font-size="21" fill="#f5f5f5">VPW (standard GM).</text>
<rect x="30" y="1089" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1123" font-size="21" fill="#f5f5f5" font-weight="bold">1988–1995</text>
<text x="246" y="1123" font-size="21" fill="#f5f5f5">inne, 12-pinowe złącze ALDL i kody 2-cyfrowe — patrz</text>
<text x="246" y="1151" font-size="21" fill="#f5f5f5">osobny schemat.</text>
<rect x="30" y="1195" width="8" height="30" fill="#dc2626"/>
<text x="50" y="1220" font-size="24" fill="#f5f5f5" font-weight="bold">Legenda</text>
<circle cx="62" cy="1257" r="14" fill="#dc2626"/>
<text x="62" y="1263" font-size="17" fill="#f5f5f5" font-weight="bold" text-anchor="middle">1</text>
<text x="104" y="1264" font-size="19" fill="#f5f5f5">numer odnośnika / kolejność</text>
<text x="30" y="1315" font-size="18" fill="#a3a3a3">Sprawdź w swoim aucie / manualu — GMT400 ma wiele wariantów (rocznik, silnik,</text>
<text x="30" y="1341" font-size="18" fill="#a3a3a3">GVWR, RPO). Rysunek poglądowy, nie w skali.</text>
<text x="30" y="1367" font-size="18" fill="#a3a3a3">Źródło: Wikipedia „On-board diagnostics” (J1962) i „Chevrolet C/K (fourth</text>
<text x="30" y="1393" font-size="18" fill="#a3a3a3">generation)”</text>
