<!--
Źródła:
- "Suspension for the GMT400 chassis is fully independent with unequal-length control arms. C-series trucks used front coil springs, with front torsion bars for K-series trucks":
-   Wikipedia "Chevrolet C/K (fourth generation)", sekcja Chassis.
- Przyciski 4WD od 1996 i AutoTrac (NV246) od 1998: Wikipedia "Chevrolet Tahoe" (1. generacja). NP241/NP243 w K1500: GMT Central (źródło wtórne) - potwierdzić tabliczką/FSM.
- Zdjęcie poglądowe: Commons "File:New front axles assembly- driver's side.jpg" (simonov, CC BY-SA 2.0, 1998 Chevrolet Suburban).
- Schemat blokowy, bez geometrii i momentów - te wg FSM, rozdział Front Suspension.
- Wersja ciemna (kolory dopasowane do gmt400.pl).
Rysunek poglądowy (nie w skali). Styl v2 gmt400.pl (ciemny + czerwony). Własny rysunek gmt400.pl (bez grafik AI).
-->
