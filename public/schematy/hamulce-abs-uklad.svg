<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1678" width="900" height="1678" role="img" aria-label="Hamulce — układ i ABS">
<title>Hamulce — układ i ABS</title>
<rect width="900" height="1678" fill="#0d0d0f"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="30" y="58" font-size="30" fill="#f5f5f5" font-weight="bold">Hamulce — układ i ABS</text>
<text x="30" y="90" font-size="20" fill="#f87171">Model i lata: Tahoe/Yukon/Suburban 1999 (SM 1999 Tahoe</text>
<text x="30" y="122" font-size="20" fill="#f87171">4WD) — ABS 3-kanałowy; C/K 1995 (OM95) — ABS na 4 koła.</text>
<text x="30" y="154" font-size="20" fill="#f87171">RWAL 1988–1994 — sprawdź w swoim manualu.</text>
<rect x="30" y="200" width="8" height="30" fill="#dc2626"/>
<text x="48" y="225" font-size="24" fill="#f5f5f5" font-weight="bold">Droga płynu (1999)</text>
<rect x="60" y="242" width="780" height="102" rx="12" fill="#18181b" stroke="#f87171" stroke-width="2"/>
<text x="80" y="276" font-size="23" fill="#f5f5f5" font-weight="bold">Pompa hamulcowa + wspomaganie</text>
<text x="80" y="306" font-size="19" fill="#a3a3a3">podciśnieniowe albo Hydro-Boost (zasilany płynem wspomagania</text>
<text x="80" y="332" font-size="19" fill="#a3a3a3">kierownicy)</text>
<path d="M450 348 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="380" width="780" height="102" rx="12" fill="#18181b" stroke="#f5f5f5" stroke-width="2"/>
<text x="80" y="414" font-size="23" fill="#f5f5f5" font-weight="bold">EHCU = EBCM + modulator BPMV</text>
<text x="80" y="444" font-size="19" fill="#a3a3a3">lewa strona komory silnika, przy pompie hamulcowej / lewym</text>
<text x="80" y="470" font-size="19" fill="#a3a3a3">nadkolu</text>
<path d="M450 486 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="518" width="780" height="102" rx="12" fill="#18181b" stroke="#f5f5f5" stroke-width="2"/>
<text x="80" y="552" font-size="23" fill="#f5f5f5" font-weight="bold">3 kanały ABS</text>
<text x="80" y="582" font-size="19" fill="#a3a3a3">3 czujniki prędkości: lewy przód • prawy przód • tył</text>
<text x="80" y="608" font-size="19" fill="#a3a3a3">(wspólny); lampka ABS bursztynowa, BRAKE czerwona</text>
<path d="M450 624 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="656" width="780" height="102" rx="12" fill="#18181b" stroke="#f5f5f5" stroke-width="2"/>
<text x="80" y="690" font-size="23" fill="#f5f5f5" font-weight="bold">Przód tarcze / tył bębny</text>
<text x="80" y="720" font-size="19" fill="#a3a3a3">wg RPO: tarcza 295×31,8 mm (JB5/JD5/JB6/JD6) lub 319×32,1 mm</text>
<text x="80" y="746" font-size="19" fill="#a3a3a3">(JB7/JD7/JB8/Z56); JF9 — tarcze także z tyłu</text>
<rect x="30" y="788" width="8" height="30" fill="#dc2626"/>
<text x="48" y="813" font-size="24" fill="#f5f5f5" font-weight="bold">Zawór zespolony (combination valve)</text>
<rect x="30" y="830" width="840" height="100" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="864" font-size="21" fill="#f5f5f5" font-weight="bold">Sekcja dozująca</text>
<text x="346" y="864" font-size="21" fill="#f5f5f5">ogranicza ciśnienie na przednie tarcze, aż</text>
<text x="346" y="892" font-size="21" fill="#f5f5f5">pokona sprężyny szczęk tylnych; poniżej 200</text>
<text x="346" y="920" font-size="21" fill="#f5f5f5">kPa (30 psi) — bez ograniczenia</text>
<rect x="30" y="938" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="972" font-size="21" fill="#f5f5f5" font-weight="bold">Przełącznik różnicowy</text>
<text x="346" y="972" font-size="21" fill="#f5f5f5">zapala czerwoną BRAKE przy awarii obwodu;</text>
<text x="346" y="1000" font-size="21" fill="#f5f5f5">zostaje „zatrzaśnięty”</text>
<rect x="30" y="1018" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="1052" font-size="21" fill="#f5f5f5" font-weight="bold">Gaszenie BRAKE</text>
<text x="346" y="1052" font-size="21" fill="#f5f5f5">napraw usterkę, potem wciśnij pedał tak, by</text>
<text x="346" y="1080" font-size="21" fill="#f5f5f5">uzyskać ok. 3100 kPa (450 psi) w przewodach</text>
<rect x="30" y="1098" width="840" height="100" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="1132" font-size="21" fill="#f5f5f5" font-weight="bold">Proporcjonowanie</text>
<text x="346" y="1132" font-size="21" fill="#f5f5f5">ogranicza ciśnienie na tył (mniej blokowania</text>
<text x="346" y="1160" font-size="21" fill="#f5f5f5">przy lekkim tyle); awaria przodu — obejście</text>
<text x="346" y="1188" font-size="21" fill="#f5f5f5">daje tyłowi pełne ciśnienie</text>
<rect x="30" y="1228" width="8" height="30" fill="#dc2626"/>
<text x="48" y="1253" font-size="24" fill="#f5f5f5" font-weight="bold">Płyny — nie mieszaj!</text>
<rect x="30" y="1270" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="1304" font-size="21" fill="#f5f5f5" font-weight="bold">Hamulce</text>
<text x="346" y="1304" font-size="21" fill="#f5f5f5">Delco Supreme 11 GM 12377967 lub DOT-3,</text>
<text x="346" y="1332" font-size="21" fill="#f5f5f5">tylko z zamkniętego pojemnika</text>
<rect x="30" y="1350" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="1384" font-size="21" fill="#f5f5f5" font-weight="bold">Hydro-Boost</text>
<text x="346" y="1384" font-size="21" fill="#f5f5f5">płyn wspomagania kierownicy — NIGDY płyn</text>
<text x="346" y="1412" font-size="21" fill="#f5f5f5">hamulcowy</text>
<rect x="30" y="1440" width="840" height="108" rx="8" fill="#2a0f10" stroke="#dc2626" stroke-width="2"/>
<text x="48" y="1476" font-size="21" fill="#fca5a5" font-weight="bold">Uwaga: nie mieszaj płynu wspomagania z hamulcowym (SM</text>
<text x="48" y="1504" font-size="21" fill="#fca5a5">1999). Po wymianie EBCM lub rozmiaru opon — kalibracja</text>
<text x="48" y="1532" font-size="21" fill="#fca5a5">rozmiaru opon skanerem.</text>
<text x="30" y="1596" font-size="18" fill="#a3a3a3">Sprawdź w swoim aucie / manualu — GMT400 ma wiele wariantów (rocznik,</text>
<text x="30" y="1622" font-size="18" fill="#a3a3a3">silnik, GVWR, RPO). Rysunek poglądowy, nie w skali.</text>
<text x="30" y="1648" font-size="18" fill="#a3a3a3">Źródło: GM Service Manual 1999 Tahoe 4WD (Brakes/ABS), instrukcja 1995 C/K</text>
</g>
</svg>
