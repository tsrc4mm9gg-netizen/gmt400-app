- SM 1999, Combination Valve Description: https://gm.saturn.team/Chevrolet/Tahoe___4WD/1999/7/4/795/50063
- SM 1999, Brake Fluid: https://gm.saturn.team/Chevrolet/Tahoe___4WD/1999/7/4/795/50098
