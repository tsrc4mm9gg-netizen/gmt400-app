Rysunek poglądowy (nie w skali). Styl v2 gmt400.pl (ciemny + czerwony). Własny rysunek gmt400.pl (bez grafik AI).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1910" width="900" height="1910" role="img" aria-label="Hamulce — układ i ABS">
<title>Hamulce — układ i ABS</title>
<defs><pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="1.2" fill="#1f1f24"/></pattern></defs>
<rect width="900" height="1910" fill="#0d0d0f"/>
<rect width="900" height="1910" fill="url(#g)"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="0" y="0" width="900" height="8" fill="#dc2626"/>
<text x="870" y="40" font-size="16" fill="#a3a3a3" text-anchor="end">gmt400.pl · schemat</text>
<text x="30" y="80" font-size="30" fill="#f5f5f5" font-weight="bold">Hamulce — układ i ABS</text>
<text x="30" y="110" font-size="20" fill="#f87171">Model i lata: Tahoe/Yukon/Suburban 1999 (SM 1999 Tahoe 4WD) —</text>
<text x="30" y="140" font-size="20" fill="#f87171">ABS 3-kanałowy; C/K 1995 (OM95) — ABS na 4 koła. RWAL</text>
<text x="30" y="170" font-size="20" fill="#f87171">1988–1994 — sprawdź w swoim manualu.</text>
<line x1="30" y1="186" x2="870" y2="186" stroke="#3f3f46" stroke-width="2"/>
<rect x="30" y="216" width="8" height="30" fill="#dc2626"/>
<text x="50" y="241" font-size="24" fill="#f5f5f5" font-weight="bold">Droga płynu (1999)</text>
<rect x="60" y="260" width="780" height="108" rx="12" fill="#18181b" stroke="#f87171" stroke-width="2"/>
<circle cx="60" cy="314.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="321.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">1</text>
<text x="92" y="296" font-size="23" fill="#f5f5f5" font-weight="bold">Pompa hamulcowa + wspomaganie</text>
<text x="92" y="326" font-size="19" fill="#a3a3a3">podciśnieniowe albo Hydro-Boost (zasilany płynem wspomagania</text>
<text x="92" y="352" font-size="19" fill="#a3a3a3">kierownicy)</text>
<path d="M450 372 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="404" width="780" height="108" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<circle cx="60" cy="458.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="465.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">2</text>
<text x="92" y="440" font-size="23" fill="#f5f5f5" font-weight="bold">EHCU = EBCM + modulator BPMV</text>
<text x="92" y="470" font-size="19" fill="#a3a3a3">lewa strona komory silnika, przy pompie hamulcowej / lewym</text>
<text x="92" y="496" font-size="19" fill="#a3a3a3">nadkolu</text>
<path d="M450 516 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="548" width="780" height="108" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<circle cx="60" cy="602.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="609.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">3</text>
<text x="92" y="584" font-size="23" fill="#f5f5f5" font-weight="bold">3 kanały ABS</text>
<text x="92" y="614" font-size="19" fill="#a3a3a3">3 czujniki prędkości: lewy przód • prawy przód • tył</text>
<text x="92" y="640" font-size="19" fill="#a3a3a3">(wspólny); lampka ABS bursztynowa, BRAKE czerwona</text>
<path d="M450 660 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="692" width="780" height="108" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<circle cx="60" cy="746.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="753.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">4</text>
<text x="92" y="728" font-size="23" fill="#f5f5f5" font-weight="bold">Przód tarcze / tył bębny</text>
<text x="92" y="758" font-size="19" fill="#a3a3a3">wg RPO: tarcza 295×31,8 mm (JB5/JD5/JB6/JD6) lub 319×32,1 mm</text>
<text x="92" y="784" font-size="19" fill="#a3a3a3">(JB7/JD7/JB8/Z56); JF9 — tarcze także z tyłu</text>
<rect x="30" y="834" width="8" height="30" fill="#dc2626"/>
<text x="50" y="859" font-size="24" fill="#f5f5f5" font-weight="bold">Zawór zespolony (combination valve)</text>
<rect x="30" y="878" width="840" height="100" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="912" font-size="21" fill="#f5f5f5" font-weight="bold">Sekcja dozująca</text>
<text x="346" y="912" font-size="21" fill="#f5f5f5">ogranicza ciśnienie na przednie tarcze, aż</text>
<text x="346" y="940" font-size="21" fill="#f5f5f5">pokona sprężyny szczęk tylnych; poniżej 200</text>
<text x="346" y="968" font-size="21" fill="#f5f5f5">kPa (30 psi) — bez ograniczenia</text>
<rect x="30" y="986" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1020" font-size="21" fill="#f5f5f5" font-weight="bold">Przełącznik różnicowy</text>
<text x="346" y="1020" font-size="21" fill="#f5f5f5">zapala czerwoną BRAKE przy awarii obwodu;</text>
<text x="346" y="1048" font-size="21" fill="#f5f5f5">zostaje „zatrzaśnięty”</text>
<rect x="30" y="1066" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1100" font-size="21" fill="#f5f5f5" font-weight="bold">Gaszenie BRAKE</text>
<text x="346" y="1100" font-size="21" fill="#f5f5f5">napraw usterkę, potem wciśnij pedał tak, by</text>
<text x="346" y="1128" font-size="21" fill="#f5f5f5">uzyskać ok. 3100 kPa (450 psi) w przewodach</text>
<rect x="30" y="1146" width="840" height="100" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1180" font-size="21" fill="#f5f5f5" font-weight="bold">Proporcjonowanie</text>
<text x="346" y="1180" font-size="21" fill="#f5f5f5">ogranicza ciśnienie na tył (mniej blokowania</text>
<text x="346" y="1208" font-size="21" fill="#f5f5f5">przy lekkim tyle); awaria przodu — obejście</text>
<text x="346" y="1236" font-size="21" fill="#f5f5f5">daje tyłowi pełne ciśnienie</text>
<rect x="30" y="1280" width="8" height="30" fill="#dc2626"/>
<text x="50" y="1305" font-size="24" fill="#f5f5f5" font-weight="bold">Płyny — nie mieszaj!</text>
<rect x="30" y="1324" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1358" font-size="21" fill="#f5f5f5" font-weight="bold">Hamulce</text>
<text x="346" y="1358" font-size="21" fill="#f5f5f5">Delco Supreme 11 GM 12377967 lub DOT-3,</text>
<text x="346" y="1386" font-size="21" fill="#f5f5f5">tylko z zamkniętego pojemnika</text>
<rect x="30" y="1404" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1438" font-size="21" fill="#f5f5f5" font-weight="bold">Hydro-Boost</text>
<text x="346" y="1438" font-size="21" fill="#f5f5f5">płyn wspomagania kierownicy — NIGDY płyn</text>
<text x="346" y="1466" font-size="21" fill="#f5f5f5">hamulcowy</text>
<rect x="30" y="1494" width="840" height="108" rx="8" fill="#2a0f10" stroke="#dc2626" stroke-width="2"/>
<text x="48" y="1530" font-size="21" fill="#fca5a5" font-weight="bold">Uwaga: nie mieszaj płynu wspomagania z hamulcowym (SM 1999).</text>
<text x="48" y="1558" font-size="21" fill="#fca5a5">Po wymianie EBCM lub rozmiaru opon — kalibracja rozmiaru opon</text>
<text x="48" y="1586" font-size="21" fill="#fca5a5">skanerem.</text>
<rect x="30" y="1636" width="8" height="30" fill="#dc2626"/>
<text x="50" y="1661" font-size="24" fill="#f5f5f5" font-weight="bold">Legenda</text>
<path d="M40 1698 h40 m-12 -10 l12 10 l-12 10" stroke="#dc2626" stroke-width="4" fill="none"/>
<text x="104" y="1705" font-size="19" fill="#f5f5f5">kierunek przepływu / sygnału</text>
<circle cx="62" cy="1734" r="14" fill="#dc2626"/>
<text x="62" y="1740" font-size="17" fill="#f5f5f5" font-weight="bold" text-anchor="middle">1</text>
<text x="104" y="1741" font-size="19" fill="#f5f5f5">numer odnośnika / kolejność</text>
<rect x="40" y="1756" width="44" height="28" rx="5" fill="#2a0f10" stroke="#dc2626" stroke-width="2"/>
<text x="104" y="1777" font-size="19" fill="#f5f5f5">ostrzeżenie z manualu</text>
<text x="30" y="1828" font-size="18" fill="#a3a3a3">Sprawdź w swoim aucie / manualu — GMT400 ma wiele wariantów (rocznik, silnik,</text>
<text x="30" y="1854" font-size="18" fill="#a3a3a3">GVWR, RPO). Rysunek poglądowy, nie w skali.</text>
<text x="30" y="1880" font-size="18" fill="#a3a3a3">Źródło: GM Service Manual 1999 Tahoe 4WD (Brakes/ABS), instrukcja 1995 C/K</text>
</g>
</svg>
