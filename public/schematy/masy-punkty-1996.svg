<text x="30" y="58" font-size="30" fill="#f5f5f5" font-weight="bold">Punkty masy — silnik i nadwozie (1996)</text>
<text x="30" y="90" font-size="20" fill="#f87171">Model i lata: C/K 1996 (SM 1996 C Pickup 2WD — tabele</text>
<text x="30" y="122" font-size="20" fill="#f87171">komponentów). Inne lata i nadwozia mogą mieć inne numery i</text>
<text x="30" y="154" font-size="20" fill="#f87171">miejsca.</text>
