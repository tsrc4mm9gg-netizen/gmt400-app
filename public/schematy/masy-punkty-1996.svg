<text x="46" y="724" font-size="21" fill="#f5f5f5" font-weight="bold">G101</text>
<text x="336" y="724" font-size="21" fill="#f5f5f5">blacha przy prawym przednim nadkolu</text>
<rect x="30" y="742" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="776" font-size="21" fill="#f5f5f5" font-weight="bold">G102 (benzyna)</text>
<text x="336" y="776" font-size="21" fill="#f5f5f5">prawy przód bloku, przy kole pasowym tłumika</text>
<text x="336" y="804" font-size="21" fill="#f5f5f5">drgań</text>
<rect x="30" y="822" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="856" font-size="21" fill="#f5f5f5" font-weight="bold">G105 (benzyna)</text>
<text x="336" y="856" font-size="21" fill="#f5f5f5">prawy przód bloku</text>
<rect x="30" y="874" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="908" font-size="21" fill="#f5f5f5" font-weight="bold">G102 / G105 (diesel)</text>
<text x="336" y="908" font-size="21" fill="#f5f5f5">lewy przód kolektora dolotowego / prawa góra</text>
<text x="336" y="936" font-size="21" fill="#f5f5f5">głowicy</text>
<rect x="30" y="954" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="988" font-size="21" fill="#f5f5f5" font-weight="bold">G106 (diesel)</text>
<text x="336" y="988" font-size="21" fill="#f5f5f5">masa lewego akumulatora do silnika</text>
<rect x="30" y="1006" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1040" font-size="21" fill="#f5f5f5" font-weight="bold">G112</text>
<text x="336" y="1040" font-size="21" fill="#f5f5f5">prawy przód komory silnika, pod lampką komory</text>
<rect x="30" y="1058" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1092" font-size="21" fill="#f5f5f5" font-weight="bold">Skrzynka bezp. pod</text>
<text x="46" y="1120" font-size="21" fill="#f5f5f5" font-weight="bold">maską</text>
<text x="336" y="1092" font-size="21" fill="#f5f5f5">lewy tył komory, na błotniku</text>
<rect x="30" y="1148" width="840" height="108" rx="8" fill="#2a0f10" stroke="#dc2626" stroke-width="2"/>
<text x="48" y="1184" font-size="21" fill="#fca5a5" font-weight="bold">Uwaga: dodatkowe linki masowe łączą ramę/nadwozie z silnikiem</text>
<text x="48" y="1212" font-size="21" fill="#fca5a5">i skrzynią — zawsze podłącz wszystkie (SM 1996). GM: nie</text>
<text x="48" y="1240" font-size="21" fill="#fca5a5">stosuj podkładek zębatych pod masy nadwozia/ramy.</text>
<rect x="30" y="1290" width="8" height="30" fill="#dc2626"/>
<text x="50" y="1315" font-size="24" fill="#f5f5f5" font-weight="bold">Legenda</text>
<rect x="40" y="1338" width="44" height="28" rx="5" fill="#2a0f10" stroke="#dc2626" stroke-width="2"/>
<text x="104" y="1359" font-size="19" fill="#f5f5f5">ostrzeżenie z manualu</text>
<text x="30" y="1410" font-size="18" fill="#a3a3a3">Sprawdź w swoim aucie / manualu — GMT400 ma wiele wariantów (rocznik, silnik,</text>
<text x="30" y="1436" font-size="18" fill="#a3a3a3">GVWR, RPO). Rysunek poglądowy, nie w skali.</text>
<text x="30" y="1462" font-size="18" fill="#a3a3a3">Źródło: GM Service Manual 1996 C/K (Starting and Charging, Engine Cooling),</text>
<text x="30" y="1488" font-size="18" fill="#a3a3a3">biuletyn GM o podkładkach zębatych</text>
