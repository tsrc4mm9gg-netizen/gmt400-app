<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1388" width="900" height="1388" role="img" aria-label="Punkty masy — silnik i nadwozie (1996)">
<title>Punkty masy — silnik i nadwozie (1996)</title>
<rect width="900" height="1388" fill="#0d0d0f"/>
