<circle cx="650" cy="272" r="12" fill="#dc2626" stroke="#f5f5f5" stroke-width="2"/>
<circle cx="240" cy="542" r="12" fill="#dc2626" stroke="#f5f5f5" stroke-width="2"/>
<text x="575" y="377" font-size="20" fill="#f87171">G102/G105</text>
<text x="715" y="314" font-size="20" fill="#f87171">G101</text>
<text x="715" y="279" font-size="20" fill="#f87171">G112</text>
<text x="260" y="549" font-size="20" fill="#f87171">skrzynka bezp.</text>
<rect x="30" y="624" width="8" height="30" fill="#dc2626"/>
<text x="48" y="649" font-size="24" fill="#f5f5f5" font-weight="bold">Lista (SM 1996)</text>
<rect x="30" y="666" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="700" font-size="21" fill="#f5f5f5" font-weight="bold">G101</text>
<text x="336" y="700" font-size="21" fill="#f5f5f5">blacha przy prawym przednim nadkolu</text>
<rect x="30" y="718" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="752" font-size="21" fill="#f5f5f5" font-weight="bold">G102 (benzyna)</text>
<text x="336" y="752" font-size="21" fill="#f5f5f5">prawy przód bloku, przy kole pasowym tłumika</text>
<text x="336" y="780" font-size="21" fill="#f5f5f5">drgań</text>
<rect x="30" y="798" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="832" font-size="21" fill="#f5f5f5" font-weight="bold">G105 (benzyna)</text>
<text x="336" y="832" font-size="21" fill="#f5f5f5">prawy przód bloku</text>
<rect x="30" y="850" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="884" font-size="21" fill="#f5f5f5" font-weight="bold">G102 / G105 (diesel)</text>
<text x="336" y="884" font-size="21" fill="#f5f5f5">lewy przód kolektora dolotowego / prawa góra</text>
<text x="336" y="912" font-size="21" fill="#f5f5f5">głowicy</text>
<rect x="30" y="930" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="964" font-size="21" fill="#f5f5f5" font-weight="bold">G106 (diesel)</text>
<text x="336" y="964" font-size="21" fill="#f5f5f5">masa lewego akumulatora do silnika</text>
<rect x="30" y="982" width="840" height="44" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="1016" font-size="21" fill="#f5f5f5" font-weight="bold">G112</text>
<text x="336" y="1016" font-size="21" fill="#f5f5f5">prawy przód komory silnika, pod lampką komory</text>
<rect x="30" y="1034" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46"/>
<text x="46" y="1068" font-size="21" fill="#f5f5f5" font-weight="bold">Skrzynka bezp. pod</text>
<text x="46" y="1096" font-size="21" fill="#f5f5f5" font-weight="bold">maską</text>
<text x="336" y="1068" font-size="21" fill="#f5f5f5">lewy tył komory, na błotniku</text>
<rect x="30" y="1124" width="840" height="108" rx="8" fill="#2a0f10" stroke="#dc2626" stroke-width="2"/>
<text x="48" y="1160" font-size="21" fill="#fca5a5" font-weight="bold">Uwaga: dodatkowe linki masowe łączą ramę/nadwozie z</text>
<text x="48" y="1188" font-size="21" fill="#fca5a5">silnikiem i skrzynią — zawsze podłącz wszystkie (SM 1996).</text>
<text x="48" y="1216" font-size="21" fill="#fca5a5">GM: nie stosuj podkładek zębatych pod masy nadwozia/ramy.</text>
<text x="30" y="1280" font-size="18" fill="#a3a3a3">Sprawdź w swoim aucie / manualu — GMT400 ma wiele wariantów (rocznik,</text>
<text x="30" y="1306" font-size="18" fill="#a3a3a3">silnik, GVWR, RPO). Rysunek poglądowy, nie w skali.</text>
<text x="30" y="1332" font-size="18" fill="#a3a3a3">Źródło: GM Service Manual 1996 C/K (Starting and Charging, Engine</text>
<text x="30" y="1358" font-size="18" fill="#a3a3a3">Cooling), biuletyn GM o podkładkach zębatych</text>
