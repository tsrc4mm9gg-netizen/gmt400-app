<text x="450" y="422" font-size="22" fill="#a3a3a3" text-anchor="middle">silnik</text>
<text x="230" y="282" font-size="18" fill="#a3a3a3">L (kierowca)</text>
<text x="500" y="552" font-size="18" fill="#a3a3a3">P (pasażer)</text>
<circle cx="565" cy="352" r="12" fill="#dc2626" stroke="#f5f5f5" stroke-width="2"/>
