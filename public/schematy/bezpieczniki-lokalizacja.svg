<text x="346" y="874" font-size="21" fill="#f5f5f5">boczna krawędź deski po stronie kierowcy —</text>
<text x="346" y="902" font-size="21" fill="#f5f5f5">zdejmij pokrywę (w niej szczypce do</text>
<text x="346" y="930" font-size="21" fill="#f5f5f5">bezpieczników).</text>
<rect x="30" y="948" width="840" height="100" rx="8" fill="#18181b" stroke="#dc2626" stroke-width="2"/>
<text x="46" y="982" font-size="21" fill="#f87171" font-weight="bold">1 Pod maską (bordowy,</text>
<text x="46" y="1010" font-size="21" fill="#f87171" font-weight="bold">instrukcja 1999)</text>
<text x="346" y="982" font-size="21" fill="#f5f5f5">skrzynka bezpieczników/przekaźników: tył</text>
<text x="346" y="1010" font-size="21" fill="#f5f5f5">komory silnika, przy zbiorniczku płynu</text>
<text x="346" y="1038" font-size="21" fill="#f5f5f5">hamulcowego.</text>
<rect x="30" y="1056" width="840" height="100" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1090" font-size="21" fill="#f5f5f5" font-weight="bold">1995 C/K</text>
<text x="346" y="1090" font-size="21" fill="#f5f5f5">instrukcja opisuje skrzynkę w kabinie w tym</text>
<text x="346" y="1118" font-size="21" fill="#f5f5f5">samym miejscu (krawędź deski, strona</text>
<text x="346" y="1146" font-size="21" fill="#f5f5f5">kierowcy).</text>
<rect x="30" y="1164" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1198" font-size="21" fill="#f5f5f5" font-weight="bold">Obsada</text>
<text x="346" y="1198" font-size="21" fill="#f5f5f5">Układ i obsada bezpieczników zależą od</text>
<text x="346" y="1226" font-size="21" fill="#f5f5f5">rocznika.</text>
<rect x="30" y="1270" width="8" height="30" fill="#dc2626"/>
<text x="50" y="1295" font-size="24" fill="#f5f5f5" font-weight="bold">Legenda</text>
<circle cx="62" cy="1332" r="14" fill="#dc2626"/>
<text x="62" y="1338" font-size="17" fill="#f5f5f5" font-weight="bold" text-anchor="middle">1</text>
<text x="104" y="1339" font-size="19" fill="#f5f5f5">numer odnośnika / kolejność</text>
<text x="30" y="1390" font-size="18" fill="#a3a3a3">Sprawdź w swoim aucie / manualu — GMT400 ma wiele wariantów (rocznik, silnik,</text>
<text x="30" y="1416" font-size="18" fill="#a3a3a3">GVWR, RPO). Rysunek poglądowy, nie w skali.</text>
<text x="30" y="1442" font-size="18" fill="#a3a3a3">Źródło: Instrukcje obsługi GM: 1999 Suburban („Fuses and Circuit Breakers”),</text>
