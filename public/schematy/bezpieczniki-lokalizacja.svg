<!--
Źródła:
- Instrukcja obsługi GM 1999 Chevrolet Suburban, "Fuses and Circuit Breakers": "The fuse block access door is on the driver's side edge of the instrument panel";
  "The underhood fuse/relay center is located in the rear of the engine compartment near the brake fluid reservoir."
- Instrukcja obsługi GM 1995 Chevrolet C/K 1500, s. 6-79 "Fuse Block": "The fuse block access door is on the driver's side edge of the instrument panel."
  https://assets.gm.com/manuals/chevrolet/1995_chevrolet_1500_owners.pdf
Rysunek poglądowy, nie w skali; obsadę bezpieczników brać z naklejki/instrukcji danego rocznika.
Wersja ciemna (kolory dopasowane do gmt400.pl).
Licencja: własny rysunek dla gmt400.pl (do decyzji autora, np. CC BY 4.0).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" role="img" aria-label="Gdzie są bezpieczniki (widok z góry, poglądowo)">
<title>Gdzie są bezpieczniki (widok z góry, poglądowo)</title>
<rect width="1180" height="560" fill="#0d0d0f"/>
<g font-family='DejaVu Sans, Arial, sans-serif' fill="#f5f5f5">
<text x="30" y="44" font-size="26" font-weight="bold">Gdzie są bezpieczniki (widok z góry, poglądowo)</text>
<text x="30" y="72" font-size="15" fill="#a3a3a3">Zakres: Tahoe/Suburban 1999 (instrukcja 1999); C/K 1500 1995 — kabina</text>
<rect x="140" y="110" width="480" height="380" rx="40" fill="#18181b" stroke="#f5f5f5" stroke-width="3"/>
<text x="330" y="104" font-size="14" font-weight="bold">PRZÓD</text>
<rect x="170" y="130" width="420" height="150" rx="10" fill="#1c1c1f" stroke="#8a8a8a" stroke-dasharray="6 4"/>
<text x="310" y="160" font-size="15" fill="#8a8a8a">komora silnika</text>
<rect x="190" y="230" width="110" height="40" fill="#991b1b" stroke="#f5f5f5" stroke-width="2"/>
<text x="196" y="248" font-size="12" >skrzynka</text>
<text x="196" y="263" font-size="12" >pod maską</text>
<rect x="310" y="235" width="60" height="30" fill="#3f3f46" stroke="#f5f5f5"/>
<text x="314" y="255" font-size="12" >zb. ham.</text>
<rect x="170" y="290" width="420" height="40" fill="#27272a" stroke="#f5f5f5"/>
<text x="310" y="316" font-size="15" >deska rozdzielcza</text>
<rect x="150" y="292" width="26" height="36" fill="#f87171" stroke="#f5f5f5" stroke-width="2"/>
<circle cx="260" cy="380" r="34" fill="none" stroke="#f5f5f5" stroke-width="3"/>
<text x="222" y="436" font-size="13" >kierowca (LHD)</text>
<text x="660" y="150" font-size="15" font-weight="bold">Skrzynka bezpieczników w kabinie (jasnoczerwony):</text>
<text x="660" y="175" font-size="15" font-weight="normal">boczna krawędź deski po stronie kierowcy —</text>
<text x="660" y="200" font-size="15" font-weight="normal">zdejmij pokrywę (w niej szczypce do bezpieczników).</text>
<text x="660" y="225" font-size="15" font-weight="normal"></text>
<text x="660" y="250" font-size="15" font-weight="bold">Skrzynka bezpieczników/przekaźników pod maską</text>
<text x="660" y="275" font-size="15" font-weight="normal">(bordowy, instrukcja 1999): tył komory silnika,</text>
<text x="660" y="300" font-size="15" font-weight="normal">przy zbiorniczku płynu hamulcowego.</text>
<text x="660" y="325" font-size="15" font-weight="normal"></text>
<text x="660" y="350" font-size="15" font-weight="normal">1995 C/K: instrukcja opisuje skrzynkę w kabinie</text>
<text x="660" y="375" font-size="15" font-weight="normal">w tym samym miejscu (krawędź deski, strona kierowcy).</text>
<text x="660" y="400" font-size="15" font-weight="normal">Układ i obsada bezpieczników zależą od rocznika.</text>
<rect x="20" y="506" width="1140" height="38" rx="6" fill="#2a0f10" stroke="#dc2626"/>
<text x="34" y="531" font-size="15" font-weight="bold" fill="#fca5a5">⚠ Sprawdź w swoim aucie / manualu — GMT400 ma wiele wariantów.</text>
</g></svg>