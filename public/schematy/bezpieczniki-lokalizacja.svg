<!--
Źródła:
- Instrukcja obsługi GM 1999 Chevrolet Suburban, "Fuses and Circuit Breakers": "The fuse block access door is on the driver's side edge of the instrument panel";
-   "The underhood fuse/relay center is located in the rear of the engine compartment near the brake fluid reservoir."
- Instrukcja obsługi GM 1995 Chevrolet C/K 1500, s. 6-79 "Fuse Block": "The fuse block access door is on the driver's side edge of the instrument panel."
-   https://assets.gm.com/manuals/chevrolet/1995_chevrolet_1500_owners.pdf
- Rysunek poglądowy, nie w skali; obsadę bezpieczników brać z naklejki/instrukcji danego rocznika.
- Wersja ciemna (kolory dopasowane do gmt400.pl).
Rysunek poglądowy (nie w skali). Styl v2 gmt400.pl (ciemny + czerwony). Własny rysunek gmt400.pl (bez grafik AI).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1498" width="900" height="1498" role="img" aria-label="Gdzie są bezpieczniki (widok z góry, poglądowo)">
<title>Gdzie są bezpieczniki (widok z góry, poglądowo)</title>
