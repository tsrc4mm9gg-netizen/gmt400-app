<!--
Źródła:
- Płyn: DEXRON-III (instrukcja obsługi GM 1999 Chevrolet Suburban, Part D: Recommended Fluids and Lubricants, s. 7-44).
- Interwały 50 000 mil (severe) / 100 000 mil (normal): ta sama instrukcja, s. 7-5 / 7-7.
-   https://www.chevrolet.com/ownercenter/content/dam/gmownercenter/gmna/dynamic/manuals/1999/chevrolet/suburban/1999_chevrolet_suburban_owners.pdf
- 4L60-E od 1993: Wikipedia "Chevrolet C/K (fourth generation)".
- Schemat celowo NIE podaje momentów, pojemności ani liczby śrub - te dane wziąć z FSM (rozdział Automatic Transmission 4L60-E, On-Vehicle Service) danego rocznika.
- Wersja ciemna (kolory dopasowane do gmt400.pl).
Rysunek poglądowy (nie w skali). Styl v2 gmt400.pl (ciemny + czerwony). Własny rysunek gmt400.pl (bez grafik AI).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1432" width="900" height="1432" role="img" aria-label="4L60-E: wymiana ATF i filtra — kolejność kroków">
<title>4L60-E: wymiana ATF i filtra — kolejność kroków</title>
<defs><pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="1.2" fill="#1f1f24"/></pattern></defs>
<rect width="900" height="1432" fill="#0d0d0f"/>
<rect width="900" height="1432" fill="url(#g)"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="0" y="0" width="900" height="8" fill="#dc2626"/>
<text x="870" y="40" font-size="16" fill="#a3a3a3" text-anchor="end">gmt400.pl · schemat</text>
<text x="30" y="80" font-size="30" fill="#f5f5f5" font-weight="bold">4L60-E: wymiana ATF i filtra — kolejność kroków</text>
<text x="30" y="110" font-size="20" fill="#f87171">Model i lata: 4L60-E, GMT400 1500/lekkie 2500, 1993–2000</text>
<line x1="30" y1="126" x2="870" y2="126" stroke="#3f3f46" stroke-width="2"/>
<rect x="30" y="156" width="8" height="30" fill="#dc2626"/>
<text x="50" y="181" font-size="24" fill="#f5f5f5" font-weight="bold">Kroki</text>
<rect x="60" y="200" width="780" height="108" rx="12" fill="#18181b" stroke="#f87171" stroke-width="2"/>
<circle cx="60" cy="254.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="261.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">1</text>
<text x="92" y="236" font-size="23" fill="#f5f5f5" font-weight="bold">Przygotowanie</text>
<text x="92" y="266" font-size="19" fill="#a3a3a3">Auto na podnośniku lub stabilnych podporach, skrzynia</text>
<text x="92" y="292" font-size="19" fill="#a3a3a3">ostudzona. Nowy filtr, uszczelka miski, ATF DEXRON-III.</text>
<path d="M450 312 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="344" width="780" height="108" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<circle cx="60" cy="398.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="405.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">2</text>
<text x="92" y="380" font-size="23" fill="#f5f5f5" font-weight="bold">Miska</text>
<text x="92" y="410" font-size="19" fill="#a3a3a3">Odkręcaj śruby miski, zostaw 2–3 luźno z jednej strony, żeby</text>
<text x="92" y="436" font-size="19" fill="#a3a3a3">spuścić ATF do wanny.</text>
<path d="M450 456 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="488" width="780" height="134" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<circle cx="60" cy="555.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="562.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">3</text>
<text x="92" y="524" font-size="23" fill="#f5f5f5" font-weight="bold">Filtr</text>
<text x="92" y="554" font-size="19" fill="#a3a3a3">Zdejmij miskę, wyciągnij stary filtr. Sprawdź, czy w</text>
<text x="92" y="580" font-size="19" fill="#a3a3a3">obudowie nie zostały elementy uszczelniające filtra (wg</text>
<text x="92" y="606" font-size="19" fill="#a3a3a3">FSM).</text>
<path d="M450 626 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="658" width="780" height="108" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<circle cx="60" cy="712.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="719.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">4</text>
<text x="92" y="694" font-size="23" fill="#f5f5f5" font-weight="bold">Czyszczenie</text>
<text x="92" y="724" font-size="19" fill="#a3a3a3">Oczyść miskę i magnes; obejrzyj osad (opiłki / okładziny —</text>
<text x="92" y="750" font-size="19" fill="#a3a3a3">opisz i zachowaj zdjęcie).</text>
<path d="M450 770 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="802" width="780" height="108" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<circle cx="60" cy="856.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="863.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">5</text>
<text x="92" y="838" font-size="23" fill="#f5f5f5" font-weight="bold">Montaż</text>
<text x="92" y="868" font-size="19" fill="#a3a3a3">Nowy uszczelniacz i filtr, czysta miska z nową uszczelką.</text>
<text x="92" y="894" font-size="19" fill="#a3a3a3">Momenty śrub — wg FSM Twojego rocznika.</text>
<path d="M450 914 v26 m-12 -12 l12 14 l12 -14" stroke="#dc2626" stroke-width="4" fill="none"/>
<rect x="60" y="946" width="780" height="108" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<circle cx="60" cy="1000.0" r="17" fill="#dc2626" stroke="#0d0d0f" stroke-width="3"/>
<text x="60" y="1007.0" font-size="19" fill="#f5f5f5" font-weight="bold" text-anchor="middle">6</text>
<text x="92" y="982" font-size="23" fill="#f5f5f5" font-weight="bold">Napełnianie</text>
<text x="92" y="1012" font-size="19" fill="#a3a3a3">Uzupełnij ATF przez rurkę bagnetu. Poziom sprawdź wg</text>
<text x="92" y="1038" font-size="19" fill="#a3a3a3">procedury z instrukcji obsługi (temperatura, bieg).</text>
<rect x="30" y="1062" width="840" height="72" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<text x="46" y="1096" font-size="21" fill="#f5f5f5" font-weight="bold">Interwał (instrukcja</text>
<text x="46" y="1124" font-size="21" fill="#f5f5f5" font-weight="bold">1999)</text>
<text x="296" y="1096" font-size="21" fill="#f5f5f5">co 50 000 mil przy ciężkich warunkach, co 100</text>
<text x="296" y="1124" font-size="21" fill="#f5f5f5">000 mil przy normalnych.</text>
<rect x="30" y="1168" width="8" height="30" fill="#dc2626"/>
<text x="50" y="1193" font-size="24" fill="#f5f5f5" font-weight="bold">Legenda</text>
<path d="M40 1230 h40 m-12 -10 l12 10 l-12 10" stroke="#dc2626" stroke-width="4" fill="none"/>
<text x="104" y="1237" font-size="19" fill="#f5f5f5">kierunek przepływu / sygnału</text>
<circle cx="62" cy="1266" r="14" fill="#dc2626"/>
<text x="62" y="1272" font-size="17" fill="#f5f5f5" font-weight="bold" text-anchor="middle">1</text>
<text x="104" y="1273" font-size="19" fill="#f5f5f5">numer odnośnika / kolejność</text>
<text x="30" y="1324" font-size="18" fill="#a3a3a3">Sprawdź w swoim aucie / manualu — GMT400 ma wiele wariantów (rocznik, silnik,</text>
<text x="30" y="1350" font-size="18" fill="#a3a3a3">GVWR, RPO). Rysunek poglądowy, nie w skali.</text>
<text x="30" y="1376" font-size="18" fill="#a3a3a3">Źródło: Instrukcja obsługi GM 1999 Suburban (płyny, interwały); Wikipedia</text>
<text x="30" y="1402" font-size="18" fill="#a3a3a3">„Chevrolet C/K (fourth generation)”</text>
</g>
</svg>
