<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Schowek i przykładowe kody RPO</title><desc id="desc">Schemat poglądowy schowka pasażera i przykładowej naklejki. GT4 oznacza przełożenie 3,73.</desc><rect width="900" height="560" fill="#111827"/><g font-family="sans-serif" fill="#f9fafb"><text x="35" y="48" font-size="28">RPO — gdzie szukać i co odczytać</text><text x="35" y="82" font-size="18">Schemat poglądowy, nie zdjęcie konkretnego auta</text><rect x="45" y="130" width="350" height="145" rx="20" fill="#374151" stroke="#9ca3af"/><path d="M65 285 L375 285 L350 405 L90 405 Z" fill="#1f2937" stroke="#d1d5db" stroke-width="3"/><rect x="125" y="310" width="180" height="55" fill="#fbbf24"/><text x="145" y="344" font-size="21" fill="#111827">NAKLEJKA RPO</text><text x="65" y="450" font-size="20">Schowek po stronie pasażera</text><path d="M315 330 L460 240" stroke="#fbbf24" stroke-width="4"/><rect x="470" y="145" width="385" height="260" rx="10" fill="#f9fafb"/><g fill="#111827"><text x="490" y="185" font-size="20">SERVICE PARTS IDENTIFICATION</text><text x="490" y="225" font-size="17">PRZYKŁAD — NIE DANE TWOJEGO AUTA</text><rect x="490" y="250" width="100" height="50" fill="#fbbf24"/><text x="510" y="285" font-size="30">GT4</text><text x="610" y="285" font-size="25">przełożenie 3,73</text><text x="490" y="340" font-size="22">GU6: 3,42 · GT5: 4,10</text><text x="490" y="380" font-size="18">Odczytaj kody z własnej naklejki.</text></g><text x="35" y="500" font-size="19">Naklejka opisuje konfigurację fabryczną, nie późniejsze przeróbki.</text><text x="35" y="535" font-size="17">Źródło kodów: West Coast Differentials · opracowanie graficzne GMT400</text></g></svg>
