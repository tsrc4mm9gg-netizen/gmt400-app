# Editorial sources only; input URLs are collected by the workflow.
timeout = 20
max_retries = 2
retry_wait_time = 3
max_concurrency = 2
max_redirects = 5
method = "get"
scheme = ["https", "http"]
accept = ["200..=299"]
insecure = false
exclude_all_private = true
include_mail = false
no_progress = true
