<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Własna ikona GMT400 (wektor, bez grafik AI): grafitowe tło, chromowana ramka, „400” i listwa jak w atrapie GMT400. -->
  <defs>
