name: Request fresh production browser verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/request-production-verification.yml']
permissions:
  contents: read
  actions: write
jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Allow initial deployment time
        run: sleep 90
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'production-tools-browser.yml',
              ref: 'main'
            });
            core.notice('Requested existing production browser workflow. This is not a test result; read its report after completion.');
