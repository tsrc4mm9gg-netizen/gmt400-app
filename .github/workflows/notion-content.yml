name: Verify complete instruction rendering
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'package.json', 'package-lock.json', 'next.config.ts', '.github/workflows/notion-content.yml']
permissions: {contents: read}
concurrency: {group: complete-instruction-verification, cancel-in-progress: false}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: install
        run: npm ci
      - id: build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/notion-content-build.log
      - id: tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - id: server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/content-app.log 2>&1 &
          for gmt_loop_attempt in $(seq 1 60); do
            printf 'Attempt %s\n' "$gmt_loop_attempt"
            if curl -fsS http://127.0.0.1:3100 > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - id: tests
        continue-on-error: true
        run: npx playwright test tests/vehicle-filters.spec.cjs tests/knowledge-categories.spec.cjs tests/navigation.spec.cjs tests/navigation-polish.spec.cjs tests/diy-restoration.spec.cjs tests/notion-pagination.spec.cjs tests/notion-content.spec.cjs --workers=1 --reporter=json > /tmp/notion-content-tests.json
      - name: Generate verification report without repository writes
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TOOLING: ${{ steps.tooling.outcome }}
          SERVER: ${{ steps.server.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');let raw={},parseError='';try{raw=JSON.parse(fs.readFileSync('/tmp/notion-content-tests.json','utf8'));}catch(e){parseError=e.message;}
          const stages=Object.fromEntries(['INSTALL','BUILD','TOOLING','SERVER','TESTS'].map(k=>[k,process.env[k]])),stats=raw.stats||{},tests=[];
          function walk(suites){for(const s of suites||[]){for(const spec of s.specs||[])for(const t of spec.tests||[])tests.push({title:spec.title,status:t.status,errors:(t.results||[]).flatMap(r=>r.errors||[r.error].filter(Boolean))});walk(s.suites);}}walk(raw.suites);
          const passed=!parseError&&Object.values(stages).every(v=>v==='success')&&tests.length===17&&stats.expected===17&&stats.unexpected===0&&stats.skipped===0&&stats.flaky===0&&!(raw.errors||[]).length&&tests.every(t=>t.status==='expected');
          const report={codeSha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,checkedAt:new Date().toISOString(),scope:'Local production build and Chromium with mocked Notion data; not live content, Safari or physical iPhone verification.',passed,stages,stats,parseError,runnerErrors:raw.errors||[],failures:tests.filter(t=>t.status!=='expected')};
          fs.mkdirSync('.diagnostics',{recursive:true});fs.writeFileSync('.diagnostics/notion-content-report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Instruction regression: '+(passed?'PASS':'FAIL')+'\nCommit: '+report.codeSha+'\nReport stored in Actions artifacts, not committed.\n');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instruction-verification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            .diagnostics/notion-content-report.json
            test-results
            /tmp/notion-content-build.log
            /tmp/notion-content-tests.json
            /tmp/content-app.log
          if-no-files-found: warn
      - name: Require complete verification
        if: always()
        run: node -e "if(!require('./.diagnostics/notion-content-report.json').passed)process.exit(1)"
