name: Review roadmap evidence without automatic progression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/roadmap-orchestrator.yml']
permissions:
  contents: read
concurrency:
  group: roadmap-evidence-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Review stored evidence without running integration scripts
        shell: python
        run: |
          import json, os, pathlib, re
          head = os.environ['GITHUB_SHA']
          report_path = pathlib.Path('.diagnostics/navigation-context-report.json')
          review = {'reviewedCommit': head, 'reviewRunId': os.environ['GITHUB_RUN_ID'], 'source': str(report_path), 'sourceType': 'report stored in checked-out commit, not a freshly downloaded Actions artifact', 'status': 'requires-review', 'roadmapUpdated': False, 'issuesCreated': False}
          lines = ['## Przegląd dowodów roadmapy', '', 'Badany commit: `' + head + '`', '', 'Ten workflow nie uruchamia testów, nie zamyka paczek, nie zmienia roadmapy i nie tworzy zgłoszeń.', 'Czytamy raport zapisany w repozytorium, a nie nowy artefakt przebiegu CI.', '']
          if not report_path.is_file():
              review['reason'] = 'missing-report'
              lines.append('Brak zapisanego raportu. Nie potwierdzamy zaliczenia żadnej paczki.')
          else:
              try:
                  report = json.loads(report_path.read_text(encoding='utf-8'))
                  if not isinstance(report, dict):
                      raise ValueError('Report must be an object')
                  sha = report.get('codeSha')
                  valid_sha = isinstance(sha, str) and re.fullmatch(r'[0-9a-f]{40}', sha) is not None
                  exact = bool(valid_sha and sha == head)
                  review.update({'reportedCommit': sha if valid_sha else None, 'exactCommitMatch': exact, 'reportedPassed': report.get('passed') is True, 'reportedIntegrationApplied': report.get('integrationApplied') is True})
                  review['reason'] = 'stored-report-needs-independent-verification' if exact else 'report-does-not-cover-reviewed-commit'
                  lines.extend(['Commit raportu: `' + (sha if valid_sha else 'brak poprawnego SHA') + '`', 'Dokładna zgodność commitów: ' + ('TAK' if exact else 'NIE'), 'Raport deklaruje passed=true: ' + ('TAK' if report.get('passed') is True else 'NIE'), ''])
                  if not exact:
                      lines.append('Raport nie dotyczy dokładnie badanego commitu. Nie traktujemy zielonego wyniku przodka jako wyniku tego kodu.')
                  else:
                      lines.append('SHA jest zgodne, ale sam zapisany JSON nie dowodzi wykonania testów. Przed zamknięciem paczki należy sprawdzić odpowiadający przebieg Actions i jego artefakty.')
              except (OSError, ValueError, TypeError) as error:
                  review['reason'] = 'unreadable-report'
                  review['diagnostic'] = str(error)
                  lines.append('Raport jest nieczytelny lub ma niepoprawny format. Nie potwierdzamy zaliczenia.')
          lines.extend(['', 'Wynik tego zadania oznacza wykonanie przeglądu, nie zaliczenie testów ani zakończenie paczek.', 'Decyzja o zamknięciu paczki pozostaje do osobnego zatwierdzenia. Pozostałe workflowy nie są zmieniane tą konfiguracją.'])
          out = pathlib.Path('reports/roadmap-review')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'review.json').write_text(json.dumps(review, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (out / 'review.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(lines) + '\n')
          print('::warning::Evidence review only. No roadmap package was automatically completed.')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roadmap-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/roadmap-review/
          retention-days: 7
          if-no-files-found: error
