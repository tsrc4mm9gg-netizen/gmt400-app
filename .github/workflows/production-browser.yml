name: Diagnose live production instruction
on:
  push:
    branches: [main]
    paths: ['playwright.production.config.cjs', 'tests/production-entry-live.spec.cjs', '.github/workflows/production-browser.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: production-browser-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - id: install
        run: npm ci
      - id: tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps webkit
      - id: tests
        continue-on-error: true
        run: npx playwright test --config=playwright.production.config.cjs --reporter=json > /tmp/production-browser-tests.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-production-instruction-diagnostics
          path: test-results
          if-no-files-found: ignore
      - name: Publish real-browser report
        if: always()
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          TOOLING_RESULT: ${{ steps.tooling.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          let raw = {};
          try { raw = JSON.parse(fs.readFileSync('/tmp/production-browser-tests.json','utf8')); } catch {}
          const stats = raw.stats || {};
          const stages = { install: process.env.INSTALL_RESULT, tooling: process.env.TOOLING_RESULT, tests: process.env.TEST_RESULT };
          const tests = [];
          function walk(suites) { for (const suite of suites || []) { for (const spec of suite.specs || []) for (const test of spec.tests || []) tests.push({ title: spec.title, status: test.status, attempts: (test.results || []).map(result => ({ status: result.status, error: String(result.error?.message || '').slice(0, 4000), diagnostics: (result.attachments || []).filter(item => item.name === 'production-entry-diagnostics').map(item => { try { return JSON.parse(item.body ? Buffer.from(item.body,'base64').toString('utf8') : fs.readFileSync(item.path,'utf8')); } catch { return { unavailable: true }; } }) })) }); walk(suite.suites); } }
          walk(raw.suites);
          const passed = Object.values(stages).every(value => value === 'success') && stats.expected === 1 && stats.unexpected === 0 && stats.skipped === 0 && stats.flaky === 0;
          fs.mkdirSync('.diagnostics',{ recursive:true });
          fs.writeFileSync('.diagnostics/production-browser-report.json',JSON.stringify({ auditorCodeSha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,checkedAt:new Date().toISOString(),origin:'https://www.gmt400.pl',scope:'Actual public API and one actual production instruction in Linux mobile WebKit, no route mocks; not all instructions or a physical iPhone',passed,stages,stats,tests },null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diagnostics/production-browser-report.json
          git commit -m 'ci: publish live instruction browser diagnostics [skip ci]'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - if: always()
        run: node -e "if(!require('./.diagnostics/production-browser-report.json').passed) process.exit(1)"
