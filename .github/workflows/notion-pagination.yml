name: Verify complete Notion pagination
on:
  push:
    branches: [main]
    paths: ['src/app/api/notion/route.ts', 'tests/notion-pagination.spec.cjs', '.github/workflows/notion-pagination.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false @playwright/test
      - run: npx playwright test tests/notion-pagination.spec.cjs --workers=1 --reporter=line
