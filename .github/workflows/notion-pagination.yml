name: Verify complete Notion pagination
on:
  push:
    branches: [main]
    paths: ['src/app/api/notion/route.ts', 'tests/notion-pagination.spec.cjs', '.github/workflows/notion-pagination.yml']
permissions:
  contents: write
concurrency:
  group: notion-pagination-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - id: install
        run: npm ci
      - id: build
        run: npm run build
      - id: tooling
        run: npm install --no-save --package-lock=false @playwright/test
      - id: tests
        continue-on-error: true
        run: npx playwright test tests/notion-pagination.spec.cjs --workers=1 --reporter=json > /tmp/notion-pagination-tests.json
      - name: Publish verification report
        if: always()
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          TOOLING_RESULT: ${{ steps.tooling.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          let raw = {};
          try { raw = JSON.parse(fs.readFileSync('/tmp/notion-pagination-tests.json', 'utf8')); } catch {}
          const stats = raw.stats || {};
          const stages = { install: process.env.INSTALL_RESULT, build: process.env.BUILD_RESULT, tooling: process.env.TOOLING_RESULT, tests: process.env.TEST_RESULT };
          const passed = Object.values(stages).every(value => value === 'success') && stats.expected === 2 && stats.unexpected === 0 && stats.skipped === 0 && stats.flaky === 0;
          const tests = [];
          function walk(suites) { for (const suite of suites || []) { for (const spec of suite.specs || []) for (const test of spec.tests || []) tests.push({ title: spec.title, status: test.status, attempts: (test.results || []).map(result => ({ status: result.status, error: String(result.error?.message || '').slice(0, 3000) })) }); walk(suite.suites); } }
          walk(raw.suites);
          const source = fs.readFileSync('src/app/api/notion/route.ts');
          const apiBlobSha = crypto.createHash('sha1').update(Buffer.from('blob ' + source.length + '\0')).update(source).digest('hex');
          fs.mkdirSync('.diagnostics', { recursive: true });
          fs.writeFileSync('.diagnostics/notion-pagination-report.json', JSON.stringify({ codeSha: process.env.GITHUB_SHA, apiBlobSha, runId: process.env.GITHUB_RUN_ID, checkedAt: new Date().toISOString(), scope: 'Direct GET handler tests with mocked Notion responses; 501 entries, complete titles, repeated-cursor rejection; not live Notion or browser tests', passed, stages, stats, tests }, null, 2) + '\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diagnostics/notion-pagination-report.json
          git commit -m 'ci: publish Notion pagination test result [skip ci]'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - name: Require both tests to pass
        if: always()
        run: node -e "if (!require('./.diagnostics/notion-pagination-report.json').passed) process.exit(1)"
