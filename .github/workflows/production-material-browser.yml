name: Verify real production article contents and images
on:
  push:
    branches: [main]
    paths: ['playwright.live-material.config.cjs','tests/production-material-live.spec.cjs','.github/workflows/production-material-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-material-browser
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: install
        run: npm ci
      - id: tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium webkit
      - id: before
        run: |
          node <<'NODE'
          const fs=require('node:fs');fetch('https://www.gmt400.pl/api/status',{cache:'no-store',signal:AbortSignal.timeout(20000)}).then(async response=>{if(!response.ok)throw new Error('Production status unavailable');const sha=(await response.json()).deployment?.commitSha;if(!/^[a-f0-9]{40}$/i.test(sha||''))throw new Error('Production SHA unavailable');fs.writeFileSync('/tmp/material-before.json',JSON.stringify({sha}));}).catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE
      - id: tests
        continue-on-error: true
        run: npx playwright test --config=playwright.live-material.config.cjs --reporter=json > /tmp/live-material-tests.json 2>/tmp/live-material-errors.log
      - name: Generate live material report
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          TOOLING: ${{ steps.tooling.outcome }}
          BEFORE: ${{ steps.before.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');async function main(){let raw={},before={},parseError='',afterSha=null,statusError='';try{raw=JSON.parse(fs.readFileSync('/tmp/live-material-tests.json','utf8'));}catch(error){parseError=error.message;}try{before=JSON.parse(fs.readFileSync('/tmp/material-before.json','utf8'));}catch{}
          try{const response=await fetch('https://www.gmt400.pl/api/status',{cache:'no-store',signal:AbortSignal.timeout(20000)});if(!response.ok)throw new Error('Production status unavailable');afterSha=(await response.json()).deployment?.commitSha||null;}catch(error){statusError=error.message;}
          const tests=[];function walk(suites){for(const suite of suites||[]){for(const spec of suite.specs||[])for(const test of spec.tests||[])tests.push({title:spec.title,project:test.projectName,status:test.status,attempts:(test.results||[]).map(result=>({status:result.status,error:String(result.error?.message||'').slice(0,6000),diagnostics:(result.attachments||[]).filter(item=>item.name==='live-material-diagnostics').map(item=>{try{return JSON.parse(item.body?Buffer.from(item.body,'base64').toString('utf8'):fs.readFileSync(item.path,'utf8'));}catch{return {unavailable:true};}})}))});walk(suite.suites);}}walk(raw.suites);
          const stages=Object.fromEntries(['INSTALL','TOOLING','BEFORE','TESTS'].map(key=>[key,process.env[key]]));const stableDeployment=/^[a-f0-9]{40}$/i.test(before.sha||'')&&before.sha===afterSha;
          const passed=Object.values(stages).every(value=>value==='success')&&!parseError&&!statusError&&stableDeployment&&tests.length===6&&['chromium','webkit'].every(project=>tests.filter(test=>test.project===project).length===3)&&raw.stats?.expected===6&&raw.stats?.unexpected===0&&raw.stats?.skipped===0&&raw.stats?.flaky===0&&!(raw.errors||[]).length&&tests.every(test=>test.status==='expected');
          fs.mkdirSync('.diagnostics',{recursive:true});fs.writeFileSync('.diagnostics/production-material-browser-report.json',JSON.stringify({auditorCodeSha:process.env.GITHUB_SHA,observedDeploymentSha:before.sha||null,deploymentShaAfter:afterSha,stableDeployment,runId:process.env.GITHUB_RUN_ID,checkedAt:new Date().toISOString(),origin:'https://www.gmt400.pl',passed,scope:'Actual known public instruction, its contents navigation and bounded discovery of one real Notion image in up to five public instructions per browser. Chromium and Linux mobile WebKit, no mocks, no Notion writes or VIN submission. Missing eligible sample is unverified, not a pass. Not physical iPhone or all-material certification.',stages,parseError,statusError,stats:raw.stats||{},runnerErrors:raw.errors||[],tests},null,2)+'\n');fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### Real production materials\nResult: '+(passed?'PASS':'NOT FULLY VERIFIED')+'\nObserved SHA: '+before.sha+'\nStable deployment: '+stableDeployment+'\nTests discovered: '+tests.length+'\n');}
          main().catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: real-production-material-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .diagnostics/production-material-browser-report.json
            /tmp/live-material-tests.json
            /tmp/live-material-errors.log
            test-results
      - name: Require all production material checks
        if: always()
        run: node -e "if(!require('./.diagnostics/production-material-browser-report.json').passed)process.exit(1)"
