name: Update dependency lockfile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-lockfile.yml'

permissions:
  contents: write

concurrency:
  group: update-lockfile
  cancel-in-progress: false

jobs:
  update:
    name: Synchronize package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and update lockfile
        run: npm install --no-audit --no-fund

      - name: Verify lockfile consistency
        run: npm ci --ignore-scripts

      - name: Commit updated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): synchronize package-lock.json with vitest"
          git push origin HEAD:main
