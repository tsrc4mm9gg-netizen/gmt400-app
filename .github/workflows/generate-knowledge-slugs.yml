name: Generate knowledge slug registry

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-knowledge-slugs
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/baza-slug-urls
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate slug registry
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node scripts/generate-knowledge-slugs.mjs

      - name: Commit registry changes
        id: commit
        run: |
          if git diff --quiet -- data/knowledge-slugs.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No registry changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/knowledge-slugs.json
          git commit -m "chore(seo): update knowledge slug registry"
          git push origin HEAD:seo/baza-slug-urls
          echo "changed=true" >> "$GITHUB_OUTPUT"
