name: Verify Sentry integration
on:
  push:
    branches: [feat/sentry-nextjs-integration]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SENTRY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test Sentry configuration and isolated SDK transport
        run: node --test tests/sentry-monitoring.test.cjs
      - name: Check frontend quality
        run: node scripts/check-frontend-quality.cjs
      - name: Build instrumented application without sending telemetry
        run: npm run build
