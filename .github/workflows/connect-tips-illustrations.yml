name: Connect Tips illustrations
on:
  push:
    branches: [main]
    paths: ['.github/workflows/connect-tips-illustrations.yml']
permissions:
  contents: write
concurrency:
  group: connect-tips-illustrations
  cancel-in-progress: false
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 scripts/connect-tips-illustrations.py
      - run: npm ci
      - run: npm run build
      - name: Commit checked Tips integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/page.tsx
          git commit -m 'feat(tips): connect diagrams and clarify axle ratio test'
          git push origin HEAD:main
