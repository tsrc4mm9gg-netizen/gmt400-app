name: Audit production dependency exposure
on:
  push:
    branches: [feat/sentry-nextjs-integration]
    paths: ['package.json', 'package-lock.json', '.github/workflows/sentry-production-audit.yml']
  pull_request:
    branches: [main]
    paths: ['package.json', 'package-lock.json', '.github/workflows/sentry-production-audit.yml']
permissions:
  contents: read
jobs:
  production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Explain installed braces dependency chain
        run: npm explain braces
      - name: Audit production dependencies without fixes
        run: |
          status=0
          npm audit --omit=dev --json > npm-production-audit.json || status=$?
          cat npm-production-audit.json
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          node -e 'const r=require("./npm-production-audit.json");if(r.error||!r.metadata||!r.vulnerabilities)throw new Error("Invalid production audit report");const v=r.metadata.vulnerabilities;if(v.high>0||v.critical>0)process.exit(1);'
      - name: Store production audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-audit-${{ github.run_id }}
          path: npm-production-audit.json
          retention-days: 7
          if-no-files-found: error
