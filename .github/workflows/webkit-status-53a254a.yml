name: WebKit status for 53a254a
on:
  push:
    branches: [main]
    paths: ['.github/workflows/webkit-status-53a254a.yml']
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: webkit-status-53a254a
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = '53a254a0f99b79043b905098bdd12f2c8f8e7c96';
            let run = null;
            for (let attempt = 0; attempt < 20; attempt++) {
              const response = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'mobile-webkit.yml', head_sha: sha, per_page: 100 });
              run = response.data.workflow_runs.filter(item => item.head_sha === sha).sort((a, b) => b.id - a.id)[0] || null;
              if (run?.status === 'completed') break;
              if (attempt < 19) await new Promise(resolve => setTimeout(resolve, 15000));
            }
            const report = {
              checkedAt: new Date().toISOString(),
              commit: sha,
              found: Boolean(run),
              runId: run?.id || null,
              runAttempt: run?.run_attempt || null,
              status: run?.status || 'not_found',
              conclusion: run?.conclusion || null,
              url: run?.html_url || null,
              jobs: []
            };
            if (run) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { owner, repo, run_id: run.id, filter: 'latest', per_page: 100 });
              report.jobs = jobs.map(job => ({ name: job.name, status: job.status, conclusion: job.conclusion, url: job.html_url, steps: (job.steps || []).map(step => ({ name: step.name, status: step.status, conclusion: step.conclusion })) }));
            }
            const title = 'WebKit status for commit 53a254a';
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', creator: 'github-actions[bot]', per_page: 100 });
            if (issues.some(issue => !issue.pull_request && issue.title === title)) {
              core.notice('Status issue already exists; no duplicate created.');
              return;
            }
            const body = 'Read-only status snapshot; no tests were rerun. A missing or unfinished run is not a PASS.\n\n```json\n' + JSON.stringify(report, null, 2) + '\n```';
            const issue = await github.rest.issues.create({ owner, repo, title, body });
            core.notice(issue.data.html_url);
