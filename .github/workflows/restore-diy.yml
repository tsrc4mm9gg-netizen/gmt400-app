name: Verify current DIY and vehicle filtering
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'package.json', 'package-lock.json', '.github/workflows/restore-diy.yml', 'scripts/report-current-verification.cjs']
permissions:
  contents: read
concurrency:
  group: restore-diy
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: mkdir -p reports/diy
      - id: install
        run: npm ci
      - id: build
        run: npm run build
      - id: tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - id: server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > reports/diy/server.log 2>&1 &
          deadline=$((SECONDS + 60))
          until curl -fsS http://127.0.0.1:3100 >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then cat reports/diy/server.log; exit 1; fi
            sleep 1
          done
          printf '%s\n' "module.exports = { testDir: './tests', testMatch: ['vehicle-filters.spec.cjs', 'knowledge-categories.spec.cjs', 'navigation.spec.cjs', 'navigation-polish.spec.cjs', 'diy-restoration.spec.cjs'], workers: 1, retries: 0, timeout: 45000, expect: { timeout: 10000 }, projects: [{ name: 'chromium', use: { browserName: 'chromium', viewport: { width: 390, height: 844 } } }] };" > .diy-verification.config.cjs
      - id: tests
        continue-on-error: true
        run: npx playwright test --config=.diy-verification.config.cjs --reporter=json > reports/diy/tests.json 2> reports/diy/errors.log
      - name: Require complete current-page verification
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/report-current-verification.cjs diy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-diy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/diy/
            test-results/
          retention-days: 7
          if-no-files-found: warn
