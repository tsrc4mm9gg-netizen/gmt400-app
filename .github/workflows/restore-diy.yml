name: Restore DIY and verify vehicle filtering
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-diy.yml', 'scripts/restore-diy.cjs']
permissions:
  contents: write
concurrency:
  group: restore-diy
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: patch
        run: node scripts/restore-diy.cjs
      - run: npm ci
      - id: build
        run: npm run build
      - run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/diy-app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100 > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - id: browser
        continue-on-error: true
        run: npx playwright test tests/vehicle-filters.spec.cjs tests/global-search.spec.cjs tests/knowledge-categories.spec.cjs tests/navigation.spec.cjs tests/navigation-polish.spec.cjs tests/diy-restoration.spec.cjs --workers=1 --reporter=json > /tmp/diy-tests.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diy-restoration-artifacts
          path: test-results
          if-no-files-found: ignore
      - name: Report and publish patched page only on success
        if: always()
        env:
          PATCH_RESULT: ${{ steps.patch.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          let raw = {};
          try { raw = JSON.parse(fs.readFileSync('/tmp/diy-tests.json', 'utf8')); } catch {}
          const stats = raw.stats || {};
          const passed = process.env.PATCH_RESULT === 'success' && process.env.BUILD_RESULT === 'success' && process.env.BROWSER_RESULT === 'success' && stats.expected === 23 && stats.unexpected === 0 && stats.skipped === 0 && stats.flaky === 0;
          const failures = [];
          function walk(suites) { for (const suite of suites || []) { for (const spec of suite.specs || []) for (const test of spec.tests || []) if (test.status !== 'expected') failures.push({ title: spec.title, status: test.status, errors: (test.results || []).map(result => String(result.error?.message || '').slice(0, 2000)) }); walk(suite.suites); } }
          walk(raw.suites);
          fs.mkdirSync('.diagnostics', { recursive: true });
          fs.writeFileSync('.diagnostics/diy-profile-report.json', JSON.stringify({ codeSha: process.env.GITHUB_SHA, checkedAt: new Date().toISOString(), scope: 'Chromium mocked fixtures, actual local DIY graphic; not complete live Notion audit or Safari verification', passed, integrationApplied: passed, patch: process.env.PATCH_RESULT, build: process.env.BUILD_RESULT, browser: process.env.BROWSER_RESULT, stats, failures }, null, 2) + '\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diagnostics/diy-profile-report.json
          if node -e "process.exit(require('./.diagnostics/diy-profile-report.json').passed ? 0 : 1)"; then
            git add src/app/page.tsx
            git commit -m 'Restore verified DIY instructions, graphics and scoped profile filtering'
          else
            git commit -m 'ci: publish failed DIY verification [skip ci]'
          fi
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - if: always()
        run: node -e "if (!require('./.diagnostics/diy-profile-report.json').passed) process.exit(1)"
