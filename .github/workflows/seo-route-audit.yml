name: SEO route audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/seo-route-audit.yml']
permissions:
  contents: read
concurrency:
  group: seo-route-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit live SEO routes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const origin = 'https://www.gmt400.pl';
          const report = { checkedAt: new Date().toISOString(), codeSha: process.env.GITHUB_SHA, scope: 'Live HTTP and HTML audit, not Google indexing or editorial verification. HTML attributes are inspected conservatively; missing values require review.', errors: [], rows: [] };
          const decode = s => s.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'");
          const attr = (tag, name) => decode(tag.match(new RegExp('\\b' + name + '\\s*=\\s*["\x27]([^"\x27]*)["\x27]', 'i'))?.[1] || '');
          const normalize = id => String(id).replace(/-/g, '').toLowerCase();
          async function get(url) {
            const u = new URL(url);
            if (u.protocol !== 'https:' || !['www.gmt400.pl', 'gmt400.pl'].includes(u.hostname)) throw new Error('Unexpected origin: ' + u.origin);
            await new Promise(resolve => setTimeout(resolve, 1500));
            return fetch(u, { redirect: 'manual', signal: AbortSignal.timeout(20000), headers: { 'User-Agent': 'GMT400-SEO-Audit/1.0', 'Cache-Control': 'no-cache' } });
          }
          async function inspect(url, kind) {
            const row = { kind, url, hops: [], finalUrl: url, status: null, canonical: '', robots: '', title: '', unavailableMarker: false, responseHeaders: {}, issues: [] };
            try {
              const seen = new Set();
              for (let i = 0; i < 8; i++) {
                if (seen.has(row.finalUrl)) throw new Error('Redirect loop');
                seen.add(row.finalUrl);
                const r = await get(row.finalUrl);
                row.status = r.status;
                const location = r.headers.get('location');
                row.hops.push({ url: row.finalUrl, status: r.status, location });
                if ([301, 302, 303, 307, 308].includes(r.status) && location) {
                  row.finalUrl = new URL(location, row.finalUrl).href;
                  await r.body?.cancel();
                  if (i === 7) throw new Error('Redirect limit');
                  continue;
                }
                row.responseHeaders = Object.fromEntries(['content-type', 'cache-control', 'age', 'x-vercel-cache', 'x-nextjs-cache', 'retry-after', 'x-robots-tag'].map(key => [key, r.headers.get(key)]));
                row.robots = r.headers.get('x-robots-tag') || '';
                const html = await r.text();
                row.title = decode(html.match(/<title\b[^>]*>([\s\S]*?)<\/title>/i)?.[1] || '');
                row.unavailableMarker = /Baza wiedzy chwilowo niedostępna|Nie udało się pobrać dodatkowej zawartości strony Notion/i.test(html);
                for (const tag of html.match(/<link\b[^>]*>/gi) || []) if (attr(tag, 'rel').toLowerCase() === 'canonical') row.canonical = attr(tag, 'href');
                for (const tag of html.match(/<meta\b[^>]*>/gi) || []) if (['robots', 'googlebot'].includes(attr(tag, 'name').toLowerCase())) row.robots += ' ' + attr(tag, 'content');
                if (r.status !== 200) row.issues.push('final_status_not_200');
                if (!row.canonical) row.issues.push('canonical_missing_or_unparsed');
                else if (new URL(row.canonical, row.finalUrl).href !== new URL(row.finalUrl).href) row.issues.push('canonical_differs_from_final');
                if (/\bnoindex\b|\bnone\b/i.test(row.robots)) row.issues.push('noindex');
                if (row.unavailableMarker) row.issues.push('notion_unavailable_marker');
                break;
              }
              if (kind === 'sitemap' && row.hops.length > 1) row.issues.push('sitemap_url_redirects');
              if (kind === 'legacy' && ![301, 308].includes(row.hops[0]?.status)) row.issues.push('legacy_not_permanent_redirect');
            } catch (e) { row.issues.push(String(e.message)); }
            report.rows.push(row);
          }
          try {
            const registry = JSON.parse(fs.readFileSync('data/knowledge-slugs.json', 'utf8'));
            const ids = registry.map(r => normalize(r.id));
            const slugs = registry.map(r => r.slug);
            report.registry = { count: registry.length, uniqueIds: new Set(ids).size, uniqueSlugs: new Set(slugs).size, invalidIds: ids.filter(id => !/^[a-f0-9]{32}$/.test(id)).length };
            if (new Set(ids).size !== ids.length || new Set(slugs).size !== slugs.length || report.registry.invalidIds) report.errors.push('registry_validation_failed');
            const robots = await get(origin + '/robots.txt');
            report.robots = { status: robots.status, text: await robots.text() };
            if (robots.status !== 200 || !report.robots.text.includes(origin + '/sitemap.xml')) report.errors.push('robots_requires_review');
            const xmlResponse = await get(origin + '/sitemap.xml');
            const xml = await xmlResponse.text();
            if (xmlResponse.status !== 200 || !/<urlset\b/i.test(xml)) throw new Error('Expected HTTP 200 sitemap urlset');
            const urls = [...xml.matchAll(/<loc>\s*([^<]+)\s*<\/loc>/g)].map(m => decode(m[1].trim()));
            report.sitemap = { status: xmlResponse.status, count: urls.length, unique: new Set(urls).size };
            if (!urls.length || new Set(urls).size !== urls.length) report.errors.push('sitemap_empty_or_duplicate');
            const queue = urls.map(url => ({ url, kind: 'sitemap' }));
            for (const path of ['problemy-z-rozrusznikiem-gmt400', '3fad7bf1c1398100b7e0cd224833baf9', '3fad7bf1-c139-8100-b7e0-cd224833baf9']) queue.push({ url: origin + '/baza/' + path, kind: 'legacy' });
            for (const item of queue) {
              await inspect(item.url, item.kind);
            }
          } catch (e) { report.errors.push(String(e.message)); }
          report.rows.sort((a, b) => a.url.localeCompare(b.url));
          report.flagged = report.rows.filter(r => r.issues.length).length;
          report.passed = !report.errors.length && !report.flagged && report.rows.length > 0;
          fs.mkdirSync('reports/seo', { recursive: true });
          fs.writeFileSync('reports/seo/audit.json', JSON.stringify(report, null, 2));
          const columns = ['kind', 'url', 'status', 'finalUrl', 'canonical', 'robots', 'title', 'unavailableMarker', 'responseHeaders', 'hops', 'issues'];
          const cell = v => '"' + String(typeof v === 'object' ? JSON.stringify(v) : v ?? '').replace(/"/g, '""') + '"';
          fs.writeFileSync('reports/seo/audit.csv', [columns.join(','), ...report.rows.map(r => columns.map(k => cell(r[k])).join(','))].join('\n'));
          console.log('SEO_AUDIT_SUMMARY ' + JSON.stringify({ checkedAt: report.checkedAt, registry: report.registry, sitemap: report.sitemap, robots: report.robots, checked: report.rows.length, flagged: report.flagged, errors: report.errors, passed: report.passed }));
          for (const row of report.rows) if (row.issues.length || row.kind === 'legacy') console.log('SEO_AUDIT_ROW ' + JSON.stringify(row));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## SEO audit\nChecked: ${report.rows.length}; flagged: ${report.flagged}; execution errors: ${report.errors.length}.\nResult: ${report.passed ? 'PASS' : 'REVIEW REQUIRED'}. See JSON/CSV artifacts and SEO_AUDIT log records. This does not establish Google indexation.\n`);
          if (!report.passed) process.exitCode = 1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/seo/
          retention-days: 30
          if-no-files-found: error
