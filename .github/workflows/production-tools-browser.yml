name: Live production tools and costs in Chromium and WebKit
on:
  push:
    branches: [main]
    paths: ['playwright.live-tools.config.cjs','tests/production-tools-live.spec.cjs','.github/workflows/production-tools-browser.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: production-tools-browser
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: install
        run: npm ci
      - id: tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium webkit
      - id: before
        name: Record actual deployed SHA before browser checks
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          fetch('https://www.gmt400.pl/api/status',{cache:'no-store',signal:AbortSignal.timeout(20000)}).then(async response=>{if(!response.ok) throw new Error('Status endpoint unavailable');const body=await response.json();const sha=body.deployment?.commitSha;if(!/^[a-f0-9]{40}$/i.test(sha || '')) throw new Error('Deployment SHA unavailable');fs.writeFileSync('/tmp/tools-browser-before.json',JSON.stringify({sha,at:new Date().toISOString()}));}).catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE
      - id: tests
        continue-on-error: true
        run: npx playwright test --config=playwright.live-tools.config.cjs --reporter=json > /tmp/live-tools-tests.json 2>/tmp/live-tools-errors.log
      - name: Generate live browser report
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          TOOLING: ${{ steps.tooling.outcome }}
          BEFORE: ${{ steps.before.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          async function main(){let raw={},before={},parseError='',afterSha=null,statusError='';try{raw=JSON.parse(fs.readFileSync('/tmp/live-tools-tests.json','utf8'));}catch(error){parseError=error.message;}try{before=JSON.parse(fs.readFileSync('/tmp/tools-browser-before.json','utf8'));}catch{}
          try{const response=await fetch('https://www.gmt400.pl/api/status',{cache:'no-store',signal:AbortSignal.timeout(20000)});if(!response.ok)throw new Error('Status endpoint unavailable');afterSha=(await response.json()).deployment?.commitSha || null;}catch(error){statusError=error.message;}
          const tests=[];function walk(suites){for(const suite of suites || []){for(const spec of suite.specs || [])for(const test of spec.tests || [])tests.push({title:spec.title,project:test.projectName,status:test.status,attempts:(test.results || []).map(result=>({status:result.status,error:String(result.error?.message || '').slice(0,6000)}))});walk(suite.suites);}}walk(raw.suites);
          const stages=Object.fromEntries(['INSTALL','TOOLING','BEFORE','TESTS'].map(key=>[key,process.env[key]]));const stableDeployment=/^[a-f0-9]{40}$/i.test(before.sha || '')&&before.sha===afterSha;
          const passed=Object.values(stages).every(value=>value==='success')&&!parseError&&!statusError&&stableDeployment&&tests.length===14&&raw.stats?.expected===14&&raw.stats?.unexpected===0&&raw.stats?.skipped===0&&raw.stats?.flaky===0&&!(raw.errors || []).length&&tests.every(test=>test.status==='expected')&&['chromium-mobile','webkit-mobile'].every(project=>tests.filter(test=>test.project===project).length===7);
          const report={auditorCodeSha:process.env.GITHUB_SHA,observedDeploymentSha:before.sha || null,deploymentShaAfter:afterSha,stableDeployment,runId:process.env.GITHUB_RUN_ID,checkedAt:new Date().toISOString(),origin:'https://www.gmt400.pl',passed,scope:'Real public page interactions in Chromium and Linux mobile WebKit, no route mocks. Includes live Notion-backed page loading and NBP quote. No VIN submission or saved user records. Does not certify a physical iPhone or that observed deployment equals auditor SHA.',stages,parseError,statusError,stats:raw.stats || {},runnerErrors:raw.errors || [],tests};
          fs.mkdirSync('.diagnostics',{recursive:true});fs.writeFileSync('.diagnostics/production-tools-browser-report.json',JSON.stringify(report,null,2)+'\n');fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### Live browser tools verification\nResult: '+(passed?'PASS':'FAIL')+'\nObserved deployment: '+report.observedDeploymentSha+'\nStable deployment: '+stableDeployment+'\nTests: '+tests.length+'\n');}
          main().catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-tools-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .diagnostics/production-tools-browser-report.json
            /tmp/live-tools-tests.json
            /tmp/live-tools-errors.log
            test-results
      - name: Publish browser report only
        if: always()
        run: |
          test -s .diagnostics/production-tools-browser-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diagnostics/production-tools-browser-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: publish live tools browser report [skip ci]'
          for gmt_loop_attempt in 1 2 3 4; do
            printf 'Attempt %s\n' "$gmt_loop_attempt"
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
      - name: Require all browser checks and stable observed version
        if: always()
        run: node -e "if(!require('./.diagnostics/production-tools-browser-report.json').passed)process.exit(1)"
