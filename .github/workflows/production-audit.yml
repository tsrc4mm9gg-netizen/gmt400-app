name: Audit live production content
on:
  push:
    branches: [main]
    paths: ['scripts/audit-production.cjs', '.github/workflows/production-audit.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: production-content-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: audit
        continue-on-error: true
        run: node scripts/audit-production.cjs
      - name: Publish production audit
        if: always()
        run: |
          test -s .diagnostics/production-content-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diagnostics/production-content-report.json
          git commit -m 'ci: publish production content audit [skip ci]'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - name: Require complete audit
        if: always()
        run: node -e "if (!require('./.diagnostics/production-content-report.json').passed) process.exit(1)"
