name: Verify candidate material formatting without repository writes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/app/MaterialText.tsx', 'src/app/baza/**', 'src/lib/material-text.ts', 'tests/material-text.spec.cjs', 'tests/assert-material-source.cjs', 'playwright.material-text.config.cjs', '.github/workflows/material-text.yml', 'scripts/report-current-verification.cjs']
permissions:
  contents: read
concurrency:
  group: material-text-integration
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: mkdir -p reports/material-text
      - id: install
        run: npm ci
      - id: candidate
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const path = 'src/app/baza/[id]/page.tsx';
          let text = fs.readFileSync(path, 'utf8');
          const statement = "import MaterialText from '../../MaterialText';";
          if (!text.includes(statement)) {
            const anchor = "import MaterialContents from '../../MaterialContents';";
            assert.equal(text.split(anchor).length, 2, 'Entry import anchor missing or ambiguous');
            for (const field of ['Opis', 'Objawy', 'Rozwiązanie']) {
              const old = '<p className="whitespace-pre-line text-neutral-300">{entry.' + field + '}</p>';
              assert.equal(text.split(old).length, 2, 'Field anchor missing or ambiguous: ' + field);
              text = text.replace(old, '<MaterialText text={entry.' + field + '} field="' + field + '" />');
            }
            text = text.replace(anchor, anchor + '\n' + statement);
            fs.writeFileSync(path, text);
          }
          for (const field of ['Opis', 'Objawy', 'Rozwiązanie']) assert(text.includes('<MaterialText text={entry.' + field + '} field="' + field + '" />'), 'Candidate integration missing: ' + field);
          const fixture = 'src/app/material-text-fixture/page.tsx';
          assert(!fs.existsSync(fixture), 'Refusing to overwrite fixture');
          const value = '**Przygotowanie:**<br>Tekst A<br><br>**Kroki:**<br>1. Pierwszy punkt<br>3. Trzeci punkt<br><br>**Kontrola:**<br>- Punkt A<br>- Punkt B<br><script>window.__unsafeMaterial=true</script>';
          fs.mkdirSync('src/app/material-text-fixture', { recursive: true });
          fs.writeFileSync(fixture, `import MaterialText from '../MaterialText';import MaterialContents from '../MaterialContents';export default function Fixture(){return <main style={{padding:16,maxWidth:390}}><article><h1>Test tekstu materiału</h1><MaterialContents entryId="text-fixture"/><section><h2>Rozwiązanie</h2><MaterialText text={${JSON.stringify(value)}} field="Rozwiązanie"/></section></article></main>;}`);
          NODE
      - id: build
        run: npm run build
      - id: tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium webkit
      - id: server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > reports/material-text/server.log 2>&1 &
          deadline=$((SECONDS + 60))
          until curl -fsS http://127.0.0.1:3100 >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then cat reports/material-text/server.log; exit 1; fi
            sleep 1
          done
      - id: tests
        continue-on-error: true
        run: npx playwright test --config=playwright.material-text.config.cjs --reporter=json > reports/material-text/tests.json 2> reports/material-text/errors.log
      - name: Require complete candidate verification
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/report-current-verification.cjs material-text
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-material-text-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/material-text/
            test-results/
          retention-days: 7
          if-no-files-found: warn
