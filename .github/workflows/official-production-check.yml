name: Public official API production diagnostics
on:
  push:
    branches: [main]
    paths: ['scripts/check-official-production.cjs', '.github/workflows/official-production-check.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-production-diagnostics
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe public endpoints without tokens or VIN
        id: probe
        continue-on-error: true
        run: node scripts/check-official-production.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-production-diagnostics-${{ github.sha }}
          path: .diagnostics/official-production-report.json
          if-no-files-found: warn
      - name: Publish diagnostic report only
        if: always()
        shell: bash
        run: |
          if [ ! -f .diagnostics/official-production-report.json ]; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diagnostics/official-production-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: publish official production diagnostics [skip ci]'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - name: Require successful production responses
        if: always()
        run: node -e "if (!require('./.diagnostics/official-production-report.json').passed) process.exit(1)"
