name: Public official and tools API production diagnostics
on:
  push:
    branches: [main]
    paths: ['src/**','scripts/check-official-production.cjs','scripts/check-tools-production.cjs','tests/deployment-version.test.cjs','.github/workflows/official-production-check.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: official-production-diagnostics, cancel-in-progress: true}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify deployment ancestry policy on synthetic repositories
        id: policy
        run: node --test tests/deployment-version.test.cjs
      - name: Verify live application and separately monitor catalogs
        id: tools
        continue-on-error: true
        run: node scripts/check-tools-production.cjs
      - name: Probe live NBP NHTSA and EPA without VIN or tokens
        id: official
        continue-on-error: true
        run: node scripts/check-official-production.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            .diagnostics/official-production-report.json
            .diagnostics/tools-production-report.json
          if-no-files-found: warn
      - name: Require current successful application and official API verification
        if: always()
        env:
          POLICY_RESULT: ${{ steps.policy.outcome }}
          TOOLS_RESULT: ${{ steps.tools.outcome }}
          OFFICIAL_RESULT: ${{ steps.official.outcome }}
        run: |
          node <<'NODE'
          const tools=require('./.diagnostics/tools-production-report.json');
          const official=require('./.diagnostics/official-production-report.json');
          if (['POLICY_RESULT','TOOLS_RESULT','OFFICIAL_RESULT'].some(key=>process.env[key]!=='success') || tools.applicationPassed!==true || !official.passed || tools.auditorCodeSha!==process.env.GITHUB_SHA || official.auditorCodeSha!==process.env.GITHUB_SHA) process.exit(1);
          if (tools.catalogsVerified!==true) console.warn('::warning::Application checks passed, but external catalogs remain unverified. Full audit is not PASS; inspect catalogChecks in the report.');
          require('node:fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Application and official API checks passed. External catalog status is separate. Reports stored in Actions artifacts, not committed.\n');
          NODE
