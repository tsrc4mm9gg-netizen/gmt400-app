name: Public official and tools API production diagnostics
on:
  push:
    branches: [main]
    paths: ['src/**','scripts/check-official-production.cjs','scripts/check-tools-production.cjs','.github/workflows/official-production-check.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-production-diagnostics
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify deployment and live tools without VIN or tokens
        id: tools
        continue-on-error: true
        run: node scripts/check-tools-production.cjs
      - name: Probe live NBP NHTSA and EPA without VIN or tokens
        id: official
        continue-on-error: true
        run: node scripts/check-official-production.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .diagnostics/official-production-report.json
            .diagnostics/tools-production-report.json
          if-no-files-found: warn
      - name: Publish reports
        if: always()
        run: |
          test -s .diagnostics/official-production-report.json
          test -s .diagnostics/tools-production-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diagnostics/official-production-report.json .diagnostics/tools-production-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: publish live tools and official diagnostics [skip ci]'
          for i in 1 2 3 4; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
      - name: Require successful current production checks
        if: always()
        run: |
          node <<'NODE'
          const tools = require('./.diagnostics/tools-production-report.json');
          const official = require('./.diagnostics/official-production-report.json');
          if (!tools.passed || !official.passed || tools.auditorCodeSha !== process.env.GITHUB_SHA || official.auditorCodeSha !== process.env.GITHUB_SHA) process.exit(1);
          NODE
