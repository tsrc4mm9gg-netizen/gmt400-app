name: Extract WebKit diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/extract-webkit-diagnostics.yml']
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: extract-webkit-42505091584
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download existing artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42505091584 --repo tsrc4mm9gg-netizen/gmt400-app --name mobile-webkit-42505091584-1 --dir /tmp/webkit
      - name: Prepare diagnostic parts
        shell: python
        run: |
          import pathlib, json
          paths = list(pathlib.Path('/tmp/webkit').rglob('mobile-webkit-report.json'))
          if len(paths) != 1:
              raise SystemExit('Expected exactly one report')
          report = json.loads(paths[0].read_text())
          if str(report.get('runId')) != '42505091584' or report.get('codeSha') != 'b6f5d84798b57304e984a779c742134eac5fb275':
              raise SystemExit('Unexpected report identity')
          summary = {k: report.get(k) for k in ['codeSha','runId','checkedAt','passed','stages','stats','coverage','parseError','runnerErrors']}
          summary['failedTests'] = [t for t in report.get('tests',[]) if t.get('status') != 'expected']
          ux = report.get('ux',{})
          summary['ux'] = {k: ux.get(k) for k in ['passed','stats','parseError','runnerErrors']}
          summary['ux']['nonExpectedTests'] = [t for t in ux.get('tests',[]) if t.get('status') != 'expected']
          text = json.dumps(summary, ensure_ascii=True, indent=2)
          out = pathlib.Path('/tmp/diagnostic-parts')
          out.mkdir()
          for i, start in enumerate(range(0,len(text),45000),1):
              (out / f'{i:04d}.md').write_text('Diagnostic copy of run 42505091584, not a new test execution. JSON text may continue in the next part.\n\n```text\n' + text[start:start+45000] + '\n```\n')
      - name: Publish diagnostic issues without duplicates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for file in /tmp/diagnostic-parts/*.md; do
            part="$(basename "$file" .md)"
            title="WebKit diagnostics run 42505091584 part $part"
            count="$(gh issue list --repo tsrc4mm9gg-netizen/gmt400-app --state all --search "in:title $title" --json title | jq --arg title "$title" '[.[] | select(.title == $title)] | length')"
            if [ "$count" = '0' ]; then
              gh issue create --repo tsrc4mm9gg-netizen/gmt400-app --title "$title" --body-file "$file"
            fi
          done
