name: Tools and navigation regression
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'next.config.ts', 'package.json', 'package-lock.json', '.github/workflows/tools-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tools-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/tools-build.log
      - name: Install browser tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - name: Start production server
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/tools-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tools-server.log
          exit 1
      - name: Test original navigation and new tools
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/navigation.spec.cjs tests/navigation-polish.spec.cjs tests/new-tools.spec.cjs --workers=1 --reporter=list 2>&1 | tee /tmp/tools-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tools-regression-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            /tmp/tools-build.log
            /tmp/tools-server.log
            /tmp/tools-tests.log
            test-results
          if-no-files-found: warn
      - name: Write verification summary
        if: always()
        run: |
          echo '### Tools and navigation verification' >> "$GITHUB_STEP_SUMMARY"
          echo 'Commit: ${{ github.sha }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Job status: ${{ job.status }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Local production build, mocked Notion for launcher test; not a live deployment check. Logs are attached as artifacts.' >> "$GITHUB_STEP_SUMMARY"
