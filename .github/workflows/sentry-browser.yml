name: Verify isolated Sentry browser capture
on:
  push:
    branches: [feat/sentry-nextjs-integration]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SENTRY_DSN: http://ci@127.0.0.1:4319/1
      NEXT_PUBLIC_SENTRY_ENABLED: 'true'
      VERCEL_ENV: preview
      VERCEL_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-
      - name: Install browser dependencies and engines
        timeout-minutes: 30
        run: npx playwright install --with-deps chromium webkit
      - name: Generate CI-only error fixture
        run: node scripts/test-sentry-browser.cjs prepare
      - run: npm run build
      - name: Verify browser capture and accessible error boundary
        run: node scripts/test-sentry-browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sentry-browser-${{ github.run_id }}
          path: test-results
          retention-days: 7
          if-no-files-found: warn
