name: Read-only production and CI audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/production-readonly-audit.yml']
permissions:
  contents: read
  actions: read
  deployments: read
  statuses: read
  issues: write
concurrency:
  group: production-readonly-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const repo = context.repo;
            const branch = await github.rest.repos.getBranch({ ...repo, branch: 'main' });
            const mainSha = branch.data.commit.sha;
            const cssCommit = '424de8389a420088302568bf37ebe35cac8aabfe';
            const report = { checkedAt: new Date().toISOString(), auditRunId: context.runId, mainSha, cssCommit, publicEndpoints: [], commitStatuses: null, deployments: [], workflows: {}, errors: [], scope: 'Observations only. Successful audit execution does not mean production or all tests passed. No deployment, DNS changes or authentication bypass.' };
            report.publicEndpoints = await Promise.all(['https://gmt400.pl/api/status', 'https://www.gmt400.pl/api/status'].map(async url => {
              try {
                const response = await fetch(url, { headers: { Accept: 'application/json', 'Cache-Control': 'no-cache' }, signal: AbortSignal.timeout(15000) });
                const result = { url, finalUrl: response.url, httpStatus: response.status, validServiceResponse: false, deployedSha: null, containsCssCommit: null };
                if (response.ok && (response.headers.get('content-type') || '').includes('application/json')) {
                  const data = await response.json();
                  result.validServiceResponse = data.status === 'ok' && data.service === 'GMT400 Knowledge API';
                  const sha = data.deployment?.commitSha;
                  if (result.validServiceResponse && typeof sha === 'string' && /^[a-f0-9]{40}$/i.test(sha)) result.deployedSha = sha;
                }
                return result;
              } catch (error) { return { url, error: String(error.message).slice(0, 300) }; }
            }));
            for (const endpoint of report.publicEndpoints) {
              if (!endpoint.deployedSha) continue;
              try {
                const comparison = await github.rest.repos.compareCommitsWithBasehead({ ...repo, basehead: cssCommit + '...' + endpoint.deployedSha });
                endpoint.containsCssCommit = ['identical', 'ahead'].includes(comparison.data.status);
                endpoint.matchesCapturedMain = endpoint.deployedSha === mainSha;
              } catch (error) { report.errors.push({ scope: 'commit comparison', httpStatus: error.status || null }); }
            }
            try {
              const status = await github.rest.repos.getCombinedStatusForRef({ ...repo, ref: mainSha, per_page: 100 });
              report.commitStatuses = { state: status.data.state, totalCount: status.data.total_count, entries: status.data.statuses.map(item => ({ context: item.context, state: item.state, description: item.description, targetUrl: item.target_url })) };
            } catch (error) { report.errors.push({ scope: 'commit statuses', httpStatus: error.status || null }); }
            try {
              const deployments = await github.rest.repos.listDeployments({ ...repo, per_page: 10 });
              for (const deployment of deployments.data) {
                const statuses = await github.rest.repos.listDeploymentStatuses({ ...repo, deployment_id: deployment.id, per_page: 1 });
                const status = statuses.data[0];
                report.deployments.push({ id: deployment.id, sha: deployment.sha, ref: deployment.ref, environment: deployment.environment, createdAt: deployment.created_at, state: status?.state || null, environmentUrl: status?.environment_url || null, logUrl: status?.log_url || null });
              }
            } catch (error) { report.errors.push({ scope: 'GitHub deployments', httpStatus: error.status || null }); }
            for (const workflow of ['restore-diy.yml', 'material-text.yml', 'mobile-webkit.yml', 'workflow-lint.yml']) {
              try {
                const runs = await github.rest.actions.listWorkflowRuns({ ...repo, workflow_id: workflow, branch: 'main', per_page: 3 });
                report.workflows[workflow] = runs.data.workflow_runs.map(run => ({ id: run.id, attempt: run.run_attempt, sha: run.head_sha, status: run.status, conclusion: run.conclusion, url: run.html_url, createdAt: run.created_at }));
              } catch (error) { report.errors.push({ scope: workflow, httpStatus: error.status || null }); }
            }
            fs.mkdirSync('reports/production-audit', { recursive: true });
            fs.writeFileSync('reports/production-audit/report.json', JSON.stringify(report, null, 2));
            const body = 'Read-only observations, not a blanket PASS. A null deployment SHA means the deployed version could not be verified.\n\n```json\n' + JSON.stringify(report, null, 2) + '\n```';
            const issue = await github.rest.issues.create({ ...repo, title: `Production and CI audit ${context.runId}`, body });
            await core.summary.addHeading('Read-only production audit').addRaw('Report: ' + issue.data.html_url + '\nNo deployment or DNS changes were made. Read the report; workflow success alone is not proof of healthy production.').write();
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/production-audit/
          retention-days: 7
          if-no-files-found: warn
# audit rerun
