name: Verify search query session in Chromium and WebKit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/app/GlobalSearch.tsx','src/lib/search-session.ts','tests/search-session.spec.cjs','tests/global-search.spec.cjs','.github/workflows/search-session.yml','package.json','package-lock.json']
permissions: {contents: read}
concurrency: {group: search-session-verification, cancel-in-progress: true}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci
      - name: Build production application
        run: npm run build
      - run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium webkit
      - name: Configure isolated session tests
        run: |
          node <<'NODE'
          require('node:fs').writeFileSync('playwright.search-session.generated.cjs','module.exports='+JSON.stringify({testDir:'./tests',testMatch:'search-session.spec.cjs',workers:1,retries:0,timeout:60000,expect:{timeout:15000},use:{viewport:{width:390,height:844},trace:'retain-on-failure',screenshot:'only-on-failure'},projects:[{name:'chromium',use:{browserName:'chromium'}},{name:'webkit',use:{browserName:'webkit',isMobile:true,hasTouch:true}}]})+';');
          NODE
      - name: Start local production server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/search-session-server.log 2>&1 &
          for gmt_loop_attempt in $(seq 1 60); do
            printf 'Attempt %s\n' "$gmt_loop_attempt"
            if curl -fsS http://127.0.0.1:3100 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/search-session-server.log
          exit 1
      - name: Test query persistence and failure handling
        run: npx playwright test --config=playwright.search-session.generated.cjs --reporter=json > /tmp/search-session.json 2>/tmp/search-session-errors.log
      - name: Report exact browser coverage
        if: always()
        run: |
          node <<'NODE'
          const fs=require('node:fs');let r={},parseError='';try{r=JSON.parse(fs.readFileSync('/tmp/search-session.json','utf8'));}catch(e){parseError=e.message;console.error(parseError);}
          const tests=[];function walk(suites){for(const s of suites||[]){for(const spec of s.specs||[])for(const t of spec.tests||[]){tests.push(t);console.log(spec.title+' ['+t.projectName+']: '+t.status);for(const result of t.results||[])for(const e of result.errors||[result.error].filter(Boolean))console.error(e.message||JSON.stringify(e));}walk(s.suites);}}walk(r.suites);
          for(const e of r.errors||[])console.error(e.message||JSON.stringify(e));if(fs.existsSync('/tmp/search-session-errors.log'))console.error(fs.readFileSync('/tmp/search-session-errors.log','utf8'));
          const passed=!parseError&&tests.length===10&&['chromium','webkit'].every(p=>tests.filter(t=>t.projectName===p&&t.status==='expected').length===5)&&r.stats?.expected===10&&r.stats?.unexpected===0&&r.stats?.skipped===0&&r.stats?.flaky===0&&!(r.errors||[]).length;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Search-session verification: '+(passed?'PASS':'FAIL')+'\nCommit: '+process.env.GITHUB_SHA+'\nScope: local production build, mocked Notion entries and controlled permalink document; Chromium and Linux mobile WebKit. Not live Notion, actual article rendering, physical iPhone, scroll restoration or automatic reopening.\n');if(!passed)process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-session-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            /tmp/search-session.json
            /tmp/search-session-errors.log
            /tmp/search-session-server.log
            test-results
          if-no-files-found: warn
