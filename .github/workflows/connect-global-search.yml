name: Connect global search after browser tests
on:
  push:
    branches: [main]
    paths: ['.github/workflows/connect-global-search.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: connect-global-search
  cancel-in-progress: false
jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/connect-global-search.cjs
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Start tested application
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/gmt400-search.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100 > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/gmt400-search.log
          exit 1
      - run: npx playwright test tests/vehicle-filters.spec.cjs tests/global-search.spec.cjs --workers=1 --reporter=line
      - name: Commit integration only after all six browser tests pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/page.tsx
          git commit -m 'Replace placeholder search with tested full-text knowledge search'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: global-search-test-results
          path: test-results/
          if-no-files-found: ignore
