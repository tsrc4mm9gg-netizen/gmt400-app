name: Connect global search after browser tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-global-search.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connect-global-search
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare integration source
        run: node scripts/connect-global-search.cjs

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium

      - name: Start tested application
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/gmt400-search.log 2>&1 &
          until curl -fsS http://127.0.0.1:3100 > /dev/null; do
            sleep 1
          done

      - name: Run browser regression tests
        run: npx playwright test tests/vehicle-filters.spec.cjs tests/global-search.spec.cjs --workers=1 --reporter=line

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: global-search-test-results
          path: test-results/
          if-no-files-found: ignore
