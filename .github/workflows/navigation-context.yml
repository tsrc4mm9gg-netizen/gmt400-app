name: Verify navigation history and compact profile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'playwright.webkit.config.cjs'
      - 'playwright.context-ci.config.cjs'
      - 'scripts/verify-navigation-manifest.cjs'
      - '.github/workflows/navigation-context.yml'

permissions:
  contents: read

concurrency:
  group: navigation-context-integration
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: install
        run: npm ci

      - id: units
        run: node --test tests/navigation-manifest.test.cjs tests/secret-scanner.test.cjs tests/workflow-quality.test.cjs

      - id: build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/context-build.log

      - id: tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.64.1
          npx playwright install --with-deps chromium webkit
          mkdir -p reports/context

      - id: server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/context-server.log 2>&1 &
          for gmt_loop_attempt in $(seq 1 60); do
            printf 'Attempt %s\n' "$gmt_loop_attempt"
            if curl -fsS http://127.0.0.1:3100/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/context-server.log
          exit 1

      - id: chromium_plan
        continue-on-error: true
        run: npx playwright test --config=playwright.context-ci.config.cjs --project=chromium --list --reporter=json > reports/context/chromium-plan.json

      - id: chromium
        if: ${{ !cancelled() && steps.server.outcome == 'success' && steps.chromium_plan.outcome == 'success' }}
        continue-on-error: true
        run: npx playwright test --config=playwright.context-ci.config.cjs --project=chromium --output=test-results/chromium --reporter=json > reports/context/chromium-results.json

      - id: webkit_plan
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        continue-on-error: true
        run: npx playwright test --config=playwright.context-ci.config.cjs --project=webkit --list --reporter=json > reports/context/webkit-plan.json

      - id: webkit
        if: ${{ !cancelled() && steps.server.outcome == 'success' && steps.webkit_plan.outcome == 'success' }}
        continue-on-error: true
        run: npx playwright test --config=playwright.context-ci.config.cjs --project=webkit --output=test-results/webkit --reporter=json > reports/context/webkit-results.json

      - name: Require complete successful manifest and publish report
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          UNITS: ${{ steps.units.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TOOLING: ${{ steps.tooling.outcome }}
          SERVER: ${{ steps.server.outcome }}
          CHROMIUM_PLAN: ${{ steps.chromium_plan.outcome }}
          CHROMIUM: ${{ steps.chromium.outcome }}
          WEBKIT_PLAN: ${{ steps.webkit_plan.outcome }}
          WEBKIT: ${{ steps.webkit.outcome }}
        run: node scripts/verify-navigation-manifest.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-context-diagnostics
          retention-days: 7
          include-hidden-files: true
          path: |
            .diagnostics/navigation-context-report.json
            reports/context/
            test-results/
            /tmp/context-build.log
            /tmp/context-server.log
          if-no-files-found: warn
