name: Verify committed viewport and tool accessibility
on:
  push:
    branches: [main]
    paths: ['src/**','public/**','package.json','package-lock.json','next.config.ts','playwright.accessibility.config.cjs','tests/viewport-accessibility.spec.cjs','tests/new-tools.spec.cjs','.github/workflows/viewport-accessibility.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: viewport-accessibility
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: install
        run: npm ci
      - id: build
        run: npm run build
      - id: tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium webkit
      - id: server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/viewport-server.log 2>&1 &
          for gmt_loop_attempt in $(seq 1 60); do
            printf 'Attempt %s\n' "$gmt_loop_attempt"
            if curl -fsS http://127.0.0.1:3100 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/viewport-server.log
          exit 1
      - id: tests
        continue-on-error: true
        run: npx playwright test --config=playwright.accessibility.config.cjs --reporter=json > /tmp/viewport-tests.json 2>/tmp/viewport-errors.log
      - name: Generate report for committed source without repository writes
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TOOLING: ${{ steps.tooling.outcome }}
          SERVER: ${{ steps.server.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');let raw={},parseError='';try{raw=JSON.parse(fs.readFileSync('/tmp/viewport-tests.json','utf8'));}catch(error){parseError=error.message;}
          const tests=[];function walk(suites){for(const suite of suites||[]){for(const spec of suite.specs||[])for(const test of spec.tests||[])tests.push({title:spec.title,project:test.projectName,status:test.status,errors:(test.results||[]).map(result=>String(result.error?.message||'').slice(0,5000))});walk(suite.suites);}}walk(raw.suites);
          const stages=Object.fromEntries(['INSTALL','BUILD','TOOLING','SERVER','TESTS'].map(key=>[key,process.env[key]]));
          const coverage=['chromium','webkit'].map(project=>({project,viewport:tests.filter(test=>test.project===project&&test.title.startsWith('one viewport')).length,tools:tests.filter(test=>test.project===project&&!test.title.startsWith('one viewport')).length}));
          const passed=Object.values(stages).every(value=>value==='success')&&!parseError&&!(raw.errors||[]).length&&coverage.every(item=>item.viewport===5&&item.tools>=12)&&raw.stats?.expected===tests.length&&raw.stats?.unexpected===0&&raw.stats?.skipped===0&&raw.stats?.flaky===0&&tests.every(test=>test.status==='expected');
          const report={auditorCodeSha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,checkedAt:new Date().toISOString(),passed,scope:'Committed source without candidate edits; local Chromium and Linux WebKit viewport metadata, width and existing tool contrast/function tests. Not physical pinch-zoom, full 200-percent reflow audit or production certification.',stages,coverage,parseError,stats:raw.stats||{},runnerErrors:raw.errors||[],tests};
          fs.mkdirSync('.diagnostics',{recursive:true});fs.writeFileSync('.diagnostics/viewport-accessibility-report.json',JSON.stringify(report,null,2)+'\n');
          const lines=['## Dostępność: viewport i narzędzia','','Wynik: '+(passed?'PASS':'FAIL'),'Commit: `'+report.auditorCodeSha+'`','','Testujemy zapisany kod. Workflow nie modyfikuje page.tsx, nie tworzy commitów i nie wykonuje git push.','','| Etap | Wynik |','|---|---|',...Object.entries(stages).map(([name,status])=>'| '+name+' | '+status+' |'),'','| Przeglądarka | Testy viewport | Testy narzędzi |','|---|---:|---:|',...coverage.map(item=>'| '+item.project+' | '+item.viewport+' / 5 | '+item.tools+' / min. 12 |'),'','Zakres: lokalny build, Chromium i Linux WebKit. Nie jest to certyfikat WCAG ani test fizycznego iPhone’a.'];
          const failures=tests.filter(test=>test.status!=='expected');
          if(parseError)lines.push('','Błąd odczytu raportu: '+parseError);
          if(failures.length)lines.push('','### Testy wymagające sprawdzenia',...failures.map(test=>'- '+test.project+': '+test.title+' ('+test.status+')'));
          lines.push('','Szczegóły i zrzuty w artefakcie viewport-accessibility. Przy błędzie uruchomienia testów sprawdź etap TOOLING lub SERVER oraz dołączone logi.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: viewport-accessibility-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          path: |
            .diagnostics/viewport-accessibility-report.json
            /tmp/viewport-tests.json
            /tmp/viewport-errors.log
            /tmp/viewport-server.log
            test-results
          if-no-files-found: warn
      - name: Require successful accessibility configuration checks
        if: always()
        run: node -e "if(!require('./.diagnostics/viewport-accessibility-report.json').passed)process.exit(1)"
