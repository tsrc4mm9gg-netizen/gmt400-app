name: Verify search result pagination
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/app/GlobalSearch.tsx','tests/search-results-pagination.spec.cjs','.github/workflows/search-pagination.yml','package.json','package-lock.json','playwright.config.*']
permissions: {contents: read}
concurrency: {group: search-pagination-verification, cancel-in-progress: true}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run pagination regression
        run: |
          set -o pipefail
          npx playwright test tests/search-results-pagination.spec.cjs 2>&1 | tee /tmp/search-pagination-tests.log
      - name: Verify production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/search-pagination-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-pagination-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            /tmp/search-pagination-tests.log
            /tmp/search-pagination-build.log
          if-no-files-found: warn
