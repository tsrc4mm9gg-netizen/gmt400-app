name: Verify material image preview before integration
on:
  push:
    branches: [main]
    paths: ['src/app/MaterialImage.tsx','tests/material-images.spec.cjs','playwright.material-images.config.cjs','.github/workflows/material-images.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: material-images-integration
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: install
        run: npm ci
      - id: candidate
        run: |
          node <<'NODE'
          const fs=require('node:fs');const path='src/app/baza/[id]/NotionContent.tsx';let text=fs.readFileSync(path,'utf8');const statement="import MaterialImage from '../../MaterialImage';";
          if(!text.includes(statement)){const anchor="import type { ReactNode } from 'react';";const start=text.indexOf("      case 'image': {"),end=text.indexOf("\n      case 'table':",start);if(text.split(anchor).length!==2||start<0||end<start||text.split("      case 'image': {").length!==2)throw new Error('Missing or ambiguous image-renderer anchors.');
          const replacement="      case 'image': { const src = safeUrl(data.file?.url || data.external?.url); const caption = (data.caption || []).map((part: any) => part.plain_text || part.text?.content || '').join(''); content = src ? <MaterialImage src={src} caption={caption} /> : <p>Ilustracja ma niedostępny adres.</p>; break; }";
          text=(text.slice(0,start)+replacement+text.slice(end)).replace(anchor,anchor+'\n'+statement);fs.writeFileSync(path,text);}
          if(!text.includes('<MaterialImage src={src} caption={caption} />'))throw new Error('Image preview is not integrated.');
          const fixture='src/app/material-image-fixture/page.tsx',asset='public/material-image-fixture.svg';if(fs.existsSync(fixture)||fs.existsSync(asset))throw new Error('Refusing to overwrite existing fixtures.');
          fs.mkdirSync('src/app/material-image-fixture',{recursive:true});fs.writeFileSync(asset,'<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400"><rect width="800" height="400" fill="#fafafa"/><path d="M40 200h720M400 40v320" stroke="#171d25" stroke-width="8"/></svg>');
          fs.writeFileSync(fixture,`import {NotionContent} from '../baza/[id]/NotionContent';
          export const dynamic='force-dynamic';
          export default async function Fixture({searchParams}:{searchParams:Promise<{unsafe?:string;broken?:string}>}){const p=await searchParams;const src=p.unsafe==='1'?'javascript:bad()':p.broken==='1'?'/missing-material-image-fixture.png':'/material-image-fixture.svg';const blocks=[{id:'before',type:'paragraph',paragraph:{rich_text:[{plain_text:'Przed ilustracją'}]}},{id:'image',type:'image',image:{external:{url:p.unsafe==='1'?src:'https://fixture.invalid/image.svg'},caption:[{plain_text:'Podpis próbny'}]}},{id:'after',type:'paragraph',paragraph:{rich_text:[{plain_text:'Po ilustracji'}]}}];if(p.unsafe!=='1')blocks[1].image!.external.url='http://127.0.0.1:3100'+src;return <main style={{padding:16,maxWidth:390}}><article><h1>Test ilustracji</h1><NotionContent blocks={blocks}/></article></main>;}`);
          NODE
      - id: build
        run: npm run build
      - id: tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium webkit
      - id: server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/material-images-server.log 2>&1 &
          for gmt_loop_attempt in $(seq 1 60); do
            printf 'Attempt %s\n' "$gmt_loop_attempt"
            if curl -fsS http://127.0.0.1:3100 >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - id: tests
        continue-on-error: true
        run: npx playwright test --config=playwright.material-images.config.cjs --reporter=json > /tmp/material-images-tests.json 2>/tmp/material-images-errors.log
      - name: Generate report
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          CANDIDATE: ${{ steps.candidate.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TOOLING: ${{ steps.tooling.outcome }}
          SERVER: ${{ steps.server.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');let raw={},parseError='';try{raw=JSON.parse(fs.readFileSync('/tmp/material-images-tests.json','utf8'));}catch(error){parseError=error.message;}
          const tests=[];function walk(suites){for(const suite of suites||[]){for(const spec of suite.specs||[])for(const test of spec.tests||[])tests.push({title:spec.title,file:spec.file||suite.file||'',project:test.projectName,status:test.status,errors:(test.results||[]).map(result=>String(result.error?.message||'').slice(0,6000))});walk(suite.suites);}}walk(raw.suites);
          const stages=Object.fromEntries(['INSTALL','CANDIDATE','BUILD','TOOLING','SERVER','TESTS'].map(key=>[key,process.env[key]]));const coverage=['chromium','webkit'].map(project=>({project,images:tests.filter(test=>test.project===project&&test.file.endsWith('material-images.spec.cjs')).length,renderer:tests.filter(test=>test.project===project&&test.file.endsWith('notion-content.spec.cjs')).length}));
          const passed=Object.values(stages).every(value=>value==='success')&&!parseError&&!(raw.errors||[]).length&&coverage.every(item=>item.images===5&&item.renderer===3)&&raw.stats?.expected===tests.length&&raw.stats?.unexpected===0&&raw.stats?.skipped===0&&raw.stats?.flaky===0&&tests.every(test=>test.status==='expected');
          fs.mkdirSync('.diagnostics',{recursive:true});fs.writeFileSync('.diagnostics/material-images-report.json',JSON.stringify({auditorCodeSha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,checkedAt:new Date().toISOString(),passed,scope:'Local synthetic illustrations rendered through candidate Notion renderer, Chromium and Linux WebKit plus existing renderer security tests. No Notion writes; no production signed image availability or physical iPhone certification.',stages,coverage,parseError,stats:raw.stats||{},runnerErrors:raw.errors||[],tests},null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-images-${{ github.run_id }}
          path: |
            .diagnostics/material-images-report.json
            /tmp/material-images-tests.json
            /tmp/material-images-errors.log
            /tmp/material-images-server.log
            test-results
      - name: Publish report and only verified renderer change
        if: always()
        run: |
          test -s .diagnostics/material-images-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diagnostics/material-images-report.json
          if node -e "if(!require('./.diagnostics/material-images-report.json').passed)process.exit(1)"; then
            git add 'src/app/baza/[id]/NotionContent.tsx'
          else
            git restore 'src/app/baza/[id]/NotionContent.tsx'
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: publish verified material image preview integration and report'
          for gmt_loop_attempt in 1 2 3 4; do
            printf 'Attempt %s\n' "$gmt_loop_attempt"
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
      - name: Require successful verification
        if: always()
        run: node -e "if(!require('./.diagnostics/material-images-report.json').passed)process.exit(1)"
