name: Integrate VIN history once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/integrate-vin-history.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/integrate-vin-history.py
      - run: npm ci
      - run: npm run build
      - name: Commit verified decoder integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/page.tsx
          git commit -m 'Connect VIN history and image summary directly to decoder'
          git push origin HEAD:main
