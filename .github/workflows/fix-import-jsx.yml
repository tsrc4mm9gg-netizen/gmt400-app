name: Prepare import JSX fix
on:
  push:
    branches: [seo-sitemap-robots]
    paths: [.github/workflows/fix-import-jsx.yml]
permissions:
  contents: write
jobs:
  prepare-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix exact JSX text and push separate branch
        shell: bash
        run: |
          set -euo pipefail
          git switch -c fix-import-jsx-threshold
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          text = p.read_text(encoding='utf-8')
          old = 'Osobowy >2000cm³'
          new = 'Osobowy &gt;2000cm³'
          count = text.count(old)
          print(f'Exact matches: {count}')
          if count == 0:
              for number, line in enumerate(text.splitlines(), 1):
                  if '2000' in line:
                      print(f'{number}: {line}')
              raise SystemExit('No exact matches; no files changed')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff -- src/app/page.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/page.tsx
          git commit -m 'Fix unescaped greater-than signs in import table'
          git push origin HEAD:refs/heads/fix-import-jsx-threshold
