name: Diagnose main JSX
on:
  push:
    branches: [seo-sitemap-robots]
    paths: [.github/workflows/fix-import-jsx.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Parse current source and publish diagnostic branch
        shell: bash
        run: |
          set -euo pipefail
          git switch -c diagnose-main-jsx
          npm install --prefix /tmp/gmt400-parser --ignore-scripts --no-audit --no-fund typescript@5
          mkdir -p .diagnostics
          node <<'JS' > .diagnostics/jsx.txt
          const ts = require('/tmp/gmt400-parser/node_modules/typescript');
          const fs = require('fs');
          const cp = require('child_process');
          const name = 'src/app/page.tsx';
          const text = fs.readFileSync(name, 'utf8');
          const lines = text.split('\n');
          const source = ts.createSourceFile(name, text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX);
          console.log('Source commit:', cp.execSync('git rev-parse HEAD').toString().trim());
          console.log('Parse errors:', source.parseDiagnostics.length);
          for (const d of source.parseDiagnostics.slice(0, 8)) {
            const pos = source.getLineAndCharacterOfPosition(d.start || 0);
            console.log('ERROR', pos.line + 1, pos.character + 1, ts.flattenDiagnosticMessageText(d.messageText, '\n'));
            for (let i = Math.max(0, pos.line - 20); i <= Math.min(lines.length - 1, pos.line + 8); i++) console.log((i + 1) + ': ' + lines[i]);
          }
          console.log('COMPONENT END');
          lines.slice(-25).forEach((line, i) => console.log((lines.length - 24 + i) + ': ' + line));
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diagnostics/jsx.txt
          git commit -m 'Record parser diagnostics for current main'
          git push origin HEAD:refs/heads/diagnose-main-jsx
