name: Diagnose fixed application build
on:
  push:
    branches: [seo-sitemap-robots]
    paths: [.github/workflows/fix-import-jsx.yml]
permissions:
  contents: write
jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fabea2eab55ce195d5df37dcc46241e65151ff50
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build without Vercel secrets and publish report
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -uo pipefail
          git switch -c diagnose-fixed-build || exit 1
          printf 'Source commit: ' > /tmp/gmt400-build.log
          git rev-parse HEAD >> /tmp/gmt400-build.log
          npm install --no-audit --no-fund >> /tmp/gmt400-build.log 2>&1
          install_status=$?
          printf '\nINSTALL_EXIT_CODE=%s\n' "$install_status" >> /tmp/gmt400-build.log
          if [ "$install_status" -eq 0 ]; then
            npm run build >> /tmp/gmt400-build.log 2>&1
            build_status=$?
            printf '\nBUILD_EXIT_CODE=%s\n' "$build_status" >> /tmp/gmt400-build.log
          fi
          set -e
          mkdir -p .diagnostics
          tail -c 18000 /tmp/gmt400-build.log > .diagnostics/build.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diagnostics/build.txt
          git commit -m 'Record full build result for JSX fix'
          git push origin HEAD:refs/heads/diagnose-fixed-build
