name: Mobile WebKit regression verification
on:
  push:
    branches: [main]
    paths: ['src/**','tests/**','package.json','package-lock.json','next.config.ts','playwright.webkit.config.cjs','.github/workflows/mobile-webkit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-webkit-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: install
        run: npm ci
      - id: build
        run: npm run build
      - id: tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps webkit
      - id: server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/mobile-webkit-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100 >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - id: tests
        continue-on-error: true
        run: npx playwright test --config=playwright.webkit.config.cjs --reporter=json > /tmp/mobile-webkit-tests.json 2>/tmp/mobile-webkit-errors.log
      - name: Generate report
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TOOLING: ${{ steps.tooling.outcome }}
          SERVER: ${{ steps.server.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          let raw = {}, parseError = '';
          try { raw = JSON.parse(fs.readFileSync('/tmp/mobile-webkit-tests.json','utf8')); } catch (error) { parseError = error.message; }
          const tests = [];
          function walk(suites) { for (const suite of suites || []) { for (const spec of suite.specs || []) for (const test of spec.tests || []) tests.push({ title:spec.title,file:spec.file || suite.file || '',status:test.status,attempts:(test.results || []).map(result => ({status:result.status,error:String(result.error?.message || '').slice(0,6000)})) }); walk(suite.suites); } }
          walk(raw.suites);
          const stages = Object.fromEntries(['INSTALL','BUILD','TOOLING','SERVER','TESTS'].map(key => [key,process.env[key]]));
          const minima = {'vehicle-filters.spec.cjs':3,'global-search.spec.cjs':3,'knowledge-categories.spec.cjs':8,'navigation.spec.cjs':6,'navigation-polish.spec.cjs':2,'diy-restoration.spec.cjs':2,'notion-pagination.spec.cjs':2,'notion-content.spec.cjs':3,'new-tools.spec.cjs':9,'parts-api.spec.cjs':5,'maintenance-api.spec.cjs':4,'tools-audit.spec.cjs':15};
          const coverage = Object.entries(minima).map(([file,minimum]) => ({file,minimum,count:tests.filter(test => test.file.split(/[\\/]/).pop() === file).length}));
          const stats = raw.stats || {};
          const passed = Object.values(stages).every(value => value === 'success') && !parseError && !(raw.errors || []).length && coverage.every(item => item.count >= item.minimum) && stats.expected === tests.length && stats.unexpected === 0 && stats.skipped === 0 && stats.flaky === 0 && tests.every(test => test.status === 'expected');
          fs.mkdirSync('.diagnostics',{recursive:true});
          fs.writeFileSync('.diagnostics/mobile-webkit-report.json',JSON.stringify({codeSha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,checkedAt:new Date().toISOString(),scope:'Linux WebKit with mobile viewport and touch; local production build, tools API tests and mocked Notion fixtures. Not physical iPhone, production Safari or live provider certification.',passed,stages,stats,coverage,parseError,runnerErrors:raw.errors || [],tests},null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Mobile WebKit verification: ' + (passed ? 'PASS' : 'FAIL') + '\nReport is attached as a workflow artifact; it is not committed to the repository.');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-webkit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .diagnostics/mobile-webkit-report.json
            /tmp/mobile-webkit-tests.json
            /tmp/mobile-webkit-errors.log
            /tmp/mobile-webkit-server.log
            test-results
      - name: Require complete verification
        if: always()
        run: node -e "if (!require('./.diagnostics/mobile-webkit-report.json').passed) process.exit(1)"
