name: Mobile WebKit regression verification
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'package.json', 'package-lock.json', 'next.config.ts', 'playwright.webkit.config.cjs', '.github/workflows/mobile-webkit.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mobile-webkit-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: install
        run: npm ci
      - id: build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/mobile-webkit-build.log
      - id: tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps webkit
      - id: server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/mobile-webkit-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100 > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - id: tests
        continue-on-error: true
        run: npx playwright test --config=playwright.webkit.config.cjs --reporter=json > /tmp/mobile-webkit-tests.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-webkit-verification-artifacts
          path: |
            test-results
            /tmp/mobile-webkit-build.log
            /tmp/mobile-webkit-server.log
          if-no-files-found: ignore
      - name: Publish mobile verification report
        if: always()
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          TOOLING_RESULT: ${{ steps.tooling.outcome }}
          SERVER_RESULT: ${{ steps.server.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          let raw = {};
          let buildDiagnostics = '';
          try { raw = JSON.parse(fs.readFileSync('/tmp/mobile-webkit-tests.json', 'utf8')); } catch {}
          try { buildDiagnostics = fs.readFileSync('/tmp/mobile-webkit-build.log', 'utf8').replace(/\u001b\[[0-9;]*m/g, '').slice(-12000); } catch {}
          const stats = raw.stats || {};
          const stages = { install: process.env.INSTALL_RESULT, build: process.env.BUILD_RESULT, tooling: process.env.TOOLING_RESULT, server: process.env.SERVER_RESULT, tests: process.env.TEST_RESULT };
          const passed = Object.values(stages).every(value => value === 'success') && stats.expected === 29 && stats.unexpected === 0 && stats.skipped === 0 && stats.flaky === 0;
          const tests = [];
          function walk(suites) { for (const suite of suites || []) { for (const spec of suite.specs || []) for (const test of spec.tests || []) tests.push({ title: spec.title, file: spec.file, status: test.status, attempts: (test.results || []).map(result => ({ status: result.status, error: String(result.error?.message || '').slice(0, 4000) })) }); walk(suite.suites); } }
          walk(raw.suites);
          fs.mkdirSync('.diagnostics', { recursive: true });
          fs.writeFileSync('.diagnostics/mobile-webkit-report.json', JSON.stringify({ codeSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, checkedAt: new Date().toISOString(), scope: 'Linux WebKit with mobile viewport, touch enabled, mocked Notion fixtures and existing direct server tests; not physical iPhone or live Safari certification', passed, stages, buildDiagnostics: process.env.BUILD_RESULT === 'failure' ? buildDiagnostics : '', stats, tests }, null, 2) + '\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diagnostics/mobile-webkit-report.json
          git commit -m 'ci: publish mobile WebKit verification [skip ci]'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - name: Require complete mobile verification
        if: always()
        run: node -e "if (!require('./.diagnostics/mobile-webkit-report.json').passed) process.exit(1)"
