name: Sync knowledge slug registry
on:
  workflow_dispatch:
  push:
    branches: [fix/knowledge-slug-completeness]
    paths:
      - '.github/workflows/sync-knowledge-slugs.yml'
      - 'scripts/sync-knowledge-slugs.mjs'
      - 'src/lib/slug-registry.mjs'
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
concurrency:
  group: sync-knowledge-slugs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/sync-knowledge-slugs.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - name: Verify existing slugs remain unchanged
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { extendSlugRegistry, normalizeId } from './src/lib/slug-registry.mjs';
          const before = JSON.parse(execFileSync('git', ['show', 'HEAD:data/knowledge-slugs.json'], { encoding: 'utf8' }));
          const after = JSON.parse(readFileSync('data/knowledge-slugs.json', 'utf8'));
          extendSlugRegistry(after, []);
          const byId = new Map(after.map(row => [normalizeId(row.id), row.slug]));
          for (const row of before) assert.equal(byId.get(normalizeId(row.id)), row.slug, `Changed or missing slug: ${row.id}`);
          assert.ok(after.length >= before.length, 'Registry must not shrink');
          console.log(JSON.stringify({ previous: before.length, current: after.length, added: after.length - before.length, existingSlugsPreserved: true }));
          NODE
      - name: Commit registry changes
        run: |
          if [[ -n "$(git status --porcelain data/knowledge-slugs.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/knowledge-slugs.json
            git commit -m "chore(seo): sync knowledge slug registry"
            git push
          fi
