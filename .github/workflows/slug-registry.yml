name: Verify slug registry
on:
  pull_request:
    paths:
      - 'src/lib/slug-registry.mjs'
      - 'tests/slug-registry.test.mjs'
      - '.github/workflows/slug-registry.yml'
  push:
    branches: [seo/baza-slug-urls]
    paths:
      - 'src/lib/slug-registry.mjs'
      - 'tests/slug-registry.test.mjs'
      - '.github/workflows/slug-registry.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/slug-registry.test.mjs
