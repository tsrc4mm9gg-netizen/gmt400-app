name: Verify related material rules
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/lib/related-materials.ts'
      - 'src/lib/knowledge-slug-map.ts'
      - 'data/knowledge-slugs.json'
      - 'src/app/RelatedMaterialSuggestions.tsx'
      - 'src/app/RelatedMaterialSuggestionsClient.tsx'
      - 'src/app/RelatedMaterials.tsx'
      - 'tests/related-materials-rules.test.cjs'
      - 'tests/related-materials-component.test.cjs'
      - '.github/workflows/related-materials-rules.yml'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Test related material rules and server-rendered baseline
        run: node --test tests/related-materials-rules.test.cjs tests/related-materials-component.test.cjs
