name: Verify related material rules
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/lib/related-materials.ts'
      - 'tests/related-materials-rules.test.cjs'
      - '.github/workflows/related-materials-rules.yml'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - name: Test related material rules
        run: node --test tests/related-materials-rules.test.cjs
