name: Verify and connect grouped model catalog
on:
  push:
    branches: [main]
    paths: ['src/app/ModelCatalog.tsx', 'src/lib/model-catalog.ts', 'tests/model-catalog.spec.cjs', 'scripts/connect-model-catalog.cjs', '.github/workflows/model-catalog.yml']
permissions:
  contents: write
concurrency:
  group: model-catalog-integration
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: patch
        run: node scripts/connect-model-catalog.cjs
      - run: npm ci
      - id: build
        run: npm run build
      - run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium webkit
      - id: server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/models-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100 > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - id: chromium
        continue-on-error: true
        run: npx playwright test tests/vehicle-filters.spec.cjs tests/global-search.spec.cjs tests/knowledge-categories.spec.cjs tests/navigation.spec.cjs tests/navigation-polish.spec.cjs tests/diy-restoration.spec.cjs tests/notion-pagination.spec.cjs tests/notion-content.spec.cjs tests/model-catalog.spec.cjs --workers=1 --output=test-results/chromium --reporter=json > /tmp/model-chromium.json
      - id: webkit
        continue-on-error: true
        run: |
          node -e "const fs=require('node:fs');const base=require('./playwright.webkit.config.cjs');fs.writeFileSync('playwright.models.generated.config.cjs','module.exports = '+JSON.stringify({...base,testMatch:[...base.testMatch,'model-catalog.spec.cjs']})+';')"
          npx playwright test --config=playwright.models.generated.config.cjs --output=test-results/webkit --reporter=json > /tmp/model-webkit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-catalog-verification
          path: test-results
          if-no-files-found: ignore
      - name: Publish report and activate catalog only after both browsers pass
        if: always()
        env:
          PATCH_RESULT: ${{ steps.patch.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          CHROMIUM_RESULT: ${{ steps.chromium.outcome }}
          WEBKIT_RESULT: ${{ steps.webkit.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const reports = {};
          for (const browser of ['chromium','webkit']) {
            let raw = {};
            try { raw = JSON.parse(fs.readFileSync('/tmp/model-' + browser + '.json','utf8')); } catch {}
            const stats = raw.stats || {};
            const failures = [];
            function walk(suites) { for (const suite of suites || []) { for (const spec of suite.specs || []) for (const test of spec.tests || []) if (test.status !== 'expected') failures.push({ title: spec.title, status: test.status, errors: (test.results || []).map(result => String(result.error?.message || '').slice(0,3000)) }); walk(suite.suites); } }
            walk(raw.suites);
            reports[browser] = { passed: stats.expected === 33 && stats.unexpected === 0 && stats.skipped === 0 && stats.flaky === 0, stats, failures };
          }
          const stages = { patch: process.env.PATCH_RESULT, build: process.env.BUILD_RESULT, chromium: process.env.CHROMIUM_RESULT, webkit: process.env.WEBKIT_RESULT };
          const passed = Object.values(stages).every(value => value === 'success') && Object.values(reports).every(report => report.passed);
          fs.mkdirSync('.diagnostics',{ recursive:true });
          fs.writeFileSync('.diagnostics/model-catalog-report.json',JSON.stringify({ codeSha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,checkedAt:new Date().toISOString(),scope:'Grouped source records; Chromium and mobile WebKit mocked-fixture regressions, not a live Notion or historical-accuracy audit',passed,integrationApplied:passed,stages,reports },null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diagnostics/model-catalog-report.json
          if node -e "process.exit(require('./.diagnostics/model-catalog-report.json').passed?0:1)"; then
            git add src/app/page.tsx
            git commit -m 'Activate verified family and variant model catalog'
          else
            git commit -m 'ci: publish failed model catalog verification [skip ci]'
          fi
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - if: always()
        run: node -e "if(!require('./.diagnostics/model-catalog-report.json').passed) process.exit(1)"
