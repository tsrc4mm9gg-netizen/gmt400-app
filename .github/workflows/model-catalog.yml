name: Verify and connect grouped model catalog
on:
  push:
    branches: [main]
    paths: ['src/app/ModelCatalog.tsx', 'src/app/Encyclopedia.tsx', 'src/app/modele/**', 'src/lib/model-catalog.ts', 'tests/model-catalog.spec.cjs', 'scripts/connect-model-catalog.cjs', '.github/workflows/model-catalog.yml']
  workflow_dispatch:
# Verification only: the catalog integration landed on 16.10 (02cb13d), so this workflow
# no longer patches or commits anything. The report is published as an artifact and job summary.
permissions:
  contents: read
concurrency:
  group: model-catalog-integration
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: patch
        name: Verify catalog wiring (structure, no file writes)
        run: node scripts/connect-model-catalog.cjs
      - run: npm ci
      - id: build
        run: npm run build
      - run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium webkit
      - id: server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/models-server.log 2>&1 &
          for gmt_loop_attempt in $(seq 1 60); do
            printf 'Attempt %s\n' "$gmt_loop_attempt"
            if curl -fsS http://127.0.0.1:3100 > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - id: chromium
        continue-on-error: true
        run: npx playwright test tests/model-catalog.spec.cjs --workers=1 --output=test-results/chromium --reporter=json > /tmp/model-chromium.json
      - id: webkit
        continue-on-error: true
        run: |
          node -e "const fs=require('node:fs');const base=require('./playwright.webkit.config.cjs');fs.writeFileSync('playwright.models.generated.config.cjs','module.exports = '+JSON.stringify({...base,testMatch:['model-catalog.spec.cjs']})+';')"
          npx playwright test --config=playwright.models.generated.config.cjs --output=test-results/webkit --reporter=json > /tmp/model-webkit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-catalog-verification
          path: test-results
          if-no-files-found: ignore
      - name: Write verification report
        if: always()
        env:
          PATCH_RESULT: ${{ steps.patch.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          CHROMIUM_RESULT: ${{ steps.chromium.outcome }}
          WEBKIT_RESULT: ${{ steps.webkit.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const reports = {};
          for (const browser of ['chromium','webkit']) {
            let raw = {};
            try { raw = JSON.parse(fs.readFileSync('/tmp/model-' + browser + '.json','utf8')); } catch {}
            const stats = raw.stats || {};
            const failures = [];
            function walk(suites) { for (const suite of suites || []) { for (const spec of suite.specs || []) for (const test of spec.tests || []) if (test.status !== 'expected') failures.push({ title: spec.title, status: test.status, errors: (test.results || []).map(result => String(result.error?.message || '').slice(0,3000)) }); walk(suite.suites); } }
            walk(raw.suites);
            reports[browser] = { passed: stats.expected > 0 && stats.unexpected === 0 && stats.skipped === 0 && stats.flaky === 0, stats, failures };
          }
          const stages = { patch: process.env.PATCH_RESULT, build: process.env.BUILD_RESULT, chromium: process.env.CHROMIUM_RESULT, webkit: process.env.WEBKIT_RESULT };
          const passed = Object.values(stages).every(value => value === 'success') && Object.values(reports).every(report => report.passed);
          fs.mkdirSync('.diagnostics',{ recursive:true });
          fs.writeFileSync('.diagnostics/model-catalog-report.json',JSON.stringify({ codeSha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,checkedAt:new Date().toISOString(),scope:'Grouped source records; Chromium and mobile WebKit mocked-fixture regressions, not a live Notion or historical-accuracy audit',passed,integrationApplied:'n/a (integrated 2026-10-16, 02cb13d)',stages,reports },null,2)+'\n');
          NODE
          node -e "const r=require('./.diagnostics/model-catalog-report.json');console.log(JSON.stringify({passed:r.passed,stages:r.stages,chromium:r.reports.chromium.stats,webkit:r.reports.webkit.stats}))"
          { echo '### Model catalog verification'; echo; echo '```json'; cat .diagnostics/model-catalog-report.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-catalog-report
          path: .diagnostics/model-catalog-report.json
          if-no-files-found: ignore
      - if: always()
        run: node -e "if(!require('./.diagnostics/model-catalog-report.json').passed) process.exit(1)"
