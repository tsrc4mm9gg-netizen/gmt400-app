name: Verify related materials on iPhone

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/app/RelatedMaterialSuggestions.tsx'
      - 'src/app/RelatedMaterialSuggestionsClient.tsx'
      - 'src/app/RelatedMaterials.tsx'
      - 'src/lib/related-materials.ts'
      - 'src/lib/vehicle-profile.ts'
      - 'src/lib/vehicle-profile-store.ts'
      - 'tests/e2e/related-materials-ios.mjs'
      - '.github/workflows/related-materials-ios-e2e.yml'

permissions:
  contents: write

jobs:
  iphone-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright without changing project dependencies
        run: npm install --no-save --no-package-lock playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run iPhone E2E test
        env:
          E2E_BASE_URL: https://www.gmt400.pl
        run: node tests/e2e/related-materials-ios.mjs

      - name: Publish screenshots as public release assets
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view related-materials-iphone --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create related-materials-iphone \
              --repo "$GITHUB_REPOSITORY" \
              --title "iPhone screenshots — related materials" \
              --notes "Automatyczne zrzuty z testu SSR powiązanych materiałów i personalizacji profilu auta."
          gh release upload related-materials-iphone \
            artifacts/iphone-no-profile.png \
            artifacts/iphone-with-profile.png \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-related-materials-screenshots
          path: artifacts/
          if-no-files-found: warn
