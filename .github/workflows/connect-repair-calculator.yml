name: Connect expanded repair calculator
on:
  push:
    branches: [main]
    paths: ['.github/workflows/connect-repair-calculator.yml']
permissions:
  contents: write
concurrency:
  group: connect-repair-calculator
  cancel-in-progress: false
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 scripts/connect-repair-calculator.py
      - run: npm ci
      - run: npm run build
      - name: Commit only the checked calculator integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/page.tsx
          git commit -m 'feat(costs): connect expanded repair calculator'
          git push origin HEAD:main
