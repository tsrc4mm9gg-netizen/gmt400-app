version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      compatible-dependencies:
        update-types: [minor, patch]
    commit-message:
      prefix: 'deps'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 3
    groups:
      compatible-actions:
        update-types: [minor, patch]
    commit-message:
      prefix: 'ci'
